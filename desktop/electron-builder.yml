appId: org.spacedatanetwork.desktop
productName: Space Data Network
copyright: Copyright © Space Data Network

files:
  - src/**/*
  - assets/**/*
  - '!assets/sdn-node/**/*'
  - node_modules/**/*
  - package.json

directories:
  buildResources: assets/build

# The node bundle ships beside the asar, never inside it: its binaries have to
# be executable files on disk, and an asar entry is not a file the OS can exec.
extraResources:
  - from: assets/sdn-node
    to: sdn-node
    filter: ['**/*']

# Notarization runs only when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID are all set; otherwise the hook returns immediately.
afterSign: './pkgs/macos/notarize-build.js'
# With no signing identity the app is ad-hoc signed, which is what lets it run
# on Apple Silicon at all.
afterPack: './pkgs/macos/adhoc-sign.js'

mac:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  category: public.app-category.utilities
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: './pkgs/macos/entitlements.mac.plist'
  entitlementsInherit: './pkgs/macos/entitlements.mac.plist'
  # NOT universal: the bundled node is one architecture, so each app is too.
  target:
    - target: dmg
      arch: ['arm64', 'x64']
    - target: zip
      arch: ['arm64', 'x64']

dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  iconSize: 160
  iconTextSize: 12
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 170
      type: file
    - x: 480
      y: 170
      type: link
      path: /Applications

win:
  artifactName: ${name}-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch: ['x64']
    - target: portable
      arch: ['x64']

nsis:
  artifactName: ${name}-${version}-win-${arch}.${ext}
  include: assets/build/nsis.nsh
  oneClick: false
  warningsAsErrors: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

portable:
  artifactName: ${name}-portable-${version}-win-${arch}.${ext}

linux:
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  executableName: space-data-network
  executableArgs:
    - --no-sandbox
  icon: space-data-network
  category: Network
  synopsis: Runs a Space Data Network node
  description: Runs a Space Data Network node and opens the node's own dashboard.
  maintainer: release@spacedatanetwork.org
  target:
    - target: AppImage
      arch: ['x64']
    - target: deb
      arch: ['x64']
    - target: tar.xz
      arch: ['x64']

publish:
  - provider: github
    owner: DigitalArsenal
    repo: space-data-network
