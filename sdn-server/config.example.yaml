# Asset pinning is opt-in. Keep this disabled until the host is ready to
# authenticate the fixed GitHub Actions workflows and persist approved assets.
# When enabled, issuer, audience, repository, ref, pin_workflow,
# decision_workflow, gateway_url, and kubo_repo_path are all required;
# gateway_url must be an absolute HTTPS URL.
asset_pins:
  enabled: false
  issuer: https://token.actions.githubusercontent.com
  audience: sdn-asset-models
  repository: DigitalArsenal/asset-models
  ref: refs/heads/main
  pin_workflow: DigitalArsenal/asset-models/.github/workflows/asset-loop.yml@refs/heads/main
  decision_workflow: DigitalArsenal/asset-models/.github/workflows/review-decision.yml@refs/heads/main
  gateway_url: https://sdn.spaceaware.io/ipfs
  kubo_repo_path: /mnt/volume_nyc3_01/ipfs
  # Zero selects DefaultAssetPinMaxUploadBytes (10,000,000 bytes).
  max_upload_bytes: 0
  # Zero selects DefaultAssetPinMinFreeBytes (10 GiB).
  min_free_bytes: 0
  # Zero selects DefaultAssetPinRetentionInterval (one hour).
  retention_interval: 0s

# GeoIP powers the node-status dashboard map. It is fail-open: if the database
# is absent, peers are reported without coordinates and nothing else breaks.
# Provision a MaxMind GeoLite2-City .mmdb to enable it. Leave mmdb_path unset to
# use the default <data-dir>/geoip/GeoLite2-City.mmdb.
geoip:
  # mmdb_path: /path/to/GeoLite2-City.mmdb

# Public read-only node-status feed served at /ws/status. Same-origin browser
# handshakes and loopback/dev origins are always allowed; list any additional
# cross-origin dashboard hosts here (full origins, scheme://host[:port]).
status:
  allowed_origins:
    - https://sdn.spaceaware.io
