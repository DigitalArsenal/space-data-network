name: Publish container image

# Builds deployment/docker/Dockerfile for linux/amd64 and pushes it to Docker
# Hub as dockerdigitalarsenal/space-data-network:<version> (plus `beta` for a
# pre-release tag, `latest` for a release tag). Runs for every v* tag and on
# demand for a named ref. The image carries the same inputs the local release
# cut stages: the Kubo web UI build, the same-origin wallet sign-in assets
# (deployment/wallet-wasm/stage-wallet-wasm.sh) and the HD wallet module from
# the pinned hd-wallet-wasm package.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build, for example v1.0.5-beta.1
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: dockerdigitalarsenal/space-data-network

# Least privilege (security audit SEC-042/SEC-044): nothing by default; the one
# job names what it needs, and runs in the dockerhub environment that holds
# DOCKERHUB_TOKEN behind the owner's required reviewers.
permissions: {}

jobs:
  build-and-push:
    name: Build, push and sign
    runs-on: ubuntu-latest
    # A push trigger only fires on v* tags; a manual run must start from main
    # or a v* tag (the ref input then names the tag to build).
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    environment: dockerhub
    permissions:
      contents: read
      id-token: write # keyless cosign signature of the pushed digest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          # Passed through the environment, never expanded into the script.
          REQUESTED_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          ref="${REQUESTED_REF}"
          tag="${ref#refs/tags/}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ref '$ref' is not a release tag (v<semver>)" >&2
            exit 1
          fi
          channel=latest
          [[ "$version" == *-* ]] && channel=beta
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            sdn-js/package-lock.json
            webui/package-lock.json

      - name: Install the pinned wallet packages
        working-directory: sdn-js
        run: npm ci --no-audit --fund=false

      - name: Stage the same-origin wallet sign-in assets
        run: |
          deployment/wallet-wasm/stage-wallet-wasm.sh \
            deployment/wallet-wasm/staged/wallet-wasm \
            deployment/wallet-wasm/staged/wallet-ui

      - name: Build the Kubo web UI
        working-directory: webui
        run: |
          npm ci --no-audit --fund=false
          npm run build
          test -f build/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: dockerdigitalarsenal
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@e1523de7571e31dbe865fd2e80c5c7c23ae71eb4 # v3.4.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SDN_RELEASE_TAG=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.channel }}
          provenance: true
          sbom: true

      - name: Sign the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_VERSION: ${{ steps.tag.outputs.version }}
          IMAGE_CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          cosign sign --yes \
            "${IMAGE_NAME}:${IMAGE_VERSION}@${DIGEST}" \
            "${IMAGE_NAME}:${IMAGE_CHANNEL}@${DIGEST}"
          echo "pushed ${IMAGE_NAME}:${IMAGE_VERSION} (${DIGEST})"
