name: Publish container image

# Builds deployment/docker/Dockerfile for linux/amd64 and pushes it to Docker
# Hub as dockerdigitalarsenal/space-data-network:<version> (plus `beta` for a
# pre-release tag, `latest` for a release tag). The image carries the same
# inputs the local release cut stages: the Kubo web UI build, the same-origin
# wallet sign-in assets (deployment/wallet-wasm/stage-wallet-wasm.sh) and the
# HD wallet module from the pinned hd-wallet-wasm package.
#
# It builds the tag it RUNS FROM and nothing else (security audit SEC-044). A
# push of a v* tag starts it; to rebuild a tag by hand, dispatch the workflow
# ON that tag: `gh workflow run docker-publish.yml --ref v1.0.5-beta.1`.
# There is deliberately no ref input: a run dispatched from main with
# `-f ref=<name>` used to check out <name>, and actions/checkout resolves an
# unqualified name to a BRANCH before a tag, so any writer's branch named like
# a version was built, pushed and cosign-signed as a release image.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: dockerdigitalarsenal/space-data-network

# Least privilege (security audit SEC-042/SEC-044): nothing by default; the one
# job names what it needs, and runs in the dockerhub environment that holds
# DOCKERHUB_TOKEN behind the owner's required reviewers.
permissions: {}

jobs:
  build-and-push:
    name: Build, push and sign
    runs-on: ubuntu-latest
    # Only a v* tag: the push trigger fires on nothing else, and a manual run
    # from a branch (main included) is refused here.
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    environment: dockerhub
    permissions:
      contents: read
      id-token: write # keyless cosign signature of the pushed digest
    steps:
      # No ref: the checkout is github.sha, the commit the tag the run started
      # from points at.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        env:
          # Passed through the environment, never expanded into the script.
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${REF_TYPE}" != tag || "${REF}" != refs/tags/v* ]]; then
            echo "::error::'${REF}' is not a v* tag; dispatch this workflow on the tag to build" >&2
            exit 1
          fi
          tag="${REF#refs/tags/}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' is not a release tag (v<semver>)" >&2
            exit 1
          fi
          # The checked-out commit is the tag's, and it is on main: a tag
          # pushed onto an unreviewed branch is not a release.
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "::error::checked-out commit is not the commit tag ${tag} names" >&2
            exit 1
          fi
          on_main="$(gh api "repos/${GITHUB_REPOSITORY}/compare/refs/heads/main...${GITHUB_SHA}" --jq .status)" || on_main=unknown
          if [[ "${on_main}" != identical && "${on_main}" != behind ]]; then
            echo "::error::tag ${tag} (${GITHUB_SHA}) is not on main (${on_main}); refusing to publish it" >&2
            exit 1
          fi
          channel=latest
          [[ "$version" == *-* ]] && channel=beta
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            sdn-js/package-lock.json
            webui/package-lock.json

      - name: Install the pinned wallet packages
        working-directory: sdn-js
        run: npm ci --no-audit --fund=false

      - name: Stage the same-origin wallet sign-in assets
        run: |
          deployment/wallet-wasm/stage-wallet-wasm.sh \
            deployment/wallet-wasm/staged/wallet-wasm \
            deployment/wallet-wasm/staged/wallet-ui

      - name: Build the Kubo web UI
        working-directory: webui
        run: |
          npm ci --no-audit --fund=false
          npm run build
          test -f build/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: dockerdigitalarsenal
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@e1523de7571e31dbe865fd2e80c5c7c23ae71eb4 # v3.4.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SDN_RELEASE_TAG=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.channel }}
          provenance: true
          sbom: true

      - name: Sign the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_VERSION: ${{ steps.tag.outputs.version }}
          IMAGE_CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          cosign sign --yes \
            "${IMAGE_NAME}:${IMAGE_VERSION}@${DIGEST}" \
            "${IMAGE_NAME}:${IMAGE_CHANNEL}@${DIGEST}"
          echo "pushed ${IMAGE_NAME}:${IMAGE_VERSION} (${DIGEST})"
