name: Publish container image

# Builds deployment/docker/Dockerfile for linux/amd64 and pushes it to Docker
# Hub as dockerdigitalarsenal/space-data-network:<version> (plus `beta` for a
# pre-release tag, `latest` for a release tag). Runs for every v* tag and on
# demand for a named ref. The image carries the same inputs the local release
# cut stages: the Kubo web UI build, the same-origin wallet sign-in assets
# (deployment/wallet-wasm/stage-wallet-wasm.sh) and the HD wallet module from
# the pinned hd-wallet-wasm package.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build, for example v1.0.5-beta.1
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: dockerdigitalarsenal/space-data-network

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build, push and sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve tag
        id: tag
        run: |
          ref="${{ inputs.ref || github.ref_name }}"
          tag="${ref#refs/tags/}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ref '$ref' is not a release tag (v<semver>)" >&2
            exit 1
          fi
          channel=latest
          [[ "$version" == *-* ]] && channel=beta
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            sdn-js/package-lock.json
            webui/package-lock.json

      - name: Install the pinned wallet packages
        working-directory: sdn-js
        run: npm ci --no-audit --fund=false

      - name: Stage the same-origin wallet sign-in assets
        run: |
          deployment/wallet-wasm/stage-wallet-wasm.sh \
            deployment/wallet-wasm/staged/wallet-wasm \
            deployment/wallet-wasm/staged/wallet-ui

      - name: Build the Kubo web UI
        working-directory: webui
        run: |
          npm ci --no-audit --fund=false
          npm run build
          test -f build/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dockerdigitalarsenal
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SDN_RELEASE_TAG=${{ steps.tag.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.channel }}
          provenance: true
          sbom: true

      - name: Sign the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "${IMAGE_NAME}:${{ steps.tag.outputs.version }}@${DIGEST}" \
            "${IMAGE_NAME}:${{ steps.tag.outputs.channel }}@${DIGEST}"
          echo "pushed ${IMAGE_NAME}:${{ steps.tag.outputs.version }} (${DIGEST})"
