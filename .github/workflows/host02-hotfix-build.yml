name: host-02 hotfix build (linux-amd64 daemon only)

# Builds ONE binary, the linux-amd64 daemon, from this branch (release v1.1.9
# plus the snapshot guard of stack #982 and the IPNS pointer fix of stack #980)
# for a hand install on host-02 (celestrak.eth). Nothing is published: no
# release, no image, no update feed or signal. The steps are v1.1.9's own
# beta-release-artifacts.yml steps for the linux-amd64 legs of the
# wasmedge-static and cli jobs.

on:
  push:
    branches: [host02-v1.1.9-gp-guard-ipns]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WASMEDGE_VERSION: 0.16.4

jobs:
  daemon:
    name: Build the linux-amd64 daemon
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    env:
      WASMEDGE_DIR: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
    steps:
      - name: Prepare the container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          key: wasmedge-static-${{ env.WASMEDGE_VERSION }}-linux-amd64-focal-llvm16-${{ hashFiles('scripts/build-static-wasmedge.sh', 'scripts/wasmedge-static-env.sh') }}
      - name: Install build toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CMAKE_VERSION: '3.31.6'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-16 main" > /etc/apt/sources.list.d/llvm.list
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ninja-build clang-16 llvm-16-dev liblld-16-dev libpolly-16-dev \
            libzstd-dev zlib1g-dev libtinfo-dev build-essential
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" | tar -xz -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build the static prefix
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          . scripts/wasmedge-static-env.sh
          WASMEDGE_STATIC_WORK="${GITHUB_WORKSPACE}/.sdn-wasmedge-static" \
          WASMEDGE_STATIC_PREFIX_ONLY=1 \
          bash scripts/build-static-wasmedge.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Build the daemon
        env:
          SDN_GO_LDFLAGS: -X github.com/spacedatanetwork/sdn-server/internal/versioninfo.ReleaseTag=v1.1.9-host02.1
        run: |
          mkdir -p dist/cli-input
          GOOS=linux GOARCH=amd64 ./scripts/go-with-wasmedge.sh build -o "${PWD}/dist/cli-input/spacedatanetwork" ./cmd/spacedatanetwork
      - name: Prove the binary carries the runtime
        run: |
          set -euo pipefail
          bin="${PWD}/dist/cli-input/spacedatanetwork"
          deps="$(ldd "${bin}" 2>&1 || true)"
          printf '%s\n' "${deps}"
          printf '%s\n' "${deps}" | grep -i wasmedge && { echo "::error::links libwasmedge dynamically"; exit 1; } || true
          printf '%s\n' "${deps}" | grep -i 'libstdc++\|libgcc_s' && { echo "::error::links libstdc++/libgcc_s dynamically"; exit 1; } || true
          sha256sum "${bin}" | tee dist/cli-input/spacedatanetwork.sha256
      - name: Substrate self-test
        run: ./dist/cli-input/spacedatanetwork substrate-selftest --require-patched
      - name: Snapshot guard and IPNS pointer tests on Linux
        working-directory: sdn-server
        env:
          SDN_WASM_REQUIRE_PATCHED: '1'
        run: ../scripts/go-with-wasmedge.sh test ./internal/api/ -count=1 -run 'TestSnapshotGuard|TestIPNSPointer|TestPublishIPNSName|TestPublicationRetentionRespectsBatchSemantics' -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spacedatanetwork-linux-amd64-host02-hotfix
          path: |
            dist/cli-input/spacedatanetwork
            dist/cli-input/spacedatanetwork.sha256
          retention-days: 14
