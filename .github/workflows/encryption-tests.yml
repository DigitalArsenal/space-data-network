# SDN Encryption Tests CI/CD Pipeline
# Runs comprehensive encryption tests between all node types

name: Encryption Tests

# Last ran 2026-02-24. Like security.yml, it was workflow_dispatch-only, so
# the Playwright, Docker-compose and benchmark halves of this suite have not
# executed in seven months. The Go half (tests/encryption/go) is cheap and
# deterministic and now runs in the CI pipeline itself — scripts/ci-local.sh
# encryption, in the preflight job — so a regression there is caught per
# commit. This workflow keeps the parts that need a browser, a docker
# network or a benchmark baseline, on a weekly cadence.
on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:
    inputs:
      skip_go_tests:
        description: 'Skip Go tests'
        required: false
        default: 'false'
      skip_playwright_tests:
        description: 'Skip Playwright tests'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.24'
  NODE_VERSION: '24'

# Least privilege (security audit SEC-042/SEC-044): the workflow token gets
# nothing by default and every job names exactly the scopes it needs.
permissions: {}

jobs:
  # ============================================
  # Go ECIES and Server-to-Server Tests
  # ============================================
  go-encryption-tests:
    name: Go Encryption Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_go_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tests/encryption/go/go.sum

      - name: Download Go dependencies
        run: |
          cd tests/encryption/go
          go mod download

      - name: Run ECIES tests
        run: |
          cd tests/encryption/go
          go test -v -count=1 -race ./ecies/... -coverprofile=coverage-ecies.out

      - name: Run Server-to-Server tests
        run: |
          cd tests/encryption/go
          go test -v -count=1 -race ./server_to_server/... -coverprofile=coverage-s2s.out

      - name: Run Relay tests
        run: |
          cd tests/encryption/go
          go test -v -count=1 -race ./relay/... -coverprofile=coverage-relay.out

      - name: Run Desktop tests
        run: |
          cd tests/encryption/go
          go test -v -count=1 -race ./desktop/... -coverprofile=coverage-desktop.out

      - name: Run Cross-Node tests
        run: |
          cd tests/encryption/go
          go test -v -count=1 -race ./crossnode/... -coverprofile=coverage-crossnode.out

      - name: Run benchmarks
        run: |
          cd tests/encryption/go
          go test -bench=. -benchmem ./... | tee benchmark-results.txt

      - name: Upload coverage reports
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3.1.6
        with:
          files: |
            tests/encryption/go/coverage-ecies.out
            tests/encryption/go/coverage-s2s.out
            tests/encryption/go/coverage-relay.out
            tests/encryption/go/coverage-desktop.out
            tests/encryption/go/coverage-crossnode.out
          flags: encryption-go
          name: go-encryption-coverage

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-benchmark-results
          path: tests/encryption/go/benchmark-results.txt

  # ============================================
  # Playwright Browser Encryption Tests
  # ============================================
  playwright-encryption-tests:
    name: Playwright Browser Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_playwright_tests != 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: tests/encryption/playwright/package-lock.json

      - name: Install Playwright dependencies
        run: |
          cd tests/encryption/playwright
          npm ci
          npx playwright install --with-deps chromium firefox

      - name: Run Playwright tests
        run: |
          cd tests/encryption/playwright
          npx playwright test --reporter=html,json
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: tests/encryption/playwright/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-test-results
          path: tests/encryption/playwright/test-results.json
          retention-days: 30

  # ============================================
  # Integration Tests with Docker Network
  # ============================================
  integration-tests:
    name: Integration Tests (Docker Network)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [go-encryption-tests]

    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Cache Docker layers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build test images
        run: |
          cd tests/encryption
          docker-compose -f docker-compose.test.yaml build

      - name: Start test network
        run: |
          cd tests/encryption
          docker-compose -f docker-compose.test.yaml up -d server-alice server-bob edge-relay-1
          sleep 30  # Wait for services to be ready

      - name: Check service health
        run: |
          cd tests/encryption
          docker-compose -f docker-compose.test.yaml ps
          docker-compose -f docker-compose.test.yaml logs server-alice

      - name: Run integration tests
        run: |
          cd tests/encryption
          docker-compose -f docker-compose.test.yaml --profile testing run --rm go-tests

      - name: Collect logs
        if: always()
        run: |
          cd tests/encryption
          docker-compose -f docker-compose.test.yaml logs > docker-logs.txt

      - name: Upload Docker logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: docker-logs
          path: tests/encryption/docker-logs.txt

      - name: Cleanup
        if: always()
        run: |
          cd tests/encryption
          docker-compose -f docker-compose.test.yaml down -v

  # ============================================
  # Security Scan
  # ============================================
  security-scan:
    name: Crypto Security Scan
    permissions:
      contents: read
      security-events: write # upload the Trivy SARIF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'tests/encryption'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./tests/encryption
          # The action runs ghcr.io/trufflesecurity/trufflehog:<version>, and
          # its default version is `latest`: pin the scanner image by digest
          # too, not just the action (SEC-042).
          version: 3.99.2@sha256:47a84bc18a0d04a165498bbbd3bacfd84176661cbc91f8e0f85467f6a771e99a
          extra_args: --only-verified

  # ============================================
  # Performance Regression Tests
  # ============================================
  performance-tests:
    name: Performance Regression Tests
    permissions:
      contents: write # github-action-benchmark pushes results to gh-pages and comments on alerts
    runs-on: ubuntu-latest
    needs: [go-encryption-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tests/encryption/go/go.sum

      - name: Run performance benchmarks
        run: |
          cd tests/encryption/go
          go test -bench=. -benchmem -count=5 ./... | tee benchmark.txt

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: 'go'
          output-file-path: tests/encryption/go/benchmark.txt
          fail-on-alert: true
          alert-threshold: '150%'
          comment-on-alert: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

  # ============================================
  # Summary Job
  # ============================================
  test-summary:
    name: Test Summary
    permissions: {}
    runs-on: ubuntu-latest
    needs: [go-encryption-tests, playwright-encryption-tests, integration-tests, security-scan]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.go-encryption-tests.result }}" == "failure" ]]; then
            echo "Go encryption tests failed"
            exit 1
          fi
          if [[ "${{ needs.playwright-encryption-tests.result }}" == "failure" ]]; then
            echo "Playwright tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo "Security scan failed"
            exit 1
          fi
          echo "All encryption tests passed!"
