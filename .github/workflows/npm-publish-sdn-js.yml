name: Publish sdn-js to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: 'false'
        type: boolean
      tag:
        description: 'npm dist-tag (e.g. latest, next, beta)'
        required: false
        default: 'latest'
        type: string

concurrency:
  group: npm-publish-sdn-js
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance

    steps:
      - uses: actions/checkout@v4
        # No submodules: build:package compiles sdn-js/src only, and the
        # private SpaceAware-UI submodule fails an unauthenticated recursive
        # checkout (sdn-js-npm-publish-blocked-by-submodule).

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: sdn-js/package-lock.json

      - name: Install dependencies
        working-directory: sdn-js
        run: npm ci

      # This workflow publishes on `release: published` and on workflow_dispatch,
      # neither of which is tied to a green CI run on the published commit —
      # prepublishOnly is only `check:versions && build:package`. So the publish
      # lane verified the package built, never that it worked. ci.yml runs this
      # same suite on pushes to main; running it here is what makes the ARTIFACT
      # gated rather than the branch.
      - name: Test
        working-directory: sdn-js
        run: npm test

      # sdn-js ran two incompatible libp2p majors once, bridged by hand-written
      # shims in src/helia.ts. The split is closed and the check now asserts one
      # copy of each package on the critical path. This is the last point before
      # the tree reaches every consumer of the package.
      - name: Verify helia/libp2p dependency layering
        run: node scripts/check-sdn-js-dependency-layering.mjs

      - name: Build
        working-directory: sdn-js
        run: npm run build:package

      - name: Verify package contents
        working-directory: sdn-js
        run: |
          echo "=== Package contents ==="
          npm pack --dry-run 2>&1
          echo ""
          echo "=== Checking required files ==="
          for f in dist/index.mjs dist/index.d.ts; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing $f"
              exit 1
            fi
          done
          echo "All required files present."

      - name: Determine dist-tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || 'latest' }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            case "$TAG_NAME" in
              *beta*)
                echo "tag=beta" >> $GITHUB_OUTPUT
                ;;
              *alpha*)
                echo "tag=alpha" >> $GITHUB_OUTPUT
                ;;
              *rc*|*next*)
                echo "tag=next" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "tag=latest" >> $GITHUB_OUTPUT
                ;;
            esac
          fi

      # EVERY SDN release fires this workflow, and an SDN release does not
      # change sdn-js's version — so npm is asked to publish a version it
      # already has and answers 403. That has failed on every release since at
      # least v1.0.4-beta.18 (2026-09-04); the last genuine publish was
      # sdn-js 3.0.0 in August. A job that is red on every release is one
      # people stop reading, which is the opposite of what a publish gate is
      # for. Ask npm first, and skip with a reason instead of failing.
      - name: Is this version already on npm?
        id: published
        working-directory: sdn-js
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already on npm — nothing to publish. Bump sdn-js's version to publish a new one."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is not on npm yet; publishing."
          fi

      - name: Publish to npm
        if: ${{ steps.published.outputs.already == 'false' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        working-directory: sdn-js
        run: npm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: sdn-js
        run: |
          echo "=== DRY RUN ==="
          npm publish --dry-run --access public
          echo "=== Would publish with tag: ${{ steps.tag.outputs.tag }} ==="

      - name: Summary
        run: |
          VERSION=$(node -p "require('./sdn-js/package.json').version")
          echo "## npm Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`@spacedatanetwork/sdn-js\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.published.outputs.already }}" = "true" ]; then
            echo "| Status | Already on npm — skipped |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "| Status | Dry run (not published) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | Published |" >> $GITHUB_STEP_SUMMARY
          fi
