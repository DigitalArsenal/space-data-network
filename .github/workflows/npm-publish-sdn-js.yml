name: Publish sdn-js to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: 'false'
        type: boolean
      tag:
        description: 'npm dist-tag (e.g. latest, next, beta)'
        required: false
        default: 'latest'
        type: string

concurrency:
  group: npm-publish-sdn-js
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write  # Required for npm provenance
    env:
      WASMEDGE_VERSION: '0.16.4'

    steps:
      - name: Prepare the release container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=5 update -qq
          apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends \
            ca-certificates curl gnupg git xz-utils build-essential zlib1g-dev libtinfo-dev libzstd-dev
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        # No submodules: build:package compiles sdn-js/src only, and the
        # private SpaceAware-UI submodule fails an unauthenticated recursive
        # checkout (sdn-js-npm-publish-blocked-by-submodule).

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: sdn-js/package-lock.json

      # EVERY SDN release fires this workflow, and an SDN release does not
      # change sdn-js's version — so npm is asked to publish a version it
      # already has and answers 403. That has failed on every release since at
      # least v1.0.4-beta.18 (2026-09-04); the last genuine publish was
      # sdn-js 3.0.0 in August. A job that is red on every release is one
      # people stop reading, which is the opposite of what a publish gate is
      # for. Ask npm first, and skip with a reason instead of failing.
      #
      # FIRST, before install, test and build: the v1.1.0 release (run
      # 43642811010) asked to publish sdn-js 4.0.0, which npm already has, and
      # still failed, at the test step, on a suite that main's CI also fails.
      # A version that will not be published has nothing to gate. A new
      # version, or a dry run, still runs every step below.
      - name: Is this version already on npm?
        id: published
        working-directory: sdn-js
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already on npm — nothing to publish. Bump sdn-js's version to publish a new one."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is not on npm yet; publishing."
          fi

      - name: Set up Go
        if: ${{ steps.published.outputs.already == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/setup-go@v5
        with:
          go-version-file: sdn-server/go.mod
          cache-dependency-path: sdn-server/go.sum

      - name: Restore patched static WasmEdge prefix
        id: wasmedge-cache
        if: ${{ steps.published.outputs.already == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          key: wasmedge-static-${{ env.WASMEDGE_VERSION }}-linux-amd64-focal-llvm16-${{ hashFiles('scripts/build-static-wasmedge.sh', 'scripts/wasmedge-static-env.sh') }}

      - name: Build patched static WasmEdge prefix on cache miss
        if: ${{ (steps.published.outputs.already == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && steps.wasmedge-cache.outputs.cache-hit != 'true' }}
        env:
          CMAKE_VERSION: '3.31.6'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-16 main" > /etc/apt/sources.list.d/llvm.list
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          apt-get -o Acquire::Retries=5 update -qq
          apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends \
            ninja-build clang-16 llvm-16-dev liblld-16-dev libpolly-16-dev
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" | tar -xz -C /opt
          export PATH="/opt/cmake-${CMAKE_VERSION}/bin:$PATH"
          chmod +x scripts/*.sh
          ./scripts/ci-local.sh prefix-build

      - name: Install dependencies
        if: ${{ steps.published.outputs.already == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        working-directory: sdn-js
        run: npm ci

      # This workflow publishes on `release: published` and on workflow_dispatch,
      # neither of which is tied to a green CI run on the published commit —
      # prepublishOnly is only `check:versions && build:package`. So the publish
      # lane verified the package built, never that it worked. ci.yml runs this
      # same suite with Go + patched WasmEdge so the server-schema and libp2p
      # interop suites execute against the real node handler.
      - name: Test
        if: ${{ steps.published.outputs.already == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        working-directory: sdn-js
        env:
          WASMEDGE_DIR: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          SDN_WASM_REQUIRE_PATCHED: '1'
          SDN_REQUIRE_GO_INTEROP: '1'
        run: |
          chmod +x ../scripts/*.sh
          npm run build:core
          node scripts/test-with-standards.mjs

      # sdn-js ran two incompatible libp2p majors once, bridged by hand-written
      # shims in src/helia.ts. The split is closed and the check now asserts one
      # copy of each package on the critical path. This is the last point before
      # the tree reaches every consumer of the package.
      - name: Verify helia/libp2p dependency layering
        if: ${{ steps.published.outputs.already == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: node scripts/check-sdn-js-dependency-layering.mjs

      - name: Build
        if: ${{ steps.published.outputs.already == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        working-directory: sdn-js
        run: npm run build:package

      - name: Verify package contents
        if: ${{ steps.published.outputs.already == 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        working-directory: sdn-js
        run: |
          echo "=== Package contents ==="
          npm pack --dry-run 2>&1
          echo ""
          echo "=== Checking required files ==="
          for f in dist/index.mjs dist/index.d.ts; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing $f"
              exit 1
            fi
          done
          echo "All required files present."

      - name: Determine dist-tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag || 'latest' }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            case "$TAG_NAME" in
              *beta*)
                echo "tag=beta" >> $GITHUB_OUTPUT
                ;;
              *alpha*)
                echo "tag=alpha" >> $GITHUB_OUTPUT
                ;;
              *rc*|*next*)
                echo "tag=next" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "tag=latest" >> $GITHUB_OUTPUT
                ;;
            esac
          fi

      - name: Publish to npm
        if: ${{ steps.published.outputs.already == 'false' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}
        working-directory: sdn-js
        run: npm publish --provenance --access public --tag ${{ steps.tag.outputs.tag }}

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: sdn-js
        run: |
          echo "=== DRY RUN ==="
          npm publish --dry-run --access public
          echo "=== Would publish with tag: ${{ steps.tag.outputs.tag }} ==="

      - name: Summary
        run: |
          VERSION=$(node -p "require('./sdn-js/package.json').version")
          echo "## npm Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package | \`@spacedatanetwork/sdn-js\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.published.outputs.already }}" = "true" ]; then
            echo "| Status | Already on npm — skipped |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "| Status | Dry run (not published) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | Published |" >> $GITHUB_STEP_SUMMARY
          fi
