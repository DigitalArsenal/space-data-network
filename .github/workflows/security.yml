name: Security Scanning

# WHY THIS FILE WAS REWRITTEN (2026-09-18)
#
# The previous version could not report a problem, for two independent reasons:
#
#   1. It ran on `workflow_dispatch` only. Nothing scheduled it, no push or PR
#      triggered it, so it only ran when somebody went looking — which is
#      exactly when they already suspect something.
#
#   2. Every job ended in `exit 0` / `|| true` / `::warning::`. Seven high npm
#      advisories — including an 8.2 address-poisoning primitive against
#      libp2p's PeerStore, in the browser client the whole network depends on —
#      reported green.
#
# Now: it runs on a schedule, on any PR that touches a dependency manifest, and
# on demand; and the npm and Go scans are real gates with explicit, DATED
# allowlists (scripts/check-npm-audit.mjs, scripts/check-govulncheck.mjs) rather
# than a blanket severity threshold, which would recreate the same blindness one
# notch down.
#
# Trivy and CodeQL remain reporting-only: neither has been triaged to a baseline
# yet, and turning on a gate nobody has read the findings of just trains people
# to ignore a red lane.

on:
  schedule:
    # Mondays 07:00 UTC. Advisories land against a tree that is not changing;
    # a push-only trigger would never catch them.
    - cron: '0 7 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'sdn-js/package.json'
      - 'sdn-js/package-lock.json'
      - 'sdn-server/go.mod'
      - 'sdn-server/go.sum'
      - 'kubo/go.mod'
      - 'kubo/go.sum'
      - 'webui/package-lock.json'
      - 'scripts/check-npm-audit.mjs'
      - 'scripts/check-govulncheck.mjs'
      - 'scripts/run-govulncheck.sh'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - 'sdn-js/package.json'
      - 'sdn-js/package-lock.json'
      - 'sdn-server/go.mod'
      - 'sdn-server/go.sum'
      - 'kubo/go.mod'
      - 'kubo/go.sum'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go-vulnerability-scan:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # go-version was hardcoded '1.21' here while sdn-server/go.mod asks for
      # 1.25 — the security lane was scanning a build the real lanes never make.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdn-server/go.mod
          cache-dependency-path: sdn-server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Install WasmEdge
        env:
          WASMEDGE_DIR: ${{ runner.temp }}/.wasmedge
        run: |
          chmod +x scripts/install-wasmedge.sh scripts/run-govulncheck.sh
          ./scripts/install-wasmedge.sh

      - name: Run govulncheck
        env:
          WASMEDGE_DIR: ${{ runner.temp }}/.wasmedge
        run: ./scripts/run-govulncheck.sh --out sdn-server/govulncheck-report.txt

      # Gates MODULE findings (decided by go.mod, identical on every runner)
      # against a reviewed baseline. Stdlib findings are reported but not gated:
      # they are decided by the Go toolchain patch level, so gating them would be
      # flaky rather than informative.
      - name: Gate module vulnerabilities against the reviewed baseline
        run: node scripts/check-govulncheck.mjs --report sdn-server/govulncheck-report.txt

      - name: Upload govulncheck report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: govulncheck-report
          path: sdn-server/govulncheck-report.txt
          retention-days: 30

  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdn-js/package-lock.json

      - name: Install dependencies
        working-directory: sdn-js
        run: npm ci

      # A real gate. Every high/critical must be fixed or carry a dated,
      # reasoned deferral in scripts/check-npm-audit.mjs; the script also fails
      # on an expired deferral, a stale one, and a NEW advisory against an
      # already-deferred package.
      - name: Gate high and critical advisories
        run: node scripts/check-npm-audit.mjs

      # THE GATE ABOVE SCORES THE PRODUCTION CLOSURE ONLY, AND THAT IS A
      # NARROWER SET THAN THE LANE IT REPLACED SCORED. Measured on this tree:
      # --omit=dev is 0 critical + 7 high, the full tree is 1 critical + 13
      # high. Gating on the production closure is the right call for a
      # PUBLISHED package — it is what a consumer installs — but the difference
      # must not become invisible, which is exactly what would happen if the
      # only audit in CI were the narrowed one. No other lane audits dev
      # dependencies.
      #
      # So the full tree is audited too, reported in the log and uploaded, and
      # deliberately NOT blocking: a vitest advisory is a real thing to fix on
      # its own schedule, not a reason to stop shipping the library.
      - name: Capture audit report (production closure, and the full tree)
        if: always()
        working-directory: sdn-js
        run: |
          npm audit --omit=dev --json > npm-audit-report.json 2>&1 || true
          npm audit --omit=dev > npm-audit-report.txt 2>&1 || true
          npm audit --json > npm-audit-report-full.json 2>&1 || true
          npm audit > npm-audit-report-full.txt 2>&1 || true
          echo "::group::dev-tree advisories NOT covered by the gate"
          node ../scripts/check-npm-audit.mjs --report npm-audit-report-full.json || true
          echo "::endgroup::"

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: |
            sdn-js/npm-audit-report.txt
            sdn-js/npm-audit-report.json
            sdn-js/npm-audit-report-full.txt
            sdn-js/npm-audit-report-full.json
          retention-days: 30

  dependency-layering:
    name: Dependency layering and kubo lockstep
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # sdn-js runs two incompatible libp2p majors held together by ~370 lines of
      # hand-written shims in sdn-js/src/helia.ts. Nothing in semver protects
      # that; this makes a helia bump a reviewed act.
      - name: sdn-js helia/libp2p layering
        run: node scripts/check-sdn-js-dependency-layering.mjs

      # There used to be a kubo-lockstep check here, comparing the vendored
      # kubo/go.mod against sdn-server/go.mod. The fork is deleted, so it has no
      # subject left. The CONCERN it existed for did not go away, it moved: this
      # node's Go libp2p stack must still interoperate with the STOCK upstream
      # Kubo we ship (suite.versions.json kubo.shipped), which we no longer pin
      # by editing. That is a different check against a different reference and
      # nothing writes it yet — see sdn-server/docs/kubo-fork-audit.md.

      - name: Check suites
        run: |
          node --test scripts/check-sdn-js-dependency-layering.test.mjs
          node --test scripts/check-npm-audit.test.mjs
          node --test scripts/check-govulncheck.test.mjs

  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            sdn-js/package-lock.json
            webui/package-lock.json

      # Staged, not built: build:ui was deleted by the UI consolidation and the
      # dashboard the node serves is tracked in the tree. See
      # deployment/scripts/stage-admin-ui.sh.
      - name: Stage shared admin shell assets
        run: sh deployment/scripts/stage-admin-ui.sh "${GITHUB_WORKSPACE}"

      - name: Build IPFS WebUI assets
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Check if Dockerfile exists
        id: check
        run: |
          if [ -f "deployment/docker/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: false
          load: true
          tags: sdn-node:scan

      # Reporting-only on purpose: the base-image findings have not been triaged
      # to a baseline, and a gate over untriaged findings is a gate people learn
      # to ignore. Baseline them the way check-govulncheck.mjs does, then gate.
      - name: Run Trivy vulnerability scanner
        if: steps.check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sdn-node:scan
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM'
          output: 'trivy-node-report.txt'

      - name: Display Trivy scan results
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "=== Docker Image Scan Results ==="
          cat trivy-node-report.txt || echo "No report generated"

      - name: Upload Trivy report
        if: steps.check.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-node-report
          path: trivy-node-report.txt
          retention-days: 30

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: sdn-server/go.mod
          cache-dependency-path: sdn-server/go.sum

      - name: Build Go code
        if: matrix.language == 'go'
        working-directory: sdn-server
        env:
          WASMEDGE_DIR: ${{ runner.temp }}/.wasmedge
        run: |
          chmod +x ../scripts/install-wasmedge.sh ../scripts/go-with-wasmedge.sh
          ../scripts/install-wasmedge.sh
          ../scripts/go-with-wasmedge.sh mod download
          ../scripts/go-with-wasmedge.sh build ./...

      - name: Set up Node.js
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdn-js/package-lock.json

      # `npm run build || true` used to hide a broken build from the analysis:
      # CodeQL then scanned whatever partial output existed and still reported
      # success. A build failure here is a failure.
      - name: Build JavaScript code
        if: matrix.language == 'javascript'
        working-directory: sdn-js
        run: |
          npm ci
          npm run build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [go-vulnerability-scan, npm-audit, dependency-layering, docker-scan, codeql-analysis]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports
        continue-on-error: true

      - name: Generate summary
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Gate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Go Vulnerability Scan | gating (module findings) | ${{ needs.go-vulnerability-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm Audit | gating (high/critical) | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency layering | gating | ${{ needs.dependency-layering.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Scan | reporting only | ${{ needs.docker-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | reporting only | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Allowlists and baselines: \`scripts/check-npm-audit.mjs\`, \`scripts/check-govulncheck.mjs\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Go Vulnerabilities" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/govulncheck-report/govulncheck-report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -50 reports/govulncheck-report/govulncheck-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No report available" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### npm Audit" >> $GITHUB_STEP_SUMMARY
          if [ -f reports/npm-audit-report/npm-audit-report.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -50 reports/npm-audit-report/npm-audit-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No report available" >> $GITHUB_STEP_SUMMARY
          fi
