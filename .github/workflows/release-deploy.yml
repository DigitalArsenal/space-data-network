name: SDN Release Deployment

# Releases the v* tag the run starts from, and nothing else (security audit
# SEC-044). To re-run a release by hand, dispatch ON the tag:
# `gh workflow run release-deploy.yml --ref v2.1.0`. There is deliberately no
# version input: a dispatch from main used to build main HEAD under any label
# it was given (`beta`, `latest`, an existing release), push that Docker tag
# and --clobber the named release's assets, signed checksum list included.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege (security audit SEC-042/SEC-044): the workflow token gets
# nothing by default; each job names exactly what it needs. Only the jobs that
# sign or publish hold a write scope, and they run in deployment environments
# whose required reviewers and branch/tag policy the owner sets.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: dockerdigitalarsenal/space-data-network
  VERSION: ${{ github.ref_name }}
  NFPM_VERSION: v2.42.0
  # The ipfs CLI that computes and pins the UI asset CIDs: the Kubo SDN links
  # (sdn-server/go.mod), so the CIDs are the ones the node computes. A
  # workflow-level `env:` cannot call a script, so this is a literal, and
  # scripts/check-kubo-pin.js fails the build if it stops matching go.mod.
  KUBO_VERSION: v0.43.1

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    # Every other job needs this one, so a run from anything but a v* tag
    # stops here.
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The run is a v<semver> tag on main
        env:
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${REF_TYPE}" != tag || "${REF}" != "refs/tags/${VERSION}" ]]; then
            echo "::error::release-deploy runs only from the v* tag it releases (ref ${REF})" >&2
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '${VERSION}' is not v<semver>" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "::error::checked-out commit is not the commit tag ${VERSION} names" >&2
            exit 1
          fi
          # A tag pushed onto an unreviewed branch is not a release.
          on_main="$(gh api "repos/${GITHUB_REPOSITORY}/compare/refs/heads/main...${GITHUB_SHA}" --jq .status)" || on_main=unknown
          if [[ "${on_main}" != identical && "${on_main}" != behind ]]; then
            echo "::error::tag ${VERSION} (${GITHUB_SHA}) is not on main (${on_main}); refusing to release it" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install JS dependencies
        working-directory: sdn-js
        run: npm ci
      - name: JS runtime tests
        working-directory: sdn-js
        run: npm test -- src/ui/runtime/modules.test.ts
      - name: Go release/runtime tests
        working-directory: sdn-server
        run: ../scripts/go-with-wasmedge.sh test ./cmd/spacedatanetwork -run 'TestVerifyReleaseDirectory|TestHandleModuleRuntime'

  ipfs:
    name: Publish static assets to IPFS
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - name: Install Kubo
        run: |
          deployment/release/download-kubo.sh \
            --version "${KUBO_VERSION}" \
            --platform linux-amd64 \
            --archive tar.gz \
            --output-dir dist/bootstrap-kubo
          sudo install dist/bootstrap-kubo/kubo/ipfs /usr/local/bin/ipfs
          ipfs init --profile=server
          ipfs daemon > /tmp/ipfs.log 2>&1 &
          until ipfs id >/dev/null 2>&1; do sleep 1; done
      - name: Build and pin UI assets
        run: deployment/ipfs/ipfs-deploy.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipfs-assets
          path: |
            dist/ipfs/ipfs-deployment.json
            dist/ipfs/sdn-admin
            dist/ipfs/ipfs-webui

  docker:
    name: Build and sign container image
    runs-on: ubuntu-latest
    needs: ipfs
    # Publishes to Docker Hub: only from a v* tag, in the dockerhub
    # environment that holds DOCKERHUB_TOKEN.
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    environment: dockerhub
    permissions:
      contents: read
      id-token: write # keyless cosign signature of the pushed digest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ipfs-assets
          path: dist/ipfs
      - name: Restore exact IPFS-published assets
        run: |
          mkdir -p sdn-js/ui/dist webui/build
          cp -R dist/ipfs/sdn-admin/. sdn-js/ui/dist/
          cp -R dist/ipfs/ipfs-webui/. webui/build/
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: dockerdigitalarsenal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@e1523de7571e31dbe865fd2e80c5c7c23ae71eb4 # v3.4.0
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=sha,prefix=
      - id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Sign image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
          mkdir -p dist/container-digests
          printf '{"name":"%s","digest":"%s"}\n' "${IMAGE_NAME}" "${DIGEST}" > dist/container-digests/image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-digest
          path: dist/container-digests/image.json

  packages:
    name: Build native packages and SBOM
    runs-on: ubuntu-latest
    needs: ipfs
    # Builds what ships, so it holds no write token, no id-token and no secret.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ipfs-assets
          path: dist/ipfs
      - name: Restore exact IPFS-published assets
        run: |
          mkdir -p sdn-js/ui/dist webui/build
          cp -R dist/ipfs/sdn-admin/. sdn-js/ui/dist/
          cp -R dist/ipfs/ipfs-webui/. webui/build/
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install nfpm
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          # go install verifies the module against sum.golang.org.
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/nfpm" --version
      - name: Build RPM and DEB artifacts
        run: deployment/packaging/build-linux-packages.sh
      - name: Build Linux VM tarball
        run: deployment/scripts/package-linux-vm-bundle.sh
      # The packages are uploaded BEFORE any SBOM tooling runs, so the SBOM
      # generator can never touch what ships.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-artifacts
          path: |
            dist/packages/*
            dist/linux-vm/*.tar.gz
      # syft from a pinned release, checked against a committed sha256 — never
      # the moving install.sh on syft's main branch piped into a root shell.
      - name: Install syft (pinned, checksum-verified)
        env:
          SYFT_VERSION: 1.52.0
          SYFT_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
        run: |
          archive="${RUNNER_TEMP}/syft.tar.gz"
          curl -fsSL -o "${archive}" "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/syft"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/syft" syft
          "${RUNNER_TEMP}/syft/syft" version
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist/sbom
          "${RUNNER_TEMP}/syft/syft" dir:dist/package-root -o cyclonedx-json=dist/sbom/spacedatanetwork-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-sbom
          path: dist/sbom/spacedatanetwork-sbom.cdx.json

  release:
    name: Assemble verified release
    runs-on: ubuntu-latest
    needs: [ipfs, docker, packages]
    # Creates the GitHub release: only from a v* tag, in the release
    # environment that holds the anchoring secrets.
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ipfs-assets
          path: dist/ipfs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-artifacts
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-sbom
          path: dist/sbom
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: container-digest
          path: dist/container-digests
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Build container digest manifest
        run: |
          mkdir -p dist
          jq -s '{images: .}' dist/container-digests/*.json > dist/container-digests.json
      - name: Assemble and verify release artifacts
        env:
          RELEASE_PLG_CID: ${{ secrets.RELEASE_PLG_CID }}
          SDN_RELEASE_PUBLIC_KEY: ${{ secrets.SDN_RELEASE_PUBLIC_KEY }}
          BITCOIN_SIGNATURE: ${{ secrets.BITCOIN_SIGNATURE }}
          BITCOIN_PUBLIC_KEY: ${{ secrets.BITCOIN_PUBLIC_KEY }}
          BITCOIN_ADDRESS: ${{ secrets.BITCOIN_ADDRESS }}
          BITCOIN_DESCRIPTOR: ${{ secrets.BITCOIN_DESCRIPTOR }}
          BITCOIN_NETWORK: ${{ secrets.BITCOIN_NETWORK }}
          BITCOIN_ANCHOR_METHOD: ${{ secrets.BITCOIN_ANCHOR_METHOD }}
          BITCOIN_TXID: ${{ secrets.BITCOIN_TXID }}
          BITCOIN_PROOF_REFERENCE: ${{ secrets.BITCOIN_PROOF_REFERENCE }}
          BITCOIN_OUTPUT_INDEX: ${{ secrets.BITCOIN_OUTPUT_INDEX }}
          BITCOIN_BLOCK_HEIGHT: ${{ secrets.BITCOIN_BLOCK_HEIGHT }}
          BITCOIN_CONFIRMATIONS: ${{ secrets.BITCOIN_CONFIRMATIONS }}
        run: deployment/release/assemble-release-artifacts.sh
      # The GitHub CLI with this job's token, not a third-party action holding
      # contents: write. --verify-tag refuses to invent a tag that was never
      # pushed (the action created one at the default branch). The release is
      # a DRAFT: the installers trust it only once the owner signs its
      # checksum list offline (deployment/release/RELEASE-SIGNING.md). Assets
      # are replaced only on a draft; a published release is never touched.
      - name: Publish the GitHub release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if is_draft="$(gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "${is_draft}" != true ]]; then
              echo "::error::release ${VERSION} is already published; refusing to replace its assets" >&2
              exit 1
            fi
          else
            gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --verify-tag --draft --title "${VERSION}" --notes ""
          fi
          gh release upload "${VERSION}" dist/release/* --repo "${GITHUB_REPOSITORY}" --clobber
