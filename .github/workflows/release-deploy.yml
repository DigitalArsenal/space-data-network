name: SDN Release Deployment

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.1.0
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: digitalarsenal/space-data-network
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
  NFPM_VERSION: v2.42.0

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install JS dependencies
        working-directory: sdn-js
        run: npm ci
      - name: JS runtime tests
        working-directory: sdn-js
        run: npm test -- src/ui/runtime/modules.test.ts
      - name: Go release/runtime tests
        working-directory: sdn-server
        run: ../scripts/go-with-wasmedge.sh test ./cmd/spacedatanetwork -run 'TestVerifyReleaseDirectory|TestHandleModuleRuntime'

  ipfs:
    name: Publish static assets to IPFS
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - name: Install Kubo
        run: |
          curl -L https://dist.ipfs.tech/kubo/v0.39.0/kubo_v0.39.0_linux-amd64.tar.gz | tar -xz
          sudo install kubo/ipfs /usr/local/bin/ipfs
          ipfs init --profile=server
          ipfs daemon > /tmp/ipfs.log 2>&1 &
          until ipfs id >/dev/null 2>&1; do sleep 1; done
      - name: Build and pin UI assets
        run: deployment/ipfs/ipfs-deploy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ipfs-assets
          path: |
            dist/ipfs/ipfs-deployment.json
            dist/ipfs/sdn-admin
            dist/ipfs/ipfs-webui

  docker:
    name: Build and sign container image
    runs-on: ubuntu-latest
    needs: ipfs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - name: Restore exact IPFS-published assets
        run: |
          mkdir -p sdn-js/ui/dist webui/build
          cp -R dist/ipfs/sdn-admin/. sdn-js/ui/dist/
          cp -R dist/ipfs/ipfs-webui/. webui/build/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: digitalarsenal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3.4.0
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=sha,prefix=
      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Sign image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
          mkdir -p dist/container-digests
          printf '{"name":"%s","digest":"%s"}\n' "${{ env.IMAGE_NAME }}" "${DIGEST}" > dist/container-digests/image.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-digest
          path: dist/container-digests/image.json

  packages:
    name: Build native packages and SBOM
    runs-on: ubuntu-latest
    needs: ipfs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - name: Restore exact IPFS-published assets
        run: |
          mkdir -p sdn-js/ui/dist webui/build
          cp -R dist/ipfs/sdn-admin/. sdn-js/ui/dist/
          cp -R dist/ipfs/ipfs-webui/. webui/build/
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install nfpm and syft
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          "${RUNNER_TEMP}/bin/nfpm" --version
          syft version
      - name: Build RPM and DEB artifacts
        run: deployment/packaging/build-linux-packages.sh
      - name: Build Linux VM tarball
        run: deployment/scripts/package-linux-vm-bundle.sh
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist/sbom
          syft dir:dist/package-root -o cyclonedx-json=dist/sbom/spacedatanetwork-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: |
            dist/packages/*
            dist/linux-vm/*.tar.gz
            dist/sbom/spacedatanetwork-sbom.cdx.json

  release:
    name: Assemble verified release
    runs-on: ubuntu-latest
    needs: [ipfs, docker, packages]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: container-digest
          path: dist/container-digests
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Build container digest manifest
        run: |
          mkdir -p dist
          jq -s '{images: .}' dist/container-digests/*.json > dist/container-digests.json
      - name: Assemble and verify release artifacts
        env:
          RELEASE_PLG_CID: ${{ secrets.RELEASE_PLG_CID }}
          SDN_RELEASE_PUBLIC_KEY: ${{ secrets.SDN_RELEASE_PUBLIC_KEY }}
          BITCOIN_SIGNATURE: ${{ secrets.BITCOIN_SIGNATURE }}
          BITCOIN_PUBLIC_KEY: ${{ secrets.BITCOIN_PUBLIC_KEY }}
          BITCOIN_ADDRESS: ${{ secrets.BITCOIN_ADDRESS }}
          BITCOIN_DESCRIPTOR: ${{ secrets.BITCOIN_DESCRIPTOR }}
          BITCOIN_NETWORK: ${{ secrets.BITCOIN_NETWORK }}
          BITCOIN_ANCHOR_METHOD: ${{ secrets.BITCOIN_ANCHOR_METHOD }}
          BITCOIN_TXID: ${{ secrets.BITCOIN_TXID }}
          BITCOIN_PROOF_REFERENCE: ${{ secrets.BITCOIN_PROOF_REFERENCE }}
          BITCOIN_OUTPUT_INDEX: ${{ secrets.BITCOIN_OUTPUT_INDEX }}
          BITCOIN_BLOCK_HEIGHT: ${{ secrets.BITCOIN_BLOCK_HEIGHT }}
          BITCOIN_CONFIRMATIONS: ${{ secrets.BITCOIN_CONFIRMATIONS }}
        run: deployment/release/assemble-release-artifacts.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/release/*
