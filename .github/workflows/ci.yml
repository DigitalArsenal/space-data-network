name: CI

# WHAT WAS WRONG WITH THIS FILE.
#
# CI has not been green since 2026-07-24 (ddf0513f4). Its last 100 runs are 82
# cancelled, 17 failed, 0 succeeded, and main has no branch protection, so
# nothing was ever blocked by the red gate either. Three separate causes, all
# fixed here:
#
# 1. The Go lanes ran the FlatSQL engine INTERPRETED. Nothing in CI ever
#    prewarmed the AOT artifact the record store loads, so every
#    store-touching package ran 6-12x slow, the job took 105.8 minutes, and
#    four packages hit their go-test timeout. scripts/ci-local.sh now prewarms
#    and asserts; .github/actions/sdn-go-env caches the artifact.
# 2. cancel-in-progress: true on a ~105-minute job, on a branch pushed every
#    few minutes, cannot ever reach a conclusion. Hence 82 cancellations.
# 3. Every check lived in ONE `set -e` shell step, Go first. The Go failure
#    meant the JS half of the gate never executed at all: run 35310122091's
#    log contains zero occurrences of "sdn-js install", "Go build (full node)"
#    or "plugin-demo". Those are separate jobs now, which is a correctness fix
#    rather than a speed one.
#
# Every check still lives in scripts/ci-local.sh — one mode per job — so what
# CI runs and what a developer runs before pushing are the same script.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel a superseded PR push. NEVER cancel main: a gate that is always
  # cancelled can never produce the green record that makes it a gate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # scripts/install.ps1 IS THE LIVE INSTALLER. The public entrypoint
  # (https://spacedatanetwork.org/install.ps1, docs/install.ps1) is a 19-line
  # shim that fetches this file from raw.githubusercontent.com/.../main and
  # Invoke-Expressions it, so whatever is on main is what every Windows user
  # running the documented install command gets — immediately, with no release
  # and no Pages deploy in between. A syntax error here is a broken installer
  # for everyone, and nothing was checking that it even parses.
  #
  # Parsing is all this does: it is deliberately not a run, because running the
  # installer is the published-installer smoke's job in the release workflow.
  powershell-installer-parses:
    name: Installer script parses
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts/install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::install.ps1: $_" }
            exit 1
          }
          Write-Host 'scripts/install.ps1 parses clean'
      - name: Parse docs/install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'docs/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::docs/install.ps1: $_" }
            exit 1
          }
          Write-Host 'docs/install.ps1 parses clean'

  # Cheap and first: secret/infra scan, gofmt, and the encryption module's Go
  # suite — everything that needs neither WasmEdge nor the engine.
  # tests/encryption/go is its own module and has had no CI at all: the
  # workflow that ran it is workflow_dispatch-only and last executed
  # 2026-02-24.
  preflight:
    name: Preflight (OSS scan, gofmt, encryption)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdn-server/go.mod
          cache-dependency-path: sdn-server/go.sum
      - name: Preflight
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-local.sh preflight
      - name: Encryption tests (Go)
        run: ./scripts/ci-local.sh encryption

  # Every package but internal/storage.
  #
  # Budget: 427.6s and 492.5s of test time on two warm local runs (2026-09-18,
  # -p=1), against a runner factor of 1.9x measured the same day — same
  # package, interpreted on both sides: internal/directory 170.4s on CI
  # against 90.1s here. That is ~15 minutes of `go test`, plus the build and
  # the prewarm; 40 minutes is roughly 1.6x the whole job, and it replaces one
  # that took 109.5. The per-package -timeout lives in ci-local.sh, next to
  # the numbers it came from.
  go-quick:
    name: Go tests (quick)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/sdn-go-env
        with:
          modules-token: ${{ secrets.MODULES_REPO_TOKEN }}
      - name: go test (quick)
        run: ./scripts/ci-local.sh go

  # THE RECORD STORE. internal/storage is 324 tests over the data path — the
  # thing this whole node exists to be — and it is excluded from the quick
  # lane because one package should not starve fast feedback. Separate job so
  # the two run in parallel instead of end to end.
  #
  # Budget: 296.6s warm locally, ~9.4 minutes projected on a runner at 1.9x.
  # Was 110 minutes, against a lane that could not finish because it ran
  # interpreted.
  go-heavy:
    name: Go tests (record store)
    runs-on: ubuntu-latest
    # Above the lane's own 25m go-test budget, so an overrun surfaces as go
    # test's timeout panic (which names the running test) instead of the job
    # being killed with no diagnostic.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/sdn-go-env
        with:
          modules-token: ${{ secrets.MODULES_REPO_TOKEN }}
      - name: go test (record store)
        run: ./scripts/ci-local.sh heavy

  go-builds:
    name: Go builds (node + edge relay)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/sdn-go-env
        with:
          needs-flow-bundles: 'false'
      - name: go build
        run: ./scripts/ci-local.sh builds

  js:
    name: sdn-js + module delivery + plugin demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdn-js/package-lock.json
      # plugin-demo runs a REAL node, so this lane needs the Go toolchain and
      # WasmEdge too.
      - uses: ./.github/actions/sdn-go-env
        with:
          needs-flow-bundles: 'false'
        with:
          modules-token: ${{ secrets.MODULES_REPO_TOKEN }}
      - name: sdn-js
        run: ./scripts/ci-local.sh js
      - name: module delivery compatibility
        run: ./scripts/ci-local.sh delivery
      - name: plugin demo
        run: ./scripts/ci-local.sh demo

  # ONE CHECK TO REQUIRE. Splitting the pipeline into parallel jobs changes
  # what "CI passed" means: seven jobs must pass, not one. Branch protection can
  # require this single job instead of enumerating them, and it fails if any
  # needed job failed, was cancelled, or was skipped.
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - powershell-installer-parses
      - preflight
      - go-quick
      - go-heavy
      - go-builds
      - js
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | tee -a "$GITHUB_STEP_SUMMARY"
          not_green="$(printf '%s\n' "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$not_green" ]; then
            echo "::error::CI is not green: $not_green"
            exit 1
          fi
          echo "all CI jobs succeeded"
