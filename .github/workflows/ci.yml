name: CI

# WHAT WAS WRONG WITH THIS FILE.
#
# CI has not been green since 2026-07-24 (ddf0513f4). Its last 100 runs are 82
# cancelled, 17 failed, 0 succeeded, and main has no branch protection, so
# nothing was ever blocked by the red gate either. Three separate causes, all
# fixed here:
#
# 1. The Go lanes ran the FlatSQL engine INTERPRETED. Nothing in CI ever
#    prewarmed the AOT artifact the record store loads, so every
#    store-touching package ran 6-12x slow, the job took 105.8 minutes, and
#    four packages hit their go-test timeout. scripts/ci-local.sh now prewarms
#    and asserts; .github/actions/sdn-go-env caches the artifact.
# 2. cancel-in-progress: true on a ~105-minute job, on a branch pushed every
#    few minutes, cannot ever reach a conclusion. Hence 82 cancellations.
# 3. Every check lived in ONE `set -e` shell step, Go first. The Go failure
#    meant the JS half of the gate never executed at all: run 35310122091's
#    log contains zero occurrences of "sdn-js install", "Go build (full node)"
#    or "plugin-demo". Those are separate jobs now, which is a correctness fix
#    rather than a speed one.
#
# Every check still lives in scripts/ci-local.sh — one mode per job — so what
# CI runs and what a developer runs before pushing are the same script.

# PATHS FILTERS (owner 2026-10-16: a change gets the E2E for that change, then
# deploys). Making the sdn pre-push gate opt-in (SDN_PREPUSH_CI=1) must not move
# its cost here, so the Go, WasmEdge, sdn-js and plugin-demo jobs run only when
# a file they build or test changes. The nested SpaceAware-UI checkout
# (sdn-js/spaceaware-ui) is its own repository and is excluded: a pin bump for
# it builds nothing here. workflow_dispatch always runs everything. The
# preflight job's secret scan is inside this workflow, so it follows the same
# filter; the pre-push hook runs it on every push, and security.yml and
# encryption-tests.yml (the dependency and secret scans) stay unfiltered.
on:
  push:
    branches: [main]
    paths:
      - 'sdn-server/**'
      - 'sdn-js/**'
      - '!sdn-js/spaceaware-ui'
      - '!sdn-js/spaceaware-ui/**'
      - 'sdn-wasi/**'
      - 'webui/**'
      - 'plugin-demo/**'
      - 'tests/**'
      - 'shared-test-vectors/**'
      - 'schemas/**'
      - 'packages/**'
      - 'tools/**'
      - 'deployment/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'suite.versions.json'
      - '.gitmodules'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'sdn-server/**'
      - 'sdn-js/**'
      - '!sdn-js/spaceaware-ui'
      - '!sdn-js/spaceaware-ui/**'
      - 'sdn-wasi/**'
      - 'webui/**'
      - 'plugin-demo/**'
      - 'tests/**'
      - 'shared-test-vectors/**'
      - 'schemas/**'
      - 'packages/**'
      - 'tools/**'
      - 'deployment/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'suite.versions.json'
      - '.gitmodules'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  # Cancel a superseded PR push. NEVER cancel main: a gate that is always
  # cancelled can never produce the green record that makes it a gate.
  #
  # This used to be expressed as `cancel-in-progress: ${{ github.event_name ==
  # 'pull_request' }}` on a ref-keyed group, and main runs were cancelled
  # anyway — 4ab9ba0ab's run sat queued behind f27562864's and was cancelled
  # the moment ceb2fe0fd pushed, so that commit has no CI record at all.
  # The protection is in the GROUP instead, where no expression has to be
  # read as a boolean: a PR keys on its ref, so a new push to it supersedes
  # the old one; anything else keys on its own run id, which is unique, so
  # there is never a second member to cancel.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # scripts/install.ps1 IS THE LIVE INSTALLER. The public entrypoint
  # (https://spacedatanetwork.org/install.ps1, docs/install.ps1) is a 19-line
  # shim that fetches this file from raw.githubusercontent.com/.../main and
  # Invoke-Expressions it, so whatever is on main is what every Windows user
  # running the documented install command gets — immediately, with no release
  # and no Pages deploy in between. A syntax error here is a broken installer
  # for everyone, and nothing was checking that it even parses.
  #
  # Parsing is all this does: it is deliberately not a run, because running the
  # installer is the published-installer smoke's job in the release workflow.
  powershell-installer-parses:
    name: Installer script parses
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts/install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::install.ps1: $_" }
            exit 1
          }
          Write-Host 'scripts/install.ps1 parses clean'
      - name: Parse docs/install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'docs/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::docs/install.ps1: $_" }
            exit 1
          }
          Write-Host 'docs/install.ps1 parses clean'

  # Cheap and first: secret/infra scan, gofmt, and the encryption module's Go
  # suite — everything that needs neither WasmEdge nor the engine.
  # tests/encryption/go is its own module and has had no CI at all: the
  # workflow that ran it is workflow_dispatch-only and last executed
  # 2026-02-24.
  preflight:
    name: Preflight (OSS scan, gofmt, encryption)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdn-server/go.mod
          cache-dependency-path: sdn-server/go.sum
      - name: Preflight
        # The docs-release link check asks GitHub for the newest release tag;
        # `gh` on a runner is installed but unauthenticated without this.
        env:
          GH_TOKEN: ${{ github.token }}
        # The update-signing guard (deployment/release/beta-release-workflow.test.mjs)
        # parses the workflows with js-yaml, a root dev dependency.
        run: |
          chmod +x scripts/*.sh
          npm ci --ignore-scripts --no-audit --no-fund
          ./scripts/ci-local.sh preflight
      - name: Encryption tests (Go)
        run: ./scripts/ci-local.sh encryption

  # Six exhaustive groups retain the individual test deadlines. In the
  # release container, run 43971615013 took 21m general, 35m format2 (its
  # kill-recovery test alone 1579s), 16m command and 13m engine; setup and
  # linking took 6.5m before the first test; run 43979527185 took 27m
  # general. general-1 and general-2 split its packages; format2-kill runs
  # that one test, format2 the rest of its package. The 40m outer limit leaves the 30m
  # package deadline time to name an overrun after setup and linking.
  go-quick:
    name: Go tests (quick / ${{ matrix.group }})
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    needs: wasmedge-runtime
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [general-1, general-2, format2, format2-kill, command, engine]
    env:
      SDN_CI_GO_GROUP: ${{ matrix.group }}
      SDN_CI_KEEP_TEST_BINARIES: ${{ matrix.group == 'engine' && '1' || '0' }}
    steps:
      - name: Prepare the release container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/sdn-go-env
        with:
          modules-token: ${{ secrets.MODULES_REPO_TOKEN }}
      - name: go test (quick)
        run: ./scripts/ci-local.sh go
      # A native crash names its pc; this keeps the exact binary it is in
      # (stack issue 876: SIGSEGV at 0xd0 in WasmEdge's unwinder).
      - name: Keep the engine test binaries of a failed run
        if: failure() && matrix.group == 'engine'
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-binaries-${{ github.run_attempt }}
          path: .ci-artifacts/testbin/
          retention-days: 7
          if-no-files-found: ignore

  # THE RECORD STORE. internal/storage is 324 tests over the data path — the
  # thing this whole node exists to be — and it is excluded from the quick
  # lane because one package should not starve fast feedback. Separate job so
  # the two run in parallel instead of end to end.
  #
  # One job per test group (HEAVY_GO_GROUPS in scripts/ci-local.sh; `rest`
  # holds every test no group pattern matches). Runs 44379302576 and
  # 44379081909 ran the package as four groups on one runner and reached go
  # test's 25m panic; on their figures each group here is under 10 minutes of
  # test time.
  go-heavy:
    name: Go tests (record store / ${{ matrix.group }})
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    needs: wasmedge-runtime
    # Above the lane's own go-test budgets (60m for long, 25m for the
    # others), so an overrun surfaces as go test's timeout panic (which names
    # the running test) instead of the job being killed with no diagnostic.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group: [long, format4a, format4b, format4c, format4d, format4e, format4f, format5, format2, publication, rest]
    env:
      SDN_CI_STORAGE_GROUP: ${{ matrix.group }}
    steps:
      - name: Prepare the release container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/sdn-go-env
        with:
          modules-token: ${{ secrets.MODULES_REPO_TOKEN }}
      - name: go test (record store)
        run: ./scripts/ci-local.sh heavy

  # The release cache supplies one prefix per run. Consumers link and test
  # in the release container, including its C library and linker.
  wasmedge-static:
    name: Shared patched WasmEdge prefix
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 120
    env:
      WASMEDGE_VERSION: '0.16.4'
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare the container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          key: wasmedge-static-${{ env.WASMEDGE_VERSION }}-linux-amd64-focal-llvm16-${{ hashFiles('scripts/build-static-wasmedge.sh', 'scripts/wasmedge-static-env.sh') }}
      # Exactly the release workflow's Linux toolchain, so a prefix built here
      # is the prefix the release would have built.
      - name: Install build toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CMAKE_VERSION: '3.31.6'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-16 main" > /etc/apt/sources.list.d/llvm.list
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ninja-build clang-16 llvm-16-dev liblld-16-dev libpolly-16-dev \
            libzstd-dev zlib1g-dev libtinfo-dev build-essential
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" | tar -xz -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build the static prefix
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/ci-local.sh prefix-build
      - name: Package the prefix
        run: ./scripts/ci-local.sh prefix-pack
      - uses: actions/upload-artifact@v4
        with:
          name: wasmedge-static-prefix
          path: .ci-artifacts/wasmedge-static-prefix.tar.gz
          compression-level: 0
          retention-days: 1

  wasmedge-runtime:
    name: Patched runtime in release container
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    needs: wasmedge-static
    timeout-minutes: 25
    steps:
      - name: Prepare the release container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/sdn-go-env
        with:
          needs-flow-bundles: 'false'
      - name: Build and verify the runtime
        run: ./scripts/ci-local.sh runtime

  wasmedge-substrate:
    name: Store migration E2E (patched runtime)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    needs: wasmedge-runtime
    timeout-minutes: 120
    steps:
      - name: Prepare the release container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/sdn-go-env
        with:
          needs-flow-bundles: 'false'
      - name: Store migrations
        run: ./scripts/ci-local.sh migrations

  # THE UPDATE CHANNEL ON REAL DAEMONS (stack issue 670). The helper tests in
  # update_cli_test.go run a fixture daemon, which is how a health gate that
  # reverted every real update passed them. This lane builds the node three
  # times (v1, v2, and v3 that is never ready) and runs `update install`
  # against a real daemon from a real bundle and a signed HTTPS feed on
  # loopback: v1 -> v2 passes the /api/v1/ready gate, v2 -> v3 is reverted and
  # quarantined after the configured health budget, and a release signed by an
  # untrusted key is refused. Linux only: the CLI trusts the test feed through
  # SSL_CERT_FILE, which Go ignores on macOS. Keys are throwaways the test
  # generates; the feed and the admin API are on loopback, and the daemons dial
  # no peer (the test refuses, before any daemon starts, a config that would
  # fall back to the built-in bootstrap peers, and checks every daemon's log).
  # Four groups (scripts/ci-local.sh update_group_args): run 44245748601 ran
  # every subtest in one binary and hit go test's 50m panic; the
  # home-read-only-install subtests take about 15m of runner time on their own,
  # and the channel group took 42.5m of its 50m in run 44379302576. `fleet` runs
  # the published 1.1.9 receiver, the staggered rollout and fleet view, and
  # `update install --config` under TLS; `rollout` the update status guard and
  # the rollout's signal paths.
  update-channel-e2e:
    name: Update channel E2E (real daemon / ${{ matrix.group }})
    runs-on: ubuntu-latest
    # The daemons run in a network namespace of their own (loopback only) as
    # an ordinary user, which needs these two capabilities in the container.
    container:
      image: ubuntu:20.04
      options: --cap-add SYS_ADMIN --cap-add NET_ADMIN
    defaults:
      run:
        shell: bash
    needs: wasmedge-runtime
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [channel, home, fleet, rollout]
    env:
      SDN_CI_UPDATE_GROUP: ${{ matrix.group }}
    steps:
      - name: Prepare the release container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev iproute2
          git config --global --add safe.directory '*'
          useradd --create-home update-e2e
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/sdn-go-env
        with:
          needs-flow-bundles: 'false'
      - uses: actions/cache@v4
        with:
          path: .ci-artifacts/installed-update-receiver
          key: installed-v1.1.9-linux-amd64-45127438512c09be90a26991c8463401e596af89eae98a66da96c95c1f253e07
      - name: Fetch the published update receiver
        id: installed_receiver_archive
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci-artifacts/installed-update-receiver"
          archive="$GITHUB_WORKSPACE/.ci-artifacts/installed-update-receiver/spacedatanetwork-1.1.9-linux-amd64.tar.gz"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 https://github.com/DigitalArsenal/space-data-network/releases/download/v1.1.9/spacedatanetwork-1.1.9-linux-amd64.tar.gz -o "$archive"
          fi
          echo "45127438512c09be90a26991c8463401e596af89eae98a66da96c95c1f253e07  $archive" | sha256sum --check
      # Builds the fixtures, then runs the test as the ordinary user
      # update-e2e in a network namespace with loopback only.
      - name: Exercise pull and push on loopback
        id: update_daemons
        env:
          SDN_E2E_UPDATE_USER: update-e2e
        run: |
          export SDN_E2E_LOG_DIR="$GITHUB_WORKSPACE/.ci-artifacts/update-channel-logs"
          export SDN_E2E_INSTALLED_BUNDLE="$GITHUB_WORKSPACE/.ci-artifacts/installed-update-receiver/spacedatanetwork-1.1.9-linux-amd64.tar.gz"
          ./scripts/ci-local.sh update-channel
      - name: Report installed receiver proof
        if: always() && matrix.group == 'fleet'
        env:
          ARCHIVE_OUTCOME: ${{ steps.installed_receiver_archive.outcome }}
          TEST_OUTCOME: ${{ steps.update_daemons.outcome }}
        run: |
          if grep -q -- '--- PASS: TestUpdateChannelRealDaemonE2E/installed-v1.1.9-push' "$GITHUB_WORKSPACE/.ci-artifacts/update-channel-logs/test.log"; then
            echo 'Published 1.1.9 receiver: checksum verified and autonomous push install passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published 1.1.9 receiver proof did not pass: archive download/checksum=$ARCHIVE_OUTCOME; fixture build and daemon test=$TEST_OUTCOME. A skipped stage did not run because an earlier stage failed. See those step logs and the test artifact for the diagnostic." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: update-channel-logs-${{ matrix.group }}
          path: .ci-artifacts/update-channel-logs

  # Three groups by test name (scripts/ci-local.sh publication_group_tests):
  # run 44031044072 ran all ten tests in one binary and hit go test's 50m
  # panic in the tenth. Each group is about 1,000s of runner time against a
  # 45m go test budget; the 60m job limit leaves setup and linking time for
  # that budget to name an overrun.
  publication-e2e:
    name: Publication E2E (real daemons / ${{ matrix.group }})
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    needs: wasmedge-runtime
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [publication-1, publication-2, publication-3]
    env:
      SDN_CI_PUBLICATION_GROUP: ${{ matrix.group }}
    steps:
      - name: Prepare the release container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The CelesTrak GP ingest flow of TestPublicationFailureRealDaemons and
      # TestPublicationSlowFlowRealDaemons, from the public modules repository.
      - uses: ./.github/actions/sdn-go-env
        with:
          needs-modules: 'true'
          needs-flow-bundles: 'false'
      - name: Publication between real daemons
        run: ./scripts/ci-local.sh publication

  go-builds:
    name: Go builds (node + edge relay)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    needs: wasmedge-runtime
    timeout-minutes: 25
    steps:
      - name: Prepare the release container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/sdn-go-env
        with:
          needs-flow-bundles: 'false'
      - name: go build
        run: ./scripts/ci-local.sh builds

  js:
    name: sdn-js
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    needs: wasmedge-runtime
    timeout-minutes: 30
    # Playwright omits a focal download entry. The Ubuntu 22.04 key selects
    # its Linux x64 Chromium bundle; ci-local.sh installs the bundle's
    # libraries under their 20.04 names.
    env:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu22.04-x64
      SDN_CI_BROWSER_DEPS: release-container
    steps:
      - name: Prepare the release container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdn-js/package-lock.json
      # The interop tests build a Go peer with the shared runtime.
      - uses: ./.github/actions/sdn-go-env
        with:
          needs-flow-bundles: 'false'
      - name: sdn-js
        run: ./scripts/ci-local.sh js

  delivery:
    name: Module delivery compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - name: Module delivery compatibility
        run: ./scripts/ci-local.sh delivery

  demo:
    name: Plugin demo
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    needs: wasmedge-runtime
    timeout-minutes: 30
    steps:
      - name: Prepare the release container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - uses: ./.github/actions/sdn-go-env
        with:
          needs-flow-bundles: 'false'
      - name: Plugin demo
        run: ./scripts/ci-local.sh demo

  dashboard:
    name: Embedded dashboard E2E (real node)
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    needs: wasmedge-runtime
    timeout-minutes: 30
    # Playwright omits a focal download entry. The Ubuntu 22.04 key selects
    # its Linux x64 Chromium bundle; ci-local.sh installs the bundle's
    # libraries under their 20.04 names.
    env:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu22.04-x64
      SDN_CI_BROWSER_DEPS: release-container
    steps:
      - name: Prepare the release container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdn-js/package-lock.json
      - uses: ./.github/actions/sdn-go-env
        with:
          needs-flow-bundles: 'false'
      - name: Embedded dashboard
        run: ./scripts/ci-local.sh dashboard

  # ONE CHECK TO REQUIRE. Splitting the pipeline into parallel jobs changes
  # what "CI passed" means: seven jobs must pass, not one. Branch protection can
  # require this single job instead of enumerating them, and it fails if any
  # needed job failed, was cancelled, or was skipped.
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - powershell-installer-parses
      - preflight
      - go-quick
      - go-heavy
      - wasmedge-static
      - wasmedge-runtime
      - wasmedge-substrate
      - update-channel-e2e
      - publication-e2e
      - go-builds
      - js
      - delivery
      - demo
      - dashboard
    steps:
      - name: Report
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | tee -a "$GITHUB_STEP_SUMMARY"
          not_green="$(printf '%s\n' "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$not_green" ]; then
            echo "::error::CI is not green: $not_green"
            exit 1
          fi
          echo "all CI jobs succeeded"
