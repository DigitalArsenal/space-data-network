name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # scripts/install.ps1 IS THE LIVE INSTALLER. The public entrypoint
  # (https://spacedatanetwork.org/install.ps1, docs/install.ps1) is a 19-line
  # shim that fetches this file from raw.githubusercontent.com/.../main and
  # Invoke-Expressions it, so whatever is on main is what every Windows user
  # running the documented install command gets — immediately, with no release
  # and no Pages deploy in between. A syntax error here is a broken installer
  # for everyone, and nothing was checking that it even parses.
  #
  # Parsing is all this does: it is deliberately not a run, because running the
  # installer is the published-installer smoke's job in the release workflow.
  powershell-installer-parses:
    name: Installer script parses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts/install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::install.ps1: $_" }
            exit 1
          }
          Write-Host 'scripts/install.ps1 parses clean'
      - name: Parse docs/install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'docs/install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::docs/install.ps1: $_" }
            exit 1
          }
          Write-Host 'docs/install.ps1 parses clean'

  local-ci-equivalent:
    name: Local CI Equivalent
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdn-server/go.mod
          cache-dependency-path: sdn-server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdn-js/package-lock.json

      - name: Run CI checks (same as pre-push)
        env:
          WASMEDGE_DIR: ${{ runner.temp }}/.wasmedge
        run: |
          chmod +x scripts/ci-local.sh scripts/oss-preflight.sh scripts/install-wasmedge.sh scripts/go-with-wasmedge.sh
          ./scripts/install-wasmedge.sh
          ./scripts/ci-local.sh quick

  # THE RECORD STORE HAD NO CI AT ALL. internal/storage is 324 tests over the
  # data path — the thing this whole node exists to be — and the quick lane
  # deliberately excludes it (heavy_pkg_filter), because it exceeds the
  # 20-minute per-package budget and made the gate fail every time, which left
  # pushes unguarded. That was the right call for the quick lane and was then
  # never followed by the other half: ci.yml only ever ran `quick`, so the
  # exclusion became "the store is never tested on any commit".
  #
  # The heavy lane already exists for exactly this and just needed running, with
  # the budget it was designed around. Separate job so a slow store cannot
  # starve the fast feedback the quick lane gives every push.
  heavy-go-packages:
    name: Heavy Go packages (record store)
    runs-on: ubuntu-latest
    # Above the lane's own 90m go-test budget, so an overrun surfaces as go
    # test's timeout panic (which names the running test) instead of the job
    # being killed with no diagnostic.
    timeout-minutes: 110

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdn-server/go.mod
          cache-dependency-path: sdn-server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: sdn-js/package-lock.json

      - name: Run the heavy Go lane (internal/storage)
        env:
          WASMEDGE_DIR: ${{ runner.temp }}/.wasmedge
        run: |
          chmod +x scripts/ci-local.sh scripts/install-wasmedge.sh scripts/go-with-wasmedge.sh
          ./scripts/install-wasmedge.sh
          ./scripts/ci-local.sh heavy
