name: SDN Beta Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional beta release version, for example v1.0.3-beta.7. Leave blank to use v<package version>-beta.<run number>.
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: dockerdigitalarsenal/space-data-network
  KUBO_VERSION: v0.39.0
  WASMEDGE_VERSION: 0.14.0
  NFPM_VERSION: v2.42.0

jobs:
  beta-version:
    name: Resolve beta version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      package_version: ${{ steps.version.outputs.package_version }}
      native_package_version: ${{ steps.version.outputs.native_package_version }}
      release_name: ${{ steps.version.outputs.release_name }}
      channel: ${{ steps.version.outputs.channel }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: version
        name: Compute beta release number
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node deployment/release/prepare-beta-release.mjs

  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    needs: beta-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install JS dependencies
        working-directory: sdn-js
        run: npm ci
      - name: JS runtime tests
        working-directory: sdn-js
        run: npm test -- src/ui/runtime/modules.test.ts
      - name: Go release/runtime tests
        working-directory: sdn-server
        run: ../scripts/go-with-wasmedge.sh test ./cmd/spacedatanetwork -run 'TestVerifyReleaseDirectory|TestHandleModuleRuntime'

  ipfs:
    name: Build and pin static assets
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - name: Install Kubo
        run: |
          deployment/release/download-kubo.sh \
            --version "${KUBO_VERSION}" \
            --platform linux-amd64 \
            --archive tar.gz \
            --output-dir dist/bootstrap-kubo
          sudo install dist/bootstrap-kubo/kubo/ipfs /usr/local/bin/ipfs
          ipfs init --profile=server
          ipfs daemon > /tmp/ipfs.log 2>&1 &
          until ipfs id >/dev/null 2>&1; do sleep 1; done
      - name: Build and pin UI assets
        run: deployment/ipfs/ipfs-deploy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ipfs-assets
          path: |
            dist/ipfs/ipfs-deployment.json
            dist/ipfs/sdn-admin
            dist/ipfs/ipfs-webui

  updater-wasm:
    name: Build updater module wasm
    runs-on: ubuntu-latest
    needs: preflight
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root JS dependencies
        run: npm ci
      - name: Build updater module wasm
        run: npm --prefix packages/sdn-updater-module run build
      - uses: actions/upload-artifact@v4
        with:
          name: updater-module-wasm
          path: packages/sdn-updater-module/dist/isomorphic/module.wasm
          if-no-files-found: error

  docker:
    name: Build beta container image
    runs-on: ubuntu-latest
    needs: [beta-version, ipfs]
    env:
      RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
      NATIVE_PACKAGE_VERSION: ${{ needs.beta-version.outputs.native_package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - name: Restore exact IPFS-published assets
        run: |
          mkdir -p sdn-js/ui/dist webui/build
          cp -R dist/ipfs/sdn-admin/. sdn-js/ui/dist/
          cp -R dist/ipfs/ipfs-webui/. webui/build/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dockerdigitalarsenal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3.4.0
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.beta-version.outputs.release_tag }}
            type=raw,value=beta
            type=sha,prefix=
      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Sign image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
          mkdir -p dist/container-digests
          printf '{"name":"%s","digest":"%s"}\n' "${{ env.IMAGE_NAME }}" "${DIGEST}" > dist/container-digests/image.json
      - name: Export downloadable Docker image
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          mkdir -p dist/container-images
          image_ref="${IMAGE_NAME}:${RELEASE_TAG}"
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t "${image_ref}" \
            -f deployment/docker/Dockerfile \
            .
          docker run --rm "${image_ref}" --help >/tmp/spacedatanetwork-container-help.txt
          docker save "${image_ref}" | gzip -n > "dist/container-images/spacedatanetwork-container-${NATIVE_PACKAGE_VERSION}-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: container-digest
          path: dist/container-digests/image.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: dist/container-images/spacedatanetwork-container-${{ needs.beta-version.outputs.native_package_version }}-linux-amd64.tar.gz

  cli:
    name: Build self-contained CLI archives (${{ matrix.target_os }}-${{ matrix.target_arch }})
    runs-on: ${{ matrix.runner }}
    needs: [beta-version, ipfs, updater-wasm]
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            target_arch: amd64
            runner: ubuntu-latest
            kubo_platform: linux-amd64
            kubo_archive: tar.gz
            archive_extension: tar.gz
            binary_name: spacedatanetwork
            kubo_binary_name: ipfs
          - target_os: linux
            target_arch: arm64
            runner: ubuntu-24.04-arm
            kubo_platform: linux-arm64
            kubo_archive: tar.gz
            archive_extension: tar.gz
            binary_name: spacedatanetwork
            kubo_binary_name: ipfs
          - target_os: darwin
            target_arch: arm64
            runner: macos-14
            kubo_platform: darwin-arm64
            kubo_archive: tar.gz
            archive_extension: tar.gz
            binary_name: spacedatanetwork
            kubo_binary_name: ipfs
          - target_os: darwin
            target_arch: amd64
            runner: macos-15-intel
            kubo_platform: darwin-amd64
            kubo_archive: tar.gz
            archive_extension: tar.gz
            binary_name: spacedatanetwork
            kubo_binary_name: ipfs
          - target_os: windows
            target_arch: amd64
            runner: windows-latest
            kubo_platform: windows-amd64
            kubo_archive: zip
            archive_extension: zip
            binary_name: spacedatanetwork.exe
            kubo_binary_name: ipfs.exe
    env:
      PACKAGE_VERSION: ${{ needs.beta-version.outputs.package_version }}
      RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
      TARGET_OS: ${{ matrix.target_os }}
      TARGET_ARCH: ${{ matrix.target_arch }}
      KUBO_PLATFORM: ${{ matrix.kubo_platform }}
      KUBO_ARCHIVE: ${{ matrix.kubo_archive }}
      BINARY_NAME: ${{ matrix.binary_name }}
      KUBO_BINARY_NAME: ${{ matrix.kubo_binary_name }}
      WASMEDGE_DIR: ${{ github.workspace }}/dist/.wasmedge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install root JS dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: updater-module-wasm
          path: packages/sdn-updater-module/dist/isomorphic
      - name: Verify updater module wasm
        run: test -f packages/sdn-updater-module/dist/isomorphic/module.wasm
      - name: Install Windows CLI build tools
        if: matrix.target_os == 'windows'
        run: |
          choco install zip -y --no-progress
          echo "/c/msys64/mingw64/bin" >> "$GITHUB_PATH"
      - name: Install Windows WasmEdge runtime
        if: matrix.target_os == 'windows'
        run: |
          mkdir -p dist/wasmedge
          curl -L -o dist/wasmedge/wasmedge.zip "https://github.com/WasmEdge/WasmEdge/releases/download/${WASMEDGE_VERSION}/WasmEdge-${WASMEDGE_VERSION}-windows.zip"
          unzip -q dist/wasmedge/wasmedge.zip -d dist/wasmedge
          rm -rf "${WASMEDGE_DIR}"
          mkdir -p "${WASMEDGE_DIR}"
          cp -R "dist/wasmedge/WasmEdge-${WASMEDGE_VERSION}-Windows/." "${WASMEDGE_DIR}/"
          test -f "${WASMEDGE_DIR}/bin/wasmedge.dll"
      - name: Download target Kubo binary
        run: |
          deployment/release/download-kubo.sh \
            --version "${KUBO_VERSION}" \
            --platform "${KUBO_PLATFORM}" \
            --archive "${KUBO_ARCHIVE}" \
            --output-dir dist/kubo
      - name: Build target SDN binary
        run: |
          mkdir -p dist/cli-input
          GOOS="${TARGET_OS}" GOARCH="${TARGET_ARCH}" ./scripts/go-with-wasmedge.sh build -o "${PWD}/dist/cli-input/${BINARY_NAME}" ./cmd/spacedatanetwork
      - name: Build self-contained CLI archive
        run: |
          node deployment/release/build-self-contained-cli.mjs \
            --version "${PACKAGE_VERSION}" \
            --os "${TARGET_OS}" \
            --arch "${TARGET_ARCH}" \
            --channel beta \
            --output-dir dist/cli \
            --binary-path "${PWD}/dist/cli-input/${BINARY_NAME}" \
            --kubo-path "${PWD}/dist/kubo/kubo/${KUBO_BINARY_NAME}" \
            --sdnUIPath "${PWD}/dist/ipfs/sdn-admin" \
            --webUIPath "${PWD}/dist/ipfs/ipfs-webui" \
            --updater-wasm-path "${PWD}/packages/sdn-updater-module/dist/isomorphic/module.wasm" \
            --hd-wallet-wasm-path "${PWD}/node_modules/hd-wallet-wasm/dist/hd-wallet-wasi.wasm" \
            --wasmedge-path "${WASMEDGE_DIR}" \
            --license-path "${PWD}/LICENSE" \
            --readme-path "${PWD}/README.md" \
            --manifest-signature "github-actions:${RELEASE_TAG}:${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/cli/spacedatanetwork-${{ needs.beta-version.outputs.package_version }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.${{ matrix.archive_extension }}

  cli-update-feed:
    name: Build signed CLI update feed
    runs-on: ubuntu-latest
    needs: [beta-version, cli]
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.beta-version.outputs.package_version }}
      SDN_UPDATE_SIGNING_KEY_PEM: ${{ secrets.SDN_UPDATE_SIGNING_KEY_PEM }}
      SDN_UPDATE_KEY_ID: ${{ secrets.SDN_UPDATE_KEY_ID }}
      SDN_UPDATE_SEQUENCE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build signed CLI update feed
        run: |
          set -euo pipefail
          if [[ -z "${SDN_UPDATE_SIGNING_KEY_PEM:-}" ]]; then
            echo "SDN_UPDATE_SIGNING_KEY_PEM secret is required to publish signed CLI updates" >&2
            exit 1
          fi
          update_key_id="${SDN_UPDATE_KEY_ID:-sdn-beta-release}"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload_dir="dist/update-payloads"
          feed_tree_root="dist/update-feed-tree"
          feed_dir="${feed_tree_root}/update-feed"
          out_dir="dist/update-feed"
          rm -rf "${payload_dir}" "${feed_tree_root}" "${out_dir}"
          mkdir -p "${payload_dir}" "${out_dir}"
          feed_args=(--out-dir "${feed_dir}" --generated-at "${created_at}")
          targets=(
            "darwin amd64 tar.gz"
            "darwin arm64 tar.gz"
            "linux amd64 tar.gz"
            "linux arm64 tar.gz"
            "windows amd64 zip"
          )
          for target in "${targets[@]}"; do
            read -r target_os target_arch target_ext <<< "${target}"
            archive_path="dist/cli/spacedatanetwork-${VERSION}-${target_os}-${target_arch}.${target_ext}"
            payload_out="${payload_dir}/${target_os}-${target_arch}"
            if [[ ! -f "${archive_path}" ]]; then
              echo "missing CLI archive for update feed: ${archive_path}" >&2
              exit 1
            fi
            node deployment/release/build-cli-update-payload.mjs \
              --bundle-archive "${archive_path}" \
              --version "${VERSION}" \
              --sequence "${SDN_UPDATE_SEQUENCE}" \
              --channel beta \
              --platform "${target_os}" \
              --arch "${target_arch}" \
              --key-id "${update_key_id}" \
              --created-at "${created_at}" \
              --out-dir "${payload_out}"
            feed_args+=(--entry "${payload_out}/manifest.json:${payload_out}/update.wasm")
          done
          node deployment/release/build-sdn-update-feed.js "${feed_args[@]}"
          tar -czf "dist/update-feed/spacedatanetwork-update-feed-${VERSION}.tar.gz" -C "${feed_tree_root}" update-feed
      - uses: actions/upload-artifact@v4
        with:
          name: cli-update-feed
          path: dist/update-feed/spacedatanetwork-update-feed-${{ needs.beta-version.outputs.package_version }}.tar.gz

  desktop:
    name: Build desktop app artifacts
    runs-on: ${{ matrix.runner }}
    needs: [beta-version, ipfs]
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: macos
            runner: macos-14
          - target_os: windows
            runner: windows-latest
          - target_os: linux
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux desktop packaging dependencies
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg
      - name: Install Desktop dependencies
        run: npm --prefix desktop ci
      - name: Restore exact IPFS-published assets
        run: |
          rm -rf desktop/assets/sdn-ui desktop/assets/webui
          mkdir -p desktop/assets/sdn-ui desktop/assets/webui
          cp -R dist/ipfs/sdn-admin/. desktop/assets/sdn-ui/
          cp -R dist/ipfs/ipfs-webui/. desktop/assets/webui/
      - name: Build macOS Desktop artifacts
        if: matrix.target_os == 'macos'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm --prefix desktop exec -- electron-builder --publish never --mac dmg zip
      - name: Build Windows Desktop artifacts
        if: matrix.target_os == 'windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
        run: npm --prefix desktop exec -- electron-builder --publish never --win nsis portable
      - name: Build Linux Desktop artifacts
        if: matrix.target_os == 'linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm --prefix desktop exec -- electron-builder --publish never --linux AppImage deb rpm
      - name: Collect Desktop artifacts
        run: |
          mkdir -p dist/desktop
          find desktop/dist -maxdepth 1 -type f -exec cp {} dist/desktop/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target_os }}
          path: dist/desktop/*
          if-no-files-found: error

  packages:
    name: Build beta native packages and SBOM
    runs-on: ubuntu-latest
    needs: [beta-version, ipfs]
    env:
      VERSION: ${{ needs.beta-version.outputs.native_package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - name: Restore exact IPFS-published assets
        run: |
          mkdir -p sdn-js/ui/dist webui/build
          cp -R dist/ipfs/sdn-admin/. sdn-js/ui/dist/
          cp -R dist/ipfs/ipfs-webui/. webui/build/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install JS dependencies
        working-directory: sdn-js
        run: npm ci
      - name: Install nfpm and syft
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          "${RUNNER_TEMP}/bin/nfpm" --version
          syft version
      - name: Build RPM and DEB artifacts
        run: deployment/packaging/build-linux-packages.sh
      - name: Build Linux VM tarball
        run: deployment/scripts/package-linux-vm-bundle.sh
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist/sbom
          syft dir:dist/package-root -o cyclonedx-json=dist/sbom/spacedatanetwork-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: |
            dist/packages/*
            dist/linux-vm/*.tar.gz
            dist/sbom/spacedatanetwork-sbom.cdx.json

  sdn-js-package:
    name: Build beta sdn-js package
    runs-on: ubuntu-latest
    needs: beta-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - name: Install dependencies
        working-directory: sdn-js
        run: npm ci
      - name: Build browser and Node package
        working-directory: sdn-js
        run: npm run build:package
      - name: Pack npm tarball
        working-directory: sdn-js
        run: |
          mkdir -p ../dist/sdn-js
          npm pack --pack-destination ../dist/sdn-js
      - uses: actions/upload-artifact@v4
        with:
          name: sdn-js-package
          path: dist/sdn-js/*.tgz

  artifact-docker-test:
    name: Install and network-test release artifacts
    runs-on: ubuntu-latest
    needs: [beta-version, ipfs, docker, cli, cli-update-feed, packages, sdn-js-package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdn-js-package
          path: dist/sdn-js
      - uses: actions/download-artifact@v4
        with:
          name: container-image
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cli-update-feed
          path: dist/update-feed
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install artifacts and verify SDN network
        run: npm run test:release-artifacts:docker -- --release-dir dist --timeout-ms 180000

  release:
    name: Publish beta GitHub release
    runs-on: ubuntu-latest
    needs: [beta-version, ipfs, docker, cli, cli-update-feed, desktop, packages, sdn-js-package, artifact-docker-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdn-js-package
          path: dist/sdn-js
      - uses: actions/download-artifact@v4
        with:
          name: container-image
          path: dist/container-images
      - uses: actions/download-artifact@v4
        with:
          name: container-digest
          path: dist/container-digests
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cli-update-feed
          path: dist/update-feed
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/desktop
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build container digest manifest
        run: |
          node - <<'NODE'
          const { readdirSync, readFileSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const dir = 'dist/container-digests';
          const images = readdirSync(dir)
            .filter((file) => file.endsWith('.json'))
            .sort()
            .map((file) => JSON.parse(readFileSync(join(dir, file), 'utf8')));
          writeFileSync('dist/container-digests.json', `${JSON.stringify({ images }, null, 2)}\n`);
          NODE
      - name: Assemble beta release artifacts
        env:
          VERSION: ${{ needs.beta-version.outputs.package_version }}
          RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
        run: deployment/release/assemble-beta-release-artifacts.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.beta-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.beta-version.outputs.release_name }}
          body_path: dist/release/SDN-BETA-RELEASE.md
          prerelease: false
          make_latest: true
          files: dist/release/*

  published-installer-smoke:
    name: Smoke published installers (${{ matrix.target_os }})
    runs-on: ${{ matrix.runner }}
    needs: [beta-version, release]
    env:
      SDN_VERSION: ${{ needs.beta-version.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            runner: ubuntu-latest
          - target_os: macos
            runner: macos-14
          - target_os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Smoke clean-user published installer
        run: node deployment/release/published-install-smoke.mjs --platform ${{ matrix.target_os }}
