name: SDN Beta Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version, a beta such as v1.0.3-beta.7 or a stable release such as v1.1.0. Leave blank to use v<package version>-beta.<run number>.
        required: false
        type: string
      # Owner decision, 2026-11-14: "Forget Apple desktop for now". v1.1.0
      # ships without the macOS desktop app while Apple refuses notarization
      # ("HTTP status code: 403. A required agreement is missing or has
      # expired."); the macOS command-line archives still ship. False builds
      # no macOS desktop app and lists it under "Not in this release". The
      # default keeps every release as it was.
      macos_desktop:
        description: Build and publish the macOS desktop app (false ships the release without it).
        required: false
        type: boolean
        default: true
      # False builds and tests everything a release would, and publishes
      # nothing: no publish probe (a draft release), no image or manifest push,
      # no GitHub release, and so no published-installer smoke. The jobs that
      # use the update signing key run only from main (the update-signing
      # Environment admits only main), so a dry run from a branch reports them
      # refused and builds the rest anyway; a real release (true, the default)
      # still requires every one of them.
      publish:
        description: Publish the release (false builds and tests every artifact and publishes nothing).
        required: false
        type: boolean
        default: true
      # The pace of the push: signed into every update signal of the release,
      # it replaces each receiving node's update.rollout_window_seconds, and
      # each node installs at its own time within this many seconds of
      # accepting the signal. 0 installs at once everywhere; at most 86400.
      # A node that finds the release by its feed check instead uses its own
      # setting (the feed index carries no window). The first job refuses a
      # value that is not a whole number from 0 to 86400, before anything is
      # signed or published.
      rollout_window_seconds:
        description: Rollout window in seconds signed into the update signals (a whole number, 0 installs at once on every node, at most 86400).
        required: false
        type: number
        default: 1800

permissions:
  contents: write
  packages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: dockerdigitalarsenal/space-data-network
  # The ipfs CLI that computes and pins the UI asset CIDs: the Kubo SDN links
  # (sdn-server/go.mod), so the CIDs are the ones the node computes.
  # scripts/check-kubo-pin.js holds the two equal.
  KUBO_VERSION: v0.43.1
  WASMEDGE_VERSION: 0.16.4
  NFPM_VERSION: v2.42.0

jobs:
  beta-version:
    name: Resolve beta version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      package_version: ${{ steps.version.outputs.package_version }}
      native_package_version: ${{ steps.version.outputs.native_package_version }}
      release_name: ${{ steps.version.outputs.release_name }}
      channel: ${{ steps.version.outputs.channel }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      # The rollout window is signed into every update signal of the release
      # (cli-update-feed); a value the signer would refuse, or one that would
      # mean something else (a negative number, a fraction), stops the run
      # here, in its first minute.
      - name: Check the rollout window
        env:
          ROLLOUT_WINDOW_SECONDS: ${{ inputs.rollout_window_seconds }}
        run: |
          set -euo pipefail
          value="${ROLLOUT_WINDOW_SECONDS}"
          case "${value}" in
            ''|*[!0-9]*|0[0-9]*)
              echo "::error::rollout_window_seconds must be a whole number of seconds from 0 to 86400, written without leading zeros (0 installs at once on every node); it is '${value}'."
              exit 1
              ;;
          esac
          if [ "${#value}" -gt 5 ] || [ "$((10#${value}))" -gt 86400 ]; then
            echo "::error::rollout_window_seconds must be at most 86400 (one day); it is ${value}."
            exit 1
          fi
          echo "rollout window ${value} s"
      - id: version
        name: Compute beta release number
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node deployment/release/prepare-beta-release.mjs
      # CAN THIS TOKEN ACTUALLY PUBLISH? Ask now, in the first job, not after
      # forty minutes of building every artifact for five platforms.
      #
      # Run 35095153877 built everything — including the first working Windows
      # CLI — and then died in the publish step with 403 "Resource not
      # accessible by integration", while the job log showed `Contents: write`
      # granted. Declared permissions were correct, the repo default was write,
      # there were no rulesets and no pre-existing tag; an admin PAT could
      # create a release at the same moment the Actions token could not. That
      # combination means the restriction is above the repository, and no
      # amount of building will reveal it.
      #
      # A DRAFT release is the only honest probe: GitHub exposes no "may I?"
      # endpoint, `permissions.push` still reads true in this state, and a
      # draft creates no tag and is not publicly visible. It is deleted
      # immediately, including when the step fails.
      - name: Check the token can publish a release
        if: inputs.publish != false
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_TAG: zz-publish-probe-${{ github.run_id }}
        run: |
          set -uo pipefail
          probe_id=""
          cleanup() {
            if [ -n "${probe_id}" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${probe_id}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          response="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${PROBE_TAG}" \
            -f name="publish permission probe" \
            -F draft=true 2>&1)" || true
          probe_id="$(printf '%s' "${response}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).id||""))}catch(e){}})')"

          if [ -z "${probe_id}" ]; then
            echo "::error::This workflow's GITHUB_TOKEN cannot create a GitHub release, so the run would build every artifact and then fail at the final step."
            echo "The API said:" >&2
            printf '%s\n' "${response}" | head -5 >&2
            echo "" >&2
            echo "The repository side is not the problem if you see 'Contents: write' in this job's GITHUB_TOKEN Permissions group above." >&2
            echo "Check the ORGANISATION policy: Settings -> Actions -> General -> Workflow permissions, and any org ruleset targeting tags." >&2
            exit 1
          fi
          echo "publish permission OK (probe release ${probe_id}, deleted)"

  # The update signing key lives only in the update-signing Environment, and
  # only this job and cli-update-feed name that Environment. This job runs
  # at the start, beside the first builds, and the CLI archives and the
  # release need it, so a missing or untrusted key stops the release before
  # any archive is built; it builds nothing and runs only the reviewed key
  # check.
  update-signing-check:
    name: Check the update signing key
    runs-on: ubuntu-latest
    needs: beta-version
    environment: update-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check the update signing key
        env:
          RELEASE_MATURITY: ${{ needs.beta-version.outputs.channel }}
          SDN_UPDATE_SIGNING_KEY_PEM: ${{ secrets.SDN_UPDATE_SIGNING_KEY_PEM }}
          # SDN_UPDATE_KEY_ID is a public key identifier, not secret key material.
          SDN_UPDATE_KEY_ID: ${{ secrets.SDN_UPDATE_KEY_ID }}
        run: |
          node deployment/release/check-update-signing-key.mjs \
            --maturity "${RELEASE_MATURITY}" \
            --roots deployment/release/fleet-trust-roots.json

  # One static WasmEdge, built once and reused. Building LLVM is expensive, so
  # it is cached on the version alone; nothing here is installed into a job, it
  # is linked INTO the binaries that ship.
  # One static WasmEdge PER PLATFORM. The cli job builds natively on five
  # runners, and a Linux prefix cannot link a macOS or Windows binary, so the
  # prefix is a matrix over the same runners. Building LLVM is expensive, so
  # each is cached on the version + layout and rebuilt only when those change.
  # It needs nothing: it builds (or restores) a prefix and publishes nothing,
  # so it starts at once, beside the version and key checks.
  wasmedge-static:
    name: Build static WasmEdge (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    # Empty for the macOS and Windows legs, which have no container key and so
    # run directly on the runner.
    container: ${{ matrix.container }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `toolchain` tags the INSTALLED package set below. It is part of the
          # cache key and has to be bumped by hand when that set changes: the
          # actions that install it take literal inputs, so no hashFiles() can
          # see them. Everything else that shapes a prefix is hashed from
          # scripts/.
          # ubuntu:20.04, NOT the runner's own image. glibc is the only thing
          # these binaries still need from the host, and its required version is
          # set by whatever built them: on ubuntu-24.04 that was 2.38, which does
          # not exist on Debian 12, Ubuntu 22.04 or RHEL 9 — most of the server
          # install base. The release install-tests proved it by refusing to run
          # the package at all. focal's 2.31 covers everything current, and its
          # apt.llvm.org repo carries the SAME llvm-16 used before, so nothing
          # about the build changes except the floor.
          - label: linux-amd64
            runner: ubuntu-latest
            container: ubuntu:20.04
            toolchain: focal-llvm16
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:20.04
            toolchain: focal-llvm16
          # macos-15, not macos-14: GitHub no longer runs macos-14 (run
          # 43639422366 was cancelled at once with "The configuration
          # 'macos-14-arm64-us-default' is not supported"), and with this leg
          # cancelled every downstream job is skipped. Same runner in the cli,
          # desktop and published-installer-smoke legs below.
          - label: darwin-arm64
            runner: macos-15
            toolchain: brew-llvm18
          - label: darwin-amd64
            runner: macos-15-intel
            toolchain: brew-llvm18
          # Windows: MSVC's lib.exe cannot perform the `ar -x` extraction
          # WasmEdge's static merge does, so the toolchain is clang + llvm-ar.
          #
          # NOW BLOCKING. This was non-blocking "until a Windows static prefix
          # is proven"; it is proven — run 35095153877 built the prefix and
          # linked a self-contained windows-amd64 CLI with zero undefined
          # references. A regression here should stop the release rather than
          # quietly ship four platforms out of five.
          - label: windows-amd64
            runner: windows-latest
            toolchain: msys2-mingw64
    defaults:
      run:
        shell: bash
    steps:
      # BEFORE checkout: actions/checkout needs git, and a bare ubuntu:20.04 has
      # none. Nothing else in this job can run until the tree is present.
      - name: Prepare the container
        if: matrix.container != ''
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg git xz-utils
          git config --global --add safe.directory '*' 
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          # The key covers EVERYTHING THAT DECIDES HOW THE PREFIX IS BUILT: the
          # build script, the toolchain-selection script, and matrix.toolchain
          # for the package set the workflow installs. Staleness has bitten
          # three times, each time as a fix that silently never ran: absolute
          # paths in link.flags, a missing -lc++abi, then a prefix still
          # compiled with Homebrew's libc++ after the build moved to the system
          # toolchain. darwin-amd64 passed and darwin-arm64 failed on the same
          # commit purely because one had a cache and the other did not.
          #
          # It deliberately does NOT hash this whole workflow any more. That
          # version was correct but far too broad — editing an unrelated job
          # discarded five prefixes and paid a full LLVM + WasmEdge rebuild on
          # five runners to learn nothing had changed.
          key: wasmedge-static-${{ env.WASMEDGE_VERSION }}-${{ matrix.label }}-${{ matrix.toolchain }}-${{ hashFiles('scripts/build-static-wasmedge.sh', 'scripts/wasmedge-static-env.sh') }}
      # No sudo: this runs as root inside the container. focal's own cmake is
      # 3.16 and WasmEdge needs >= 3.18, so cmake comes from Kitware's release
      # tarball; everything else is apt, with llvm-16 from apt.llvm.org because
      # focal's archive stops at 10. liblld-16-dev is the package that matters —
      # it ships the STATIC lld archives WasmEdge's AOT links through, which is
      # why RHEL-family images were rejected: their lld-devel is headers only.
      - name: Install build toolchain (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        env:
          CMAKE_VERSION: '3.31.6'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-16 main" > /etc/apt/sources.list.d/llvm.list
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ninja-build clang-16 llvm-16-dev liblld-16-dev libpolly-16-dev \
            libzstd-dev zlib1g-dev libtinfo-dev build-essential
          case "$(uname -m)" in
            x86_64) cmake_arch=linux-x86_64 ;;
            aarch64) cmake_arch=linux-aarch64 ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-${cmake_arch}.tar.gz" | tar -xz -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-${cmake_arch}/bin" >> "$GITHUB_PATH"
      - name: Install build toolchain (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install cmake ninja llvm@18 zstd
      # MSYS2, not choco. The choco/official LLVM for Windows ships the
      # toolchain WITHOUT lib/cmake/llvm or the static archives, so
      # WASMEDGE_LINK_LLVM_STATIC cannot resolve LLVMConfig.cmake — a search of
      # the whole C: drive found none. MSYS2's mingw-w64-x86_64-llvm ships both,
      # and its GNU ar takes the same `ar -x` path WasmEdge's static merge uses
      # on every non-Apple platform.
      - name: Install build toolchain (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-libiconv
            git
      # Two steps, not one: the toolchain choice is identical (both source
      # scripts/wasmedge-static-env.sh), but a step-level `shell:` cannot read
      # the runner or matrix context, so Windows needing `msys2 {0}` has to be
      # an `if:`, which can.
      - name: Build the static prefix (Unix)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          . scripts/wasmedge-static-env.sh
          WASMEDGE_STATIC_WORK="${GITHUB_WORKSPACE}/.sdn-wasmedge-static" \
          WASMEDGE_STATIC_PREFIX_ONLY=1 \
          bash scripts/build-static-wasmedge.sh

      - name: Build the static prefix (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          . scripts/wasmedge-static-env.sh
          WASMEDGE_STATIC_WORK="${GITHUB_WORKSPACE}/.sdn-wasmedge-static" \
          WASMEDGE_STATIC_PREFIX_ONLY=1 \
          bash scripts/build-static-wasmedge.sh

      - name: Prove the prefix is relocatable
        run: |
          F="${GITHUB_WORKSPACE}/.sdn-wasmedge-static/prefix/link.flags"
          grep -q '@PREFIX@' "$F"
          ! grep -qE '/usr/lib/llvm|/opt/homebrew|/home/runner|/Users/' "$F"

  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    # Same image as everything else that links the prefix. The Go test below
    # does a real cgo link, so it has to agree with the archives it links; and
    # if anything about the focal toolchain is wrong, failing HERE is much
    # cheaper than finding out in five parallel build jobs.
    container: ubuntu:20.04
    needs: [beta-version, wasmedge-static]
    steps:
      - name: Prepare the container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          key: wasmedge-static-${{ env.WASMEDGE_VERSION }}-linux-amd64-focal-llvm16-${{ hashFiles('scripts/build-static-wasmedge.sh', 'scripts/wasmedge-static-env.sh') }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install JS dependencies
        working-directory: sdn-js
        run: npm ci
      - name: JS runtime tests
        working-directory: sdn-js
        run: npm test -- src/ui/runtime/modules.test.ts
      # Release SHAPE only. The module runtime belongs to the SDS runtime
      # environment and is exercised by its own harnesses; a release cut has no
      # business starting it.
      - name: Go release-layout tests
        working-directory: sdn-server
        env:
          WASMEDGE_DIR: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
        run: ../scripts/go-with-wasmedge.sh test ./cmd/spacedatanetwork -run 'TestVerifyReleaseDirectory'

  # Builds and publishes nothing outside this run (the Kubo daemon is the
  # runner's own), so it does not wait for Preflight: every archive needs its
  # output, and the release still needs Preflight directly.
  ipfs:
    name: Build and pin static assets
    runs-on: ubuntu-latest
    env:
      # The sha512 of kubo_${KUBO_VERSION}_linux-amd64.tar.gz, the one Kubo
      # publishes beside the asset on its GitHub release. Changes with
      # KUBO_VERSION; download-kubo.sh prints the hashes both hosts publish
      # when the archive does not match.
      KUBO_LINUX_AMD64_SHA512: 'ff53b2428794fc8cca39505d28c15b4cceaef4b90a09284f291f611fcdc8c06399690575fc89cbd4d85ef71f3652581296c6f2e710386f887c8edf36b6e89d71'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      # The ipfs CLI is a build tool. Its release archive is cached by version
      # and pinned sha512. v1.1.8 run 44184616352 spent 4.6 of its 6.3 minutes
      # here, timing out on dist.ipfs.tech before the GitHub fallback answered.
      - id: kubo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: dist/kubo-archive
          key: kubo-archive-${{ env.KUBO_VERSION }}-linux-amd64-${{ env.KUBO_LINUX_AMD64_SHA512 }}
      - name: Install Kubo
        # Two tries at dist.ipfs.tech, not five: five cost about twelve minutes
        # on the release's critical path before the GitHub-release fallback
        # in download-kubo.sh was reached, while that host was down.
        env:
          KUBO_DOWNLOAD_ATTEMPTS: '2'
        run: |
          set -euo pipefail
          archive="dist/kubo-archive/kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          if [ ! -f "${archive}" ]; then
            deployment/release/download-kubo.sh \
              --version "${KUBO_VERSION}" \
              --platform linux-amd64 \
              --archive tar.gz \
              --sha512 "${KUBO_LINUX_AMD64_SHA512}" \
              --keep-archive "${archive}" \
              --output-dir "${RUNNER_TEMP}/kubo-download"
          fi
          # Every run, cached or downloaded: the archive is the pinned one, and
          # the ipfs CLI used is the one unpacked from it here.
          echo "${KUBO_LINUX_AMD64_SHA512}  ${archive}" | sha512sum -c -
          rm -rf dist/bootstrap-kubo
          mkdir -p dist/bootstrap-kubo
          tar -xzf "${archive}" -C dist/bootstrap-kubo
          dist/bootstrap-kubo/kubo/ipfs version | grep -qx "ipfs version ${KUBO_VERSION#v}"
          sudo install dist/bootstrap-kubo/kubo/ipfs /usr/local/bin/ipfs
          ipfs init --profile=server
          ipfs daemon > /tmp/ipfs.log 2>&1 &
          until ipfs id >/dev/null 2>&1; do sleep 1; done
      - name: Build and pin UI assets
        run: deployment/ipfs/ipfs-deploy.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ipfs-assets
          path: |
            dist/ipfs/ipfs-deployment.json
            dist/ipfs/sdn-admin
            dist/ipfs/ipfs-webui

  updater-wasm:
    name: Build updater module wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root JS dependencies
        run: npm ci
      # The module's build imports esbuild and space-data-module-sdk, which its
      # own package-lock.json pins. They used to resolve from the root tree only
      # because the root's tarball copy of space-data-module-sdk pulled esbuild
      # in; with the npm release of the SDK it does not, and v1.1.0 run
      # 43640268636 failed here with "Cannot find package 'esbuild' imported
      # from packages/sdn-updater-module/build.mjs".
      - name: Install updater module dependencies
        run: npm --prefix packages/sdn-updater-module ci --no-audit --fund=false
      # space-data-module-sdk compiles the module with clang for
      # wasm32-wasip1-threads and needs a WASI sysroot; no runner image has
      # one. v1.1.0 run 43642178922 failed with 'WASI clang driver
      # "wasm32-wasi-clang++" was not found on PATH'. wasi-sdk is the
      # WebAssembly project's own clang + sysroot, pinned by version and by the
      # sha256 GitHub reports for the asset, and handed to the SDK through its
      # documented SDN_WASI_* overrides.
      - name: Install the WASI toolchain
        env:
          WASI_SDK_VERSION: '34'
          WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
        run: |
          set -euo pipefail
          archive="wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/${archive}"
          echo "${WASI_SDK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/wasi-sdk"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/wasi-sdk" --strip-components=1
          sdk="${RUNNER_TEMP}/wasi-sdk"
          test -x "${sdk}/bin/clang++"
          test -f "${sdk}/share/wasi-sysroot/lib/wasm32-wasip1-threads/libc.a"
          {
            echo "SDN_WASI_CLANG=${sdk}/bin/clang"
            echo "SDN_WASI_CLANGXX=${sdk}/bin/clang++"
            echo "SDN_WASI_SYSROOT=${sdk}/share/wasi-sysroot"
          } >> "$GITHUB_ENV"
          "${sdk}/bin/clang++" --version | head -1
      - name: Build updater module wasm
        run: npm --prefix packages/sdn-updater-module run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-module-wasm
          path: packages/sdn-updater-module/dist/isomorphic/module.wasm
          if-no-files-found: error

  docker:
    # ONE IMAGE PER ARCHITECTURE, MERGED INTO ONE MANIFEST BELOW.
    #
    # The image was linux/amd64 only, so `docker pull` on Apple Silicon and on
    # ARM servers got an amd64 image and ran it under emulation. The Dockerfile
    # builds WasmEdge and LLVM from source, which is exactly the workload that
    # makes QEMU untenable, so each architecture builds on its own NATIVE
    # runner: the amd64 leg measured 8.2 min, and ubuntu-24.04-arm is already
    # proven in this workflow by the linux-arm64 wasmedge-static leg.
    #
    # Each leg pushes BY DIGEST and tags nothing. Tags belong to the manifest,
    # and a per-arch push that claimed them would leave whichever leg finished
    # last owning `:beta` as a single-architecture image.
    #
    # Building and pushing are two jobs. This one builds each architecture's
    # image into the local store, checks its version stamp, saves the
    # downloadable tarball the install tests run, and keeps the build's layer
    # cache for docker-push. It publishes nothing, so it does not wait for
    # Preflight; docker-push, which pushes, does.
    name: Build beta container image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [beta-version, ipfs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
      NATIVE_PACKAGE_VERSION: ${{ needs.beta-version.outputs.native_package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      # The image COPYs sdn-js/node_modules/hd-wallet-wasm/dist/hd-wallet-wasi.wasm
      # into the build context, so those dependencies must exist before buildx
      # runs — otherwise the build fails computing that path's checksum.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - name: Install sdn-js dependencies
        working-directory: sdn-js
        run: npm ci
      - name: Restore exact IPFS-published assets
        run: |
          mkdir -p sdn-js/ui/dist webui/build
          cp -R dist/ipfs/sdn-admin/. sdn-js/ui/dist/
          cp -R dist/ipfs/ipfs-webui/. webui/build/
      # No registry login: this job runs before Preflight and the key check,
      # so it holds no credential that could push. The base images are pulled
      # anonymously, as the install-test jobs pull theirs.
      - uses: docker/setup-buildx-action@v3
      # The downloadable tarball is a --load build: `docker save` reads the
      # local image store, and a push-by-digest build never lands there. Its
      # layer cache (mode=min: the layers of this image) is what docker-push
      # builds from, so the pushed layers are these layers.
      - name: Export downloadable Docker image
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          mkdir -p dist/container-images
          image_ref="${IMAGE_NAME}:${RELEASE_TAG}-${{ matrix.arch }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --load \
            --cache-to "type=local,dest=${RUNNER_TEMP}/container-build-cache,mode=min" \
            -t "${image_ref}" \
            --build-arg "SDN_RELEASE_TAG=${RELEASE_TAG}" \
            -f deployment/docker/Dockerfile \
            .
          docker run --rm "${image_ref}" --help >/tmp/spacedatanetwork-container-help.txt
          # The stamp is invisible at build time and only shows up as a wrong
          # agent string on a live node, so assert it here where it is cheap.
          want="version=${RELEASE_TAG#v}"
          got="$(docker run --rm "${image_ref}" version | head -1)"
          if [ "$got" != "$want" ]; then
            echo "container reports '$got', expected '$want' — SDN_RELEASE_TAG did not reach the build" >&2
            exit 1
          fi
          docker save "${image_ref}" | gzip -n > "dist/container-images/spacedatanetwork-container-${NATIVE_PACKAGE_VERSION}-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: container-image-${{ matrix.arch }}
          path: dist/container-images/spacedatanetwork-container-${{ needs.beta-version.outputs.native_package_version }}-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: container-build-cache-${{ matrix.arch }}
          path: ${{ runner.temp }}/container-build-cache
          if-no-files-found: error
          retention-days: 1

  docker-push:
    # Preflight AND the update signing key check gate every push: a run whose
    # key is missing or untrusted, and a run from a branch (the update-signing
    # Environment refuses its key check), push nothing to Docker Hub.
    #
    # Nothing is pushed until it is shown to be the tested image. This job
    # builds the image to push into the local store from docker's layer cache,
    # compares it with the tested tarball's image (compare-container-images.mjs:
    # the layers and every config field that decides how the container runs)
    # and its version stamp, and only then pushes, from the same builder, by
    # digest. The pushed digest is then pulled back and compared the same way,
    # and docker-manifest tags nothing until both comparisons have passed.
    #
    # With publish false the same steps run against a registry on this runner
    # (the registry service, localhost:5000) instead of Docker Hub: the build,
    # both comparisons and the push are exercised, and nothing leaves the run.
    name: Push beta container image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [beta-version, ipfs, preflight, update-signing-check, docker]
    # Every need must succeed. The one exception is a dry run (publish false),
    # which pushes only to the registry on its own runner, as the cli job
    # builds without the key check.
    if: ${{ !cancelled() && needs.beta-version.result == 'success' && needs.ipfs.result == 'success' && needs.preflight.result == 'success' && needs.docker.result == 'success' && (needs.update-signing-check.result == 'success' || inputs.publish == false) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    services:
      registry:
        image: registry:2.8.3
        ports:
          - 5000:5000
    env:
      RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
      NATIVE_PACKAGE_VERSION: ${{ needs.beta-version.outputs.native_package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      # The same build context as the docker job, file for file: the layer
      # cache matches on content.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - name: Install sdn-js dependencies
        working-directory: sdn-js
        run: npm ci
      - name: Restore exact IPFS-published assets
        run: |
          mkdir -p sdn-js/ui/dist webui/build
          cp -R dist/ipfs/sdn-admin/. sdn-js/ui/dist/
          cp -R dist/ipfs/ipfs-webui/. webui/build/
      - uses: actions/download-artifact@v4
        with:
          name: container-build-cache-${{ matrix.arch }}
          path: ${{ runner.temp }}/container-build-cache
      - uses: actions/download-artifact@v4
        with:
          name: container-image-${{ matrix.arch }}
          path: dist/container-images
      # The builder shares the runner's network so that a dry run can push to
      # the registry service at localhost:5000.
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - uses: docker/login-action@v3
        if: inputs.publish != false
        with:
          registry: ${{ env.REGISTRY }}
          username: dockerdigitalarsenal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: target
        name: Choose the registry
        env:
          PUSH_IMAGE: ${{ inputs.publish != false && env.IMAGE_NAME || 'localhost:5000/space-data-network' }}
        run: echo "image=${PUSH_IMAGE}" >> "$GITHUB_OUTPUT"
      # For the LABELS only. The tags this also computes are deliberately NOT
      # passed to the builds below: a push-by-digest leg must not claim them.
      # Without this step the per-architecture images lose their OCI source,
      # revision and created annotations, which the single-arch job did emit.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
      # The image to push, into the local store: the docker job's build
      # inputs, its layer cache, and the labels the push carries. A layer the
      # cache did not supply is rebuilt here, differs from the tested one, and
      # stops the job at the comparison below, before anything is pushed.
      - name: Build the image to push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SDN_RELEASE_TAG=${{ env.RELEASE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/container-build-cache
          load: true
          tags: sdn-push-candidate:${{ matrix.arch }}
          provenance: false
          sbom: false
      - name: Compare the image to push with the tested image
        run: |
          set -euo pipefail
          tarball="dist/container-images/spacedatanetwork-container-${NATIVE_PACKAGE_VERSION}-linux-${{ matrix.arch }}.tar.gz"
          tested="$(docker load --input "${tarball}" | sed -n 's/^Loaded image: //p' | tail -n 1)"
          test -n "${tested}"
          echo "TESTED_IMAGE=${tested}" >> "$GITHUB_ENV"
          node deployment/release/compare-container-images.mjs \
            --tested "${tested}" --candidate "sdn-push-candidate:${{ matrix.arch }}" \
            --version "${RELEASE_TAG#v}"
      # WITHOUT SDN_RELEASE_TAG the image's node advertises
      # "spacedatanetwork/1.0.5" — the unstamped suite version — on libp2p
      # identify, which is the exact defect versioninfo.ReleaseTag exists to
      # fix: v1.0.5-beta.69's published image reported 1.0.5. The comparison
      # above checks the stamp; the push is the same build in the same
      # builder, so every layer comes from the image compared above.
      - id: build
        name: Push the image by digest
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SDN_RELEASE_TAG=${{ env.RELEASE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/container-build-cache
          outputs: type=image,name=${{ steps.target.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      # The pushed digest, pulled back from the registry and compared with the
      # tested image the same way. docker-manifest tags nothing unless this
      # passed for both architectures.
      - name: Compare the pushed image with the tested image
        env:
          PUSHED: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull --platform ${{ matrix.platform }} "${PUSHED}"
          node deployment/release/compare-container-images.mjs \
            --tested "${TESTED_IMAGE}" --candidate "${PUSHED}" \
            --version "${RELEASE_TAG#v}"
          {
            echo "### Container image (${{ matrix.arch }})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tested image id (tarball) | \`$(docker image inspect --format '{{.Id}}' "${TESTED_IMAGE}")\` |"
            echo "| Image id built for the push | \`$(docker image inspect --format '{{.Id}}' "sdn-push-candidate:${{ matrix.arch }}")\` |"
            echo "| Pushed digest | \`${PUSHED}\` |"
            echo "| Image id pulled back | \`$(docker image inspect --format '{{.Id}}' "${PUSHED}")\` |"
            echo ""
            echo "The image ids differ from the tested one only in the fields compare-container-images.mjs allows to differ (labels, created time)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record this architecture's digest
        if: inputs.publish != false
        run: |
          mkdir -p dist/container-arch-digests
          printf '%s' "${{ steps.build.outputs.digest }}" > "dist/container-arch-digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        if: inputs.publish != false
        with:
          name: container-arch-digest-${{ matrix.arch }}
          path: dist/container-arch-digests/${{ matrix.arch }}

  docker-manifest:
    # The tags point HERE, at a manifest listing both architectures, so that
    # `docker pull` resolves to the puller's own platform. Signing also happens
    # here and only here: cosign signs the manifest digest, which is what a
    # consumer verifies after pulling.
    #
    # `:beta` and the version tag move only after Preflight, the update
    # signing key check, both pushed images' comparisons and the container
    # install and network test have all passed.
    name: Publish beta container manifest
    runs-on: ubuntu-latest
    needs: [beta-version, preflight, update-signing-check, docker-push, artifact-docker-test-container]
    if: inputs.publish != false
    env:
      RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: container-arch-digest-*
          path: dist/container-arch-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dockerdigitalarsenal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3.4.0
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.beta-version.outputs.release_tag }}
            type=raw,value=beta
            type=sha,prefix=
      - name: Create and push the multi-architecture manifest
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          refs=""
          for f in dist/container-arch-digests/*; do
            [ -f "$f" ] || continue
            digest="$(cat "$f")"
            echo "  $(basename "$f") -> ${digest}"
            refs="${refs} ${IMAGE_NAME}@${digest}"
          done
          if [ -z "${refs}" ]; then
            echo "no per-architecture digests were published; refusing to tag an empty manifest" >&2
            exit 1
          fi
          tag_args=""
          for tag in ${TAGS}; do
            tag_args="${tag_args} -t ${tag}"
          done
          docker buildx imagetools create ${tag_args} ${refs}
      - name: Sign the manifest digest
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" \
            --format '{{json .Manifest}}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).digest))')"
          echo "manifest digest: ${digest}"
          images=""
          for tag in ${TAGS}; do
            images="${images} ${tag}@${digest}"
          done
          cosign sign --yes ${images}
          mkdir -p dist/container-digests
          printf '{"name":"%s","digest":"%s"}\n' "${IMAGE_NAME}" "${digest}" > dist/container-digests/image.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-digest
          path: dist/container-digests/image.json

  # The wallet sign-in assets and the hd-wallet WASI module every CLI archive
  # carries, staged once from the pinned npm packages. They are the same
  # bytes for every platform, and installing both npm trees on each CLI
  # runner cost up to 3.4 minutes (darwin-amd64, v1.1.8 run 44184616352).
  cli-js-inputs:
    name: Stage CLI wallet assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sdn-js/package-lock.json
      - name: Install root JS dependencies
        run: npm ci
      # hd-wallet-ui and hd-wallet-wasm are SDN-JS dependencies, not root ones,
      # so staging the wallet out of the root node_modules could never find them
      # ("hd-wallet-ui/dist missing — run 'npm ci' in sdn-js first").
      - name: Install sdn-js dependencies
        working-directory: sdn-js
        run: npm ci
      - name: Stage wallet sign-in assets
        run: |
          SDN_WALLET_NODE_MODULES="${PWD}/sdn-js/node_modules" deployment/wallet-wasm/stage-wallet-wasm.sh \
            "${PWD}/dist/wallet-wasm" "${PWD}/dist/wallet-ui"
          test -f dist/wallet-wasm/runtime/index.mjs
          test -f dist/wallet-ui/compat/index.js
          test -f node_modules/hd-wallet-wasm/dist/hd-wallet-wasi.wasm
      # Paths relative to the workspace, so a download into the workspace puts
      # each file where the archive build reads it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-js-inputs
          path: |
            dist/wallet-wasm
            dist/wallet-ui
            node_modules/hd-wallet-wasm/dist/hd-wallet-wasi.wasm
          if-no-files-found: error
          include-hidden-files: true

  cli:
    name: Build self-contained CLI archives (${{ matrix.target_os }}-${{ matrix.target_arch }})
    runs-on: ${{ matrix.runner }}
    # Empty for macOS and Windows, which run on the runner itself.
    container: ${{ matrix.container }}
    continue-on-error: ${{ matrix.experimental == true }}
    needs: [beta-version, update-signing-check, ipfs, updater-wasm, wasmedge-static, cli-js-inputs]
    # Every need must succeed, as before. The one exception is a dry run
    # (publish false), which builds the archives even where the signing key
    # check cannot run (a branch; the key's Environment admits only main).
    if: ${{ !cancelled() && needs.beta-version.result == 'success' && needs.ipfs.result == 'success' && needs.updater-wasm.result == 'success' && needs.wasmedge-static.result == 'success' && needs.cli-js-inputs.result == 'success' && (needs.update-signing-check.result == 'success' || inputs.publish == false) }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            target_arch: amd64
            runner: ubuntu-latest
            # Must match the wasmedge-static matrix entry for this platform;
            # the cache restore below fails closed if it does not. The container
            # must match too: the cgo LINK is what records the glibc version the
            # binary demands, so linking on a newer image than the prefix was
            # built in would put the floor straight back up.
            container: ubuntu:20.04
            toolchain: focal-llvm16
            archive_extension: tar.gz
            binary_name: spacedatanetwork
          - target_os: linux
            target_arch: arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:20.04
            toolchain: focal-llvm16
            archive_extension: tar.gz
            binary_name: spacedatanetwork
          - target_os: darwin
            target_arch: arm64
            runner: macos-15
            toolchain: brew-llvm18
            archive_extension: tar.gz
            binary_name: spacedatanetwork
          - target_os: darwin
            target_arch: amd64
            runner: macos-15-intel
            toolchain: brew-llvm18
            archive_extension: tar.gz
            binary_name: spacedatanetwork
          - target_os: windows
            target_arch: amd64
            runner: windows-latest
            toolchain: msys2-mingw64
            archive_extension: zip
            binary_name: spacedatanetwork.exe
    env:
      PACKAGE_VERSION: ${{ needs.beta-version.outputs.package_version }}
      RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
      TARGET_OS: ${{ matrix.target_os }}
      TARGET_ARCH: ${{ matrix.target_arch }}
      BINARY_NAME: ${{ matrix.binary_name }}
      WASMEDGE_DIR: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
    steps:
      # Before checkout, for the same reason as wasmedge-static: the bare image
      # has no git or curl. build-essential/zlib/tinfo
      # are what the link tail in link.flags names (-lz, -ltinfo) plus the
      # compiler driver itself.
      - name: Prepare the container
        if: matrix.container != ''
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ipfs-assets
          path: dist/ipfs
      # Node runs the archive bundler, which imports only Node's own modules;
      # no npm tree is installed here (see cli-js-inputs).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-js-inputs
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: updater-module-wasm
          path: packages/sdn-updater-module/dist/isomorphic
      - name: Verify updater module wasm
        run: test -f packages/sdn-updater-module/dist/isomorphic/module.wasm
      # The prefix is compiled by the MSYS2 this action installs. The runner
      # ALSO ships a standalone MinGW at C:\mingw64 which wins on PATH, and the
      # two have different libstdc++ builds: linking the prefix with the
      # standalone one left std::__get_once_call/__get_once_callable (libstdc++
      # internals behind std::call_once) undefined, among 455 symbols. Same
      # toolchain on both sides or neither works.
      - name: Install the MSYS2 toolchain (Windows)
        if: matrix.target_os == 'windows'
        id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: false
          # These are exactly what the MinGW tail in link.flags names and the
          # compiler does not already provide. libxml2 is the easy one to miss:
          # the wasmedge-static job gets it free as a dependency of the LLVM
          # package, this job installs no LLVM, and the only symptom is
          # "cannot find -lxml2" at the very end of a Go build. ws2_32, bcrypt,
          # ole32, uuid, ntdll, ktmw32 and dbghelp all come from mingw-w64-crt
          # with gcc; zstd is linked by full path out of the prefix. lld is the
          # linker the Windows CLI links with (see "Link the Windows CLI with
          # lld" below).
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-lld
      - name: Install Windows CLI build tools
        if: matrix.target_os == 'windows'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          choco install zip -y --no-progress
          # D:\a\_temp\msys64 -> /d/a/_temp/msys64 for git-bash.
          unix_root="$(printf '%s' "${MSYS2_LOCATION}" | sed -e 's|\\|/|g' -e 's|^\([A-Za-z]\):|/\L\1|')"
          mingw_bin="${unix_root}/mingw64/bin"
          test -x "${mingw_bin}/gcc.exe" || { echo "no gcc at ${mingw_bin}"; ls "${unix_root}" || true; exit 1; }
          # GITHUB_PATH PREPENDS, so this wins over C:\mingw64.
          echo "${mingw_bin}" >> "$GITHUB_PATH"
          echo "CC=${mingw_bin}/gcc.exe" >> "$GITHUB_ENV"
          echo "CXX=${mingw_bin}/g++.exe" >> "$GITHUB_ENV"
          echo "using ${mingw_bin}/gcc.exe"
          "${mingw_bin}/gcc.exe" --version | head -1
      # EVERY target, Windows included, links the runtime INTO the binary; no
      # archive stages a DLL or a .so. The bundler still has an option to stage
      # a runtime for a platform that needs one, and nothing here passes it —
      # asserted by beta-release-workflow.test.mjs, which is why no comment in
      # this file may name that flag.
      - name: Restore the static WasmEdge prefix
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          key: wasmedge-static-${{ env.WASMEDGE_VERSION }}-${{ matrix.target_os }}-${{ matrix.target_arch }}-${{ matrix.toolchain }}-${{ hashFiles('scripts/build-static-wasmedge.sh', 'scripts/wasmedge-static-env.sh') }}
          fail-on-cache-miss: true
      # Ground truth for the one symbol still undefined on Windows
      # (llvm::demangle[abi:cxx11](std::string_view)). Everything else about it
      # is inference until something on a Windows runner reads the archives.
      # Never fails the job: it is evidence, not a gate.
      - name: Which archive defines llvm::demangle (Windows diagnosis)
        if: matrix.target_os == 'windows'
        continue-on-error: true
        shell: bash
        run: |
          prefix="${WASMEDGE_DIR}"
          echo "## archives naming demangle at all"
          for a in "$prefix"/lib/libLLVMDemangle.a "$prefix"/lib/libLLVMSupport.a; do
            [ -f "$a" ] || { echo "  MISSING $a"; continue; }
            echo "-- $(basename "$a")"
            nm -C --defined-only "$a" 2>/dev/null | grep -i "llvm::demangle" | head -5 || echo "   (no defined llvm::demangle)"
            nm --defined-only "$a" 2>/dev/null | grep "8demangle" | head -5 || echo "   (no mangled 8demangle)"
          done
          echo "## every archive in the prefix that DEFINES any demangle symbol"
          for a in "$prefix"/lib/*.a; do
            if nm --defined-only "$a" 2>/dev/null | grep -q "8demangleB5cxx11"; then echo "  DEFINES(cxx11): $(basename "$a")"; fi
            if nm --defined-only "$a" 2>/dev/null | grep -q "llvm8demangle"; then echo "  DEFINES(any):   $(basename "$a")"; fi
          done
          # EVERY archive, not just libwasmedge*. The earlier version scanned
          # only our own archives, so it could never name lld or LLVM as the
          # referrer — it printed nothing by construction and looked like
          # "nobody needs it".
          echo "## who REFERENCES it, and in which form"
          for a in "$prefix"/lib/*.a; do
            b="$(basename "$a")"
            if nm --undefined-only --format=posix "$a" 2>/dev/null | grep -q "^__imp__ZN4llvm8demangle"; then
              echo "  REF-imp   $b   (wants the PE import SLOT, not the symbol)"
            fi
            if nm --undefined-only --format=posix "$a" 2>/dev/null | grep -q "^_ZN4llvm8demangle"; then
              echo "  REF-plain $b"
            fi
            :
          done
          echo "## our compiler's default C++ ABI"
          echo | "${CXX:-g++}" -x c++ -E -dM - 2>/dev/null | grep -i "GLIBCXX_USE_CXX11_ABI" || echo "  (macro not defined)"
      # STAMP THE RELEASE TAG. versioninfo.Version() is "the one version string
      # every surface reports" and falls back to the suite version when
      # ReleaseTag is empty, so an unstamped binary from v1.0.5-beta.67 answers
      # "1.0.5" — the same string beta.59 answers, and beta.58, and a dev build.
      # so neither an operator nor a support conversation can tell two builds
      # apart from what the node reports.
      #
      # This stamp ALSO reaches the libp2p agent string. versioninfo.AgentVersion
      # was a compile-time const over SuiteVersion, which an -X on a var can never
      # reach, so every 1.0.5 build advertised the identical
      # "spacedatanetwork/1.0.5"; it is now a var over Version() (runtime.go), so
      # a stamped binary presents "spacedatanetwork/<release tag>" to peers and
      # `version` prints the tag in both version= and agent=. That is a deliberate
      # wire-format change, taken by the owner. It is safe in both directions
      # because every membership check matches the NAME half only
      # (internal/epm/sdnpeers.go isSDNAgentVersion uses strings.Contains, and it
      # has had that body since the day it was written).
      #
      # versioninfo.CurrentAdvertisementFlag ("spacedatanetwork/1.0.0") is NOT
      # this string and must not follow it: it is the DHT rendezvous namespace,
      # matched EXACTLY against SupportedAdvertisementFlags.
      #
      # Every other path that produces this binary already stamps it: the
      # Dockerfile, build-local-node-bundle.sh and cut-release-local.sh. Only the
      # job that builds the PUBLISHED archives did not, and RELEASE_TAG was
      # already in its env, unused. SDN_GO_LDFLAGS is the supported way in —
      # go keeps the LAST -ldflags it is given, so passing it as an argument here
      # would silently drop the static link line (see go-with-wasmedge.sh).
      # GNU ld dies linking the Windows CLI: "collect2.exe: error: ld returned 5
      # exit status" with no other output (v1.1.0 run 43646565818, both
      # attempts), and the same with binutils 2.46-4, the version beta.70
      # linked with, and without Go 1.26's fix_debug_gdb_scripts.ld (exit 8).
      # lld links it: 370127872 bytes, `version` answers 1.1.0 (diagnostic run
      # 43649816106; 4 CPUs, 13 GB RAM and 218 GB of D: free, so not the
      # machine). link.flags is the restored prefix's own copy in this
      # workspace; the cached prefix, and every other target, are unchanged.
      - name: Link the Windows CLI with lld
        if: matrix.target_os == 'windows'
        run: |
          printf ' -fuse-ld=lld' >> "${WASMEDGE_DIR}/link.flags"
          ld.lld --version | head -1
      - name: Build target SDN binary
        env:
          SDN_GO_LDFLAGS: -X github.com/spacedatanetwork/sdn-server/internal/versioninfo.ReleaseTag=${{ needs.beta-version.outputs.release_tag }}
        run: |
          mkdir -p dist/cli-input
          GOOS="${TARGET_OS}" GOARCH="${TARGET_ARCH}" ./scripts/go-with-wasmedge.sh build -o "${PWD}/dist/cli-input/${BINARY_NAME}" ./cmd/spacedatanetwork
      # THE WHOLE POINT OF THE STATIC PREFIX, ASSERTED PER TARGET.
      #
      # The Dockerfile has always checked this (`ldd | grep -qi wasmedge` and
      # exit 1) but the five CLI archives did not. They set WASMEDGE_BUNDLE_ARG
      # to empty so no runtime is STAGED beside the binary, which is a different
      # claim: if the binary ever linked libwasmedge dynamically instead, the
      # archive would ship something that cannot start on a machine without it,
      # and nothing here would say so. That is the failure mode the whole static
      # prefix exists to prevent, so it is worth one command per platform.
      #
      # Every leg builds natively (GOOS/GOARCH match the runner), so the host's
      # own tools apply. Absence of the tool must not pass silently either.
      - name: Prove the binary carries the runtime
        shell: bash
        run: |
          set -euo pipefail
          bin="${PWD}/dist/cli-input/${BINARY_NAME}"
          test -f "${bin}"
          case "${TARGET_OS}" in
            linux)
              deps="$(ldd "${bin}" 2>&1 || true)"
              printf '%s\n' "${deps}" | grep -i wasmedge && { echo "::error::${BINARY_NAME} links libwasmedge dynamically; the static prefix did not take"; exit 1; } || true
              printf '%s\n' "${deps}" | grep -i 'libstdc++\|libgcc_s' && { echo "::error::${BINARY_NAME} links libstdc++/libgcc_s dynamically; they must be inlined"; exit 1; } || true
              ;;
            darwin)
              deps="$(otool -L "${bin}")"
              printf '%s\n' "${deps}" | grep -i wasmedge && { echo "::error::${BINARY_NAME} links libwasmedge dynamically; the static prefix did not take"; exit 1; } || true
              ;;
            windows)
              # AN ALLOWLIST, NOT A BLOCKLIST. Naming the runtime libraries
              # to reject is a game this check kept losing: it passed a binary
              # importing libstdc++-6.dll, and once that was fixed it passed one
              # importing libxml2-16.dll and zlib1.dll — MSYS2 files that exist
              # only on a build machine. The question worth asking is the
              # opposite one, "is every import part of WINDOWS", because the set
              # of OS DLLs is small and known while the set of libraries a
              # toolchain might drag in is not.
              imports="$(objdump -p "${bin}" | awk '/DLL Name/ {print tolower($3)}' | sort -u)"
              echo "--- ${BINARY_NAME} DLL imports ---"; printf '%s\n' "${imports}"
              foreign=""
              for dll in ${imports}; do
                case "${dll}" in
                  advapi32.dll|bcrypt.dll|crypt32.dll|dbghelp.dll|dnsapi.dll|gdi32.dll|\
                  iphlpapi.dll|kernel32.dll|ktmw32.dll|mswsock.dll|msvcrt.dll|netapi32.dll|\
                  normaliz.dll|ntdll.dll|ole32.dll|oleaut32.dll|powrprof.dll|psapi.dll|\
                  secur32.dll|setupapi.dll|shell32.dll|shlwapi.dll|user32.dll|userenv.dll|\
                  uuid.dll|version.dll|winmm.dll|wldap32.dll|ws2_32.dll) ;;
                  *) foreign="${foreign} ${dll}" ;;
                esac
              done
              if [ -n "${foreign}" ]; then
                echo "::error::${BINARY_NAME} imports DLL(s) Windows does not ship:${foreign} — they must be linked in"
                exit 1
              fi
              ;;
          esac
          echo "${BINARY_NAME}: no runtime library dependency"
      # THE RUNTIME PATCHES, MEASURED IN THE BINARY THAT SHIPS (design A31).
      # build-static-wasmedge.sh carries the atomic-wait and stop-token
      # patches; this proves the binary behaves patched rather than trusting
      # the version string, which reads 0.16.4 either way. It also installs
      # and round-trips the partition store's C host I/O module (A30), which
      # is POSIX-only, so Windows does not run it.
      - name: Substrate self-test on the released binary
        if: matrix.target_os != 'windows'
        run: ./dist/cli-input/${BINARY_NAME} substrate-selftest --require-patched
      # The same runtime, through the regression tests that pin each patch:
      # notify without a store, one stop ending 16 Interruptible AOT threads.
      - name: WasmEdge substrate regression tests
        if: matrix.target_os != 'windows'
        working-directory: sdn-server
        env:
          SDN_WASM_ATOMIC_REGRESSION: '1'
          SDN_WASM_REQUIRE_PATCHED: '1'
        run: ../scripts/go-with-wasmedge.sh test ./internal/wasmrt/ -count=1 -run 'TestWasiAtomicNotifyWithoutStore|TestSubstrateSelfTest|TestOneStopEndsSixteenInterruptibleAOTThreads|TestStaticBuildCarriesTheRuntimePatches' -v
      - name: Verify the staged wallet sign-in assets
        run: |
          test -f dist/wallet-wasm/runtime/index.mjs
          test -f dist/wallet-ui/compat/index.js
          test -f node_modules/hd-wallet-wasm/dist/hd-wallet-wasi.wasm
      - name: Build self-contained CLI archive
        run: |
          # Every target links the runtime in, so no bundle stages one.
          WASMEDGE_BUNDLE_ARG=""
          # --channel release, NOT beta: 'beta' is the internal fleet dev
          # lane's channel, and its binary-only payloads brick a public
          # install (they carry no runtime/). A public bundle must only ever
          # resolve the public feed.
          node deployment/release/build-self-contained-cli.mjs \
            --version "${PACKAGE_VERSION}" \
            --os "${TARGET_OS}" \
            --arch "${TARGET_ARCH}" \
            --channel release \
            --output-dir dist/cli \
            --binary-path "${PWD}/dist/cli-input/${BINARY_NAME}" \
            --sdnUIPath "${PWD}/dist/ipfs/sdn-admin" \
            --webUIPath "${PWD}/dist/ipfs/ipfs-webui" \
            --updater-wasm-path "${PWD}/packages/sdn-updater-module/dist/isomorphic/module.wasm" \
            --hd-wallet-wasm-path "${PWD}/node_modules/hd-wallet-wasm/dist/hd-wallet-wasi.wasm" \
            --wallet-wasm-path "${PWD}/dist/wallet-wasm" \
            --wallet-ui-path "${PWD}/dist/wallet-ui" \
            ${WASMEDGE_BUNDLE_ARG} \
            --license-path "${PWD}/LICENSE" \
            --readme-path "${PWD}/README.md" \
            --manifest-signature "github-actions:${RELEASE_TAG}:${GITHUB_SHA}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/cli/spacedatanetwork-${{ needs.beta-version.outputs.package_version }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.${{ matrix.archive_extension }}

  # The CLI archives are unpacked here, in a job without the key: each update
  # payload is the carrier around its archive without trust/, plus the
  # wrapped bundle's sha256, size and format (bundle.json). Each archive is
  # read only from the directory of its exact artifact name (no merge, so
  # another artifact matching the pattern stays in its own directory).
  cli-update-payloads:
    name: Build CLI update payloads
    runs-on: ubuntu-latest
    needs: [beta-version, cli]
    # A dry run (publish false) skips this job, and with it cli-update-feed
    # and cli-update-feed-verify: the update signing key signs nothing in a
    # dry run. cli-update-feed-dry-run builds, signs and verifies the same
    # feed with a key made in that run instead.
    if: inputs.publish != false
    env:
      VERSION: ${{ needs.beta-version.outputs.package_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: cli-*
          path: dist/cli
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build CLI update payloads
        run: |
          set -euo pipefail
          payload_dir="dist/update-payloads"
          rm -rf "${payload_dir}"
          mkdir -p "${payload_dir}"
          targets=(
            "darwin amd64 tar.gz"
            "darwin arm64 tar.gz"
            "linux amd64 tar.gz"
            "linux arm64 tar.gz"
            "windows amd64 zip"
          )
          # The five payloads build side by side (each in its own temporary
          # directory and output directory); every one must succeed.
          pids=()
          for target in "${targets[@]}"; do
            read -r target_os target_arch target_ext <<< "${target}"
            archive_path="dist/cli/cli-${target_os}-${target_arch}/spacedatanetwork-${VERSION}-${target_os}-${target_arch}.${target_ext}"
            if [[ ! -f "${archive_path}" ]]; then
              echo "missing CLI archive for update feed: ${archive_path}" >&2
              exit 1
            fi
            node deployment/release/build-cli-update-payload.mjs \
              --bundle-archive "${archive_path}" \
              --carrier-out-dir "${payload_dir}/${target_os}-${target_arch}" &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || failed=1
          done
          if [[ "${failed}" != 0 ]]; then
            echo "a CLI update payload failed to build" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-update-payloads
          path: dist/update-payloads
          if-no-files-found: error

  # The update signing key is used here. No program another job produced runs
  # here, and nothing another job produced is unpacked or parsed while the key
  # is in this job: the payloads arrive as carriers and digests, the manifests
  # are signed over digests and the carriers' own hashes, and the signal
  # signer is built in this job from the checked-out commit. The feed is
  # verified in full, payloads unpacked, by cli-update-feed-verify.
  cli-update-feed:
    name: Build signed CLI update feed
    runs-on: ubuntu-latest
    needs: [beta-version, cli-update-payloads]
    environment: update-signing
    env:
      VERSION: ${{ needs.beta-version.outputs.package_version }}
      SDN_UPDATE_KEY_ID: ${{ secrets.SDN_UPDATE_KEY_ID }}
      SDN_UPDATE_SEQUENCE: ${{ github.run_number }}
    outputs:
      available: ${{ steps.signing.outputs.available }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-update-payloads
          path: dist/update-payloads
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build the release signal signer
        run: |
          set -euo pipefail
          go_bin="$(command -v go || ls -1d "${RUNNER_TOOL_CACHE}"/go/*/x64/bin/go | sort -V | tail -n 1)"
          test -x "${go_bin}"
          cd sdn-server
          CGO_ENABLED=0 "${go_bin}" build -trimpath \
            -o "$RUNNER_TEMP/sdn-signal-signer/sdn-update-signal-signer" ./cmd/sdn-update-signal-signer
      - name: Sign the CLI update manifests
        id: signing
        env:
          RELEASE_MATURITY: ${{ needs.beta-version.outputs.channel }}
          SDN_UPDATE_SIGNING_KEY_PEM: ${{ secrets.SDN_UPDATE_SIGNING_KEY_PEM }}
        run: |
          set -euo pipefail
          key_check="$RUNNER_TEMP/update-key-check"
          node deployment/release/check-update-signing-key.mjs \
            --maturity "${RELEASE_MATURITY}" \
            --roots deployment/release/fleet-trust-roots.json \
            --github-output "$key_check"
          cat "$key_check" >> "$GITHUB_OUTPUT"
          if ! grep -qx 'available=true' "$key_check"; then exit 0; fi
          update_key_id="$(sed -n 's/^key_id=//p' "$key_check")"
          test -n "$update_key_id"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "created_at=${created_at}" >> "$GITHUB_OUTPUT"
          targets=(
            "darwin amd64 tar.gz"
            "darwin arm64 tar.gz"
            "linux amd64 tar.gz"
            "linux arm64 tar.gz"
            "windows amd64 zip"
          )
          for target in "${targets[@]}"; do
            read -r target_os target_arch target_ext <<< "${target}"
            # Must match the channel the bundles above were stamped with,
            # or the shipped updater reads a feed index nobody publishes.
            node deployment/release/sign-cli-update-payload.mjs \
              --payload-dir "dist/update-payloads/${target_os}-${target_arch}" \
              --version "${VERSION}" \
              --sequence "${SDN_UPDATE_SEQUENCE}" \
              --channel release \
              --platform "${target_os}" \
              --arch "${target_arch}" \
              --format "${target_ext}" \
              --key-id "${update_key_id}" \
              --created-at "${created_at}"
          done
      - name: Build the CLI update feed index
        if: steps.signing.outputs.available == 'true'
        env:
          CREATED_AT: ${{ steps.signing.outputs.created_at }}
        run: |
          set -euo pipefail
          feed_tree_root="dist/update-feed-tree"
          rm -rf "${feed_tree_root}"
          feed_args=(--out-dir "${feed_tree_root}/update-feed" --generated-at "${CREATED_AT}")
          for pair in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64; do
            feed_args+=(--entry "dist/update-payloads/${pair}/manifest.json:dist/update-payloads/${pair}/update.wasm")
          done
          node deployment/release/build-sdn-update-feed.js "${feed_args[@]}"
      - name: Sign the update signals
        if: steps.signing.outputs.available == 'true'
        env:
          SDN_UPDATE_SIGNING_KEY_PEM: ${{ secrets.SDN_UPDATE_SIGNING_KEY_PEM }}
          ROLLOUT_WINDOW_SECONDS: ${{ inputs.rollout_window_seconds }}
        run: |
          "$RUNNER_TEMP/sdn-signal-signer/sdn-update-signal-signer" \
            --key-env SDN_UPDATE_SIGNING_KEY_PEM --feed-dir dist/update-feed-tree/update-feed \
            --roots deployment/release/fleet-trust-roots.json \
            --rollout-window-seconds "${ROLLOUT_WINDOW_SECONDS}"
      - name: Pack the signed CLI update feed
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/sdn-signal-signer/sdn-update-signal-signer" --verify-only \
            --feed-dir dist/update-feed-tree/update-feed --roots deployment/release/fleet-trust-roots.json
          mkdir -p dist/update-feed
          tar -czf "dist/update-feed/spacedatanetwork-update-feed-${VERSION}.tar.gz" -C dist/update-feed-tree update-feed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.signing.outputs.available == 'true'
        with:
          name: cli-update-feed
          path: dist/update-feed/spacedatanetwork-update-feed-${{ needs.beta-version.outputs.package_version }}.tar.gz

  # The full check of the signed feed, payloads unpacked, in a job without
  # the key: the same metadata an installed node checks (every manifest
  # against fleet-trust-roots.json: signature, target, expiry, payload hashes),
  # no SEC-001 key, no trust/ in any payload, and the index agreeing with its
  # manifests. The release publishes only after this passes.
  cli-update-feed-verify:
    name: Verify the signed CLI update feed
    runs-on: ubuntu-latest
    needs: [beta-version, cli-update-feed]
    env:
      VERSION: ${{ needs.beta-version.outputs.package_version }}
      FEED_AVAILABLE: ${{ needs.cli-update-feed.outputs.available }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.cli-update-feed.outputs.available == 'true'
        with:
          name: cli-update-feed
          path: dist/update-feed
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify the signed CLI update feed
        run: |
          set -euo pipefail
          if [[ "${FEED_AVAILABLE}" != "true" ]]; then
            echo "no update feed in this release (no signing key for a beta)"
            exit 0
          fi
          mkdir -p dist/feed-check
          tar -xzf "dist/update-feed/spacedatanetwork-update-feed-${VERSION}.tar.gz" -C dist/feed-check
          node deployment/release/verify-cli-update-feed.mjs \
            --feed-dir dist/feed-check/update-feed \
            --roots deployment/release/fleet-trust-roots.json \
            --expect-version "${VERSION}" \
            --expect-count 5

  # A DRY RUN'S FEED, signed with a key made in the run, never with the update
  # signing key. With publish false, cli-update-payloads, cli-update-feed and
  # cli-update-feed-verify are skipped; this job runs their programs, their
  # reviewed steps word for word (beta-release-workflow.test.mjs holds them
  # equal), with one change: the trust roots are a file holding only the
  # throwaway key's root. It then checks that the fleet roots refuse the feed,
  # so the artifact is no update any install accepts. The production key's
  # signing path runs only in a real release (publish true, from main).
  cli-update-feed-dry-run:
    name: Build and verify a throwaway-signed CLI update feed (dry run)
    runs-on: ubuntu-latest
    needs: [beta-version, cli]
    if: ${{ !cancelled() && inputs.publish == false && needs.beta-version.result == 'success' && needs.cli.result == 'success' }}
    env:
      VERSION: ${{ needs.beta-version.outputs.package_version }}
      SDN_UPDATE_SEQUENCE: ${{ github.run_number }}
      DRY_RUN_ROOTS: dist/dry-run-update-roots.json
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: cli-*
          path: dist/cli
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build CLI update payloads
        run: |
          set -euo pipefail
          payload_dir="dist/update-payloads"
          rm -rf "${payload_dir}"
          mkdir -p "${payload_dir}"
          targets=(
            "darwin amd64 tar.gz"
            "darwin arm64 tar.gz"
            "linux amd64 tar.gz"
            "linux arm64 tar.gz"
            "windows amd64 zip"
          )
          # The five payloads build side by side (each in its own temporary
          # directory and output directory); every one must succeed.
          pids=()
          for target in "${targets[@]}"; do
            read -r target_os target_arch target_ext <<< "${target}"
            archive_path="dist/cli/cli-${target_os}-${target_arch}/spacedatanetwork-${VERSION}-${target_os}-${target_arch}.${target_ext}"
            if [[ ! -f "${archive_path}" ]]; then
              echo "missing CLI archive for update feed: ${archive_path}" >&2
              exit 1
            fi
            node deployment/release/build-cli-update-payload.mjs \
              --bundle-archive "${archive_path}" \
              --carrier-out-dir "${payload_dir}/${target_os}-${target_arch}" &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || failed=1
          done
          if [[ "${failed}" != 0 ]]; then
            echo "a CLI update payload failed to build" >&2
            exit 1
          fi
      # An Ed25519 key that exists only in this job, and a roots file that
      # holds only its root (the key id derived as update.RootKeyID derives
      # it). The key id must not be a fleet root.
      - name: Make a throwaway update signing key
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/dry-run-update-key.pem"
          openssl genpkey -algorithm ed25519 -out "${key}"
          mkdir -p "$(dirname "${DRY_RUN_ROOTS}")"
          key_id="$(node -e '
            const { createHash, createPrivateKey, createPublicKey } = require("node:crypto");
            const fs = require("node:fs");
            const [keyPath, rootsPath, fleetPath] = process.argv.slice(1);
            const spki = createPublicKey(createPrivateKey(fs.readFileSync(keyPath))).export({ type: "spki", format: "der" });
            const id = createHash("sha256").update(spki.subarray(-32)).digest("hex").slice(0, 12);
            if (Object.hasOwn(JSON.parse(fs.readFileSync(fleetPath, "utf8")), id)) throw new Error(id + " is a fleet root");
            fs.writeFileSync(rootsPath, JSON.stringify({ [id]: spki.toString("base64") }) + "\n");
            console.log(id);
          ' "${key}" "${DRY_RUN_ROOTS}" deployment/release/fleet-trust-roots.json)"
          while IFS= read -r line; do echo "::add-mask::${line}"; done < "${key}"
          {
            echo "SDN_UPDATE_KEY_ID=${key_id}"
            echo "SDN_UPDATE_SIGNING_KEY_PEM<<SDN_DRY_RUN_KEY_END"
            cat "${key}"
            echo "SDN_DRY_RUN_KEY_END"
          } >> "$GITHUB_ENV"
          rm -f "${key}"
          echo "throwaway update key ${key_id}; roots: $(cat "${DRY_RUN_ROOTS}")"
      - name: Build the release signal signer
        run: |
          set -euo pipefail
          go_bin="$(command -v go || ls -1d "${RUNNER_TOOL_CACHE}"/go/*/x64/bin/go | sort -V | tail -n 1)"
          test -x "${go_bin}"
          cd sdn-server
          CGO_ENABLED=0 "${go_bin}" build -trimpath \
            -o "$RUNNER_TEMP/sdn-signal-signer/sdn-update-signal-signer" ./cmd/sdn-update-signal-signer
      - name: Sign the CLI update manifests
        id: signing
        env:
          RELEASE_MATURITY: ${{ needs.beta-version.outputs.channel }}
        run: |
          set -euo pipefail
          key_check="$RUNNER_TEMP/update-key-check"
          node deployment/release/check-update-signing-key.mjs \
            --maturity "${RELEASE_MATURITY}" \
            --roots "${DRY_RUN_ROOTS}" \
            --github-output "$key_check"
          cat "$key_check" >> "$GITHUB_OUTPUT"
          if ! grep -qx 'available=true' "$key_check"; then exit 0; fi
          update_key_id="$(sed -n 's/^key_id=//p' "$key_check")"
          test -n "$update_key_id"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "created_at=${created_at}" >> "$GITHUB_OUTPUT"
          targets=(
            "darwin amd64 tar.gz"
            "darwin arm64 tar.gz"
            "linux amd64 tar.gz"
            "linux arm64 tar.gz"
            "windows amd64 zip"
          )
          for target in "${targets[@]}"; do
            read -r target_os target_arch target_ext <<< "${target}"
            # Must match the channel the bundles above were stamped with,
            # or the shipped updater reads a feed index nobody publishes.
            node deployment/release/sign-cli-update-payload.mjs \
              --payload-dir "dist/update-payloads/${target_os}-${target_arch}" \
              --version "${VERSION}" \
              --sequence "${SDN_UPDATE_SEQUENCE}" \
              --channel release \
              --platform "${target_os}" \
              --arch "${target_arch}" \
              --format "${target_ext}" \
              --key-id "${update_key_id}" \
              --created-at "${created_at}"
          done
      - name: The throwaway key signed the feed
        env:
          AVAILABLE: ${{ steps.signing.outputs.available }}
        run: test "${AVAILABLE}" = true
      - name: Build the CLI update feed index
        env:
          CREATED_AT: ${{ steps.signing.outputs.created_at }}
        run: |
          set -euo pipefail
          feed_tree_root="dist/update-feed-tree"
          rm -rf "${feed_tree_root}"
          feed_args=(--out-dir "${feed_tree_root}/update-feed" --generated-at "${CREATED_AT}")
          for pair in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64; do
            feed_args+=(--entry "dist/update-payloads/${pair}/manifest.json:dist/update-payloads/${pair}/update.wasm")
          done
          node deployment/release/build-sdn-update-feed.js "${feed_args[@]}"
      - name: Sign the update signals
        env:
          ROLLOUT_WINDOW_SECONDS: ${{ inputs.rollout_window_seconds }}
        run: |
          "$RUNNER_TEMP/sdn-signal-signer/sdn-update-signal-signer" \
            --key-env SDN_UPDATE_SIGNING_KEY_PEM --feed-dir dist/update-feed-tree/update-feed \
            --roots "${DRY_RUN_ROOTS}" \
            --rollout-window-seconds "${ROLLOUT_WINDOW_SECONDS}"
      - name: Pack the signed CLI update feed
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/sdn-signal-signer/sdn-update-signal-signer" --verify-only \
            --feed-dir dist/update-feed-tree/update-feed --roots "${DRY_RUN_ROOTS}"
          mkdir -p dist/update-feed
          tar -czf "dist/update-feed/spacedatanetwork-update-feed-${VERSION}.tar.gz" -C dist/update-feed-tree update-feed
      - name: Verify the signed CLI update feed
        env:
          FEED_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          if [[ "${FEED_AVAILABLE}" != "true" ]]; then
            echo "no update feed in this release (no signing key for a beta)"
            exit 0
          fi
          mkdir -p dist/feed-check
          tar -xzf "dist/update-feed/spacedatanetwork-update-feed-${VERSION}.tar.gz" -C dist/feed-check
          node deployment/release/verify-cli-update-feed.mjs \
            --feed-dir dist/feed-check/update-feed \
            --roots "${DRY_RUN_ROOTS}" \
            --expect-version "${VERSION}" \
            --expect-count 5
      - name: The fleet roots refuse the throwaway-signed feed
        run: |
          set -uo pipefail
          if node deployment/release/verify-cli-update-feed.mjs \
            --feed-dir dist/feed-check/update-feed \
            --roots deployment/release/fleet-trust-roots.json \
            --expect-version "${VERSION}" \
            --expect-count 5; then
            echo "::error::the fleet roots accept a manifest signed with the throwaway key"
            exit 1
          fi
          if "$RUNNER_TEMP/sdn-signal-signer/sdn-update-signal-signer" --verify-only \
            --feed-dir dist/update-feed-tree/update-feed --roots deployment/release/fleet-trust-roots.json; then
            echo "::error::the fleet roots accept a signal signed with the throwaway key"
            exit 1
          fi
          echo "the fleet roots refuse this feed's manifests and signals"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-update-feed-dry-run
          path: dist/update-feed/spacedatanetwork-update-feed-${{ needs.beta-version.outputs.package_version }}.tar.gz
          retention-days: 1

  desktop:
    name: Build desktop app artifacts (${{ matrix.target_os }}-${{ matrix.target_arch }})
    runs-on: ${{ matrix.runner }}
    # The Windows CLI archive it consumes is no longer experimental, but this
    # leg still is: packaging that archive into an installer has never yet run
    # to completion, because until the static link was fixed the archive did
    # not exist. Its first known hazard is already fixed (stage-node-bundle.mjs
    # assumed `unzip`, which Git for Windows does not ship); drop the flag once
    # a Windows installer has actually been produced. Until then it must not be
    # able to skip the release for the three platforms that DO build.
    # macOS legs with macos_desktop false build nothing (every step below is
    # skipped for them) and cannot hold the release either.
    continue-on-error: ${{ matrix.experimental == true || (matrix.target_os == 'macos' && inputs.macos_desktop == false) }}
    needs: [beta-version, cli]
    # As in cli-update-payloads: both needs must succeed.
    if: ${{ !cancelled() && needs.beta-version.result == 'success' && needs.cli.result == 'success' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: macos
            target_arch: arm64
            runner: macos-15
            cli_artifact: cli-darwin-arm64
            cli_bundle: spacedatanetwork-VERSION-darwin-arm64.tar.gz
            builder_args: --mac dmg zip --arm64
          - target_os: macos
            target_arch: x64
            runner: macos-15-intel
            cli_artifact: cli-darwin-amd64
            cli_bundle: spacedatanetwork-VERSION-darwin-amd64.tar.gz
            builder_args: --mac dmg zip --x64
          - target_os: windows
            target_arch: x64
            runner: windows-latest
            experimental: true
            cli_artifact: cli-windows-amd64
            cli_bundle: spacedatanetwork-VERSION-windows-amd64.zip
            builder_args: --win nsis portable --x64
          - target_os: linux
            target_arch: x64
            runner: ubuntu-latest
            cli_artifact: cli-linux-amd64
            cli_bundle: spacedatanetwork-VERSION-linux-amd64.tar.gz
            builder_args: --linux AppImage deb tar.xz --x64
    env:
      PACKAGE_VERSION: ${{ needs.beta-version.outputs.package_version }}
      # 'true' on a macOS leg of a run dispatched with macos_desktop false: the
      # key staging, build, collect and upload steps below are skipped.
      MACOS_DESKTOP_OFF: ${{ matrix.target_os == 'macos' && inputs.macos_desktop == false }}
    steps:
      - uses: actions/checkout@v4
      # The desktop app SHIPS the node: each app carries the self-contained
      # bundle the cli job built for its own operating system and architecture.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cli_artifact }}
          path: dist/cli
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux desktop packaging dependencies
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg
      - name: Install Desktop dependencies
        working-directory: desktop
        # `npm --prefix desktop ci` resolved devDependencies against the REPO
        # root, so electron was never installed in desktop/node_modules and
        # electron-builder failed with "Cannot compute electron version from
        # installed node modules". working-directory is unambiguous.
        run: npm ci
      - name: Stage the node bundle
        run: |
          bundle="dist/cli/${CLI_BUNDLE/VERSION/${PACKAGE_VERSION}}"
          test -f "${bundle}"
          node desktop/scripts/stage-node-bundle.mjs --from "${bundle}"
        env:
          CLI_BUNDLE: ${{ matrix.cli_bundle }}
      # electron-builder takes the version from desktop/package.json, which is
      # a checked-in literal nothing stamps — so every release so far shipped
      # desktop artifacts labelled with whatever that file happened to say.
      # v1.0.5-beta.59 published 11 assets named 1.0.5-beta.1 beside 10 named
      # 1.0.5-beta.59: the installer a user downloads reports a version that is
      # not the release it came from, which no support conversation or update
      # check can recover from. Written with node rather than `npm version` so
      # no lifecycle script runs and no git tag is attempted.
      - name: Stamp the desktop version
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            const version = process.env.PACKAGE_VERSION;
            if (!version) { throw new Error("PACKAGE_VERSION is empty"); }
            pkg.version = version;
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
            console.log(`desktop/package.json version = ${version}`);
          '
      # notarytool wants the App Store Connect key as a FILE PATH, and a GitHub
      # secret is a string — so the .p8 arrives base64-encoded and is written to
      # the runner's temp dir here. Skipped entirely when the secret is unset,
      # which leaves the Apple ID fallback (or the ad-hoc path) in charge.
      # The `secrets` context is NOT available in a step's `if:` — only in
      # `env:` — so the presence check happens in the shell, not the condition.
      # Written the other way this step would silently never run.
      - name: Stage the App Store Connect key
        if: runner.os == 'macOS' && env.MACOS_DESKTOP_OFF != 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "${APPLE_API_KEY_P8_BASE64}" ]; then
            echo "No App Store Connect key configured; notarization will use the Apple ID fallback, or the build stays ad-hoc signed."
            exit 0
          fi
          key_path="${RUNNER_TEMP}/asc-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          # The PATH reaches the build environment; the key contents never do.
          echo "APPLE_API_KEY=${key_path}" >> "$GITHUB_ENV"
          echo "Staged the App Store Connect key for notarytool."
      - name: Build Desktop artifacts
        if: env.MACOS_DESKTOP_OFF != 'true'
        env:
          # macOS Developer ID signing + notarization. Every variable here is
          # empty until the matching secret exists, and the build degrades
          # cleanly in that state: pkgs/macos/signing-identity.js reports no
          # identity, adhoc-sign.js signs with "-" so the app still launches on
          # Apple Silicon, and notarize-build.js returns without submitting.
          #
          # With the cert present, notarization is MANDATORY rather than
          # best-effort: Gatekeeper blocks a signed-but-unnotarized app with the
          # same "Apple could not verify" dialog as an unsigned one, whose only
          # buttons are Move to Trash and Done. notarize-build.js throws in that
          # state rather than let a build look fixed and not be.
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          # Preferred: an App Store Connect API key, which survives a password
          # rotation and is not tied to one person's Apple ID or their 2FA.
          # APPLE_API_KEY is set by the step above, as a path.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Fallback.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Auto-discovery searches the LOCAL keychain, which is the developer's
          # own Mac, never a runner: on CI the certificate arrives as CSC_LINK.
          # Leaving it off when there is no certificate is what makes the ad-hoc
          # fallback deterministic instead of dependent on runner state.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MACOS_CSC_LINK != '' }}
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
        working-directory: desktop
        run: npm exec -- electron-builder --publish never ${{ matrix.builder_args }}
      - name: Collect Desktop artifacts
        if: env.MACOS_DESKTOP_OFF != 'true'
        run: |
          mkdir -p dist/desktop
          find desktop/dist -maxdepth 1 -type f -exec cp {} dist/desktop/ \;
          # The two macOS legs run on different runners and each writes a
          # latest-mac.yml listing only its own architecture, so the release
          # job's merge-multiple download let one overwrite the other —
          # v1.0.5-beta.69 shipped the x64 one and would have updated every
          # Apple Silicon install onto the Intel build. Name them apart here;
          # scripts/merge-mac-update-feed.mjs puts them back together.
          if [ -f dist/desktop/latest-mac.yml ]; then
            mv dist/desktop/latest-mac.yml "dist/desktop/latest-mac-${{ matrix.target_arch }}.yml"
          fi
      - uses: actions/upload-artifact@v4
        if: env.MACOS_DESKTOP_OFF != 'true'
        with:
          name: desktop-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/desktop/*
          if-no-files-found: error

  packages:
    name: Build beta native packages and SBOM
    runs-on: ubuntu-latest
    # Same image as the cli job, for the same reason: this builds the binary the
    # RPM and DEB carry, and the link is what fixes the glibc floor. Building it
    # anywhere newer is what made the install-tests refuse to run the package.
    container: ubuntu:20.04
    needs: [beta-version, ipfs, wasmedge-static]
    env:
      VERSION: ${{ needs.beta-version.outputs.native_package_version }}
      # The RPM/DEB and the VM tarball carry the SAME single-file binary the CLI
      # archives do. Before this they were built against a ~/.wasmedge that no
      # runner has, so the job died on the first line of the packaging script.
      WASMEDGE_DIR: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
    steps:
      - name: Prepare the container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev rpm
          # The workspace is owned by the runner user and this container is
          # root, so git refuses it as "dubious ownership" and `go build`'s VCS
          # stamping dies with exit status 128. Submodules make a single path
          # insufficient.
          git config --global --add safe.directory '*' 
      - uses: actions/checkout@v4
      - name: Restore the static WasmEdge prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          key: wasmedge-static-${{ env.WASMEDGE_VERSION }}-linux-amd64-focal-llvm16-${{ hashFiles('scripts/build-static-wasmedge.sh', 'scripts/wasmedge-static-env.sh') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - name: Restore exact IPFS-published assets
        run: |
          mkdir -p sdn-js/ui/dist webui/build
          cp -R dist/ipfs/sdn-admin/. sdn-js/ui/dist/
          cp -R dist/ipfs/ipfs-webui/. webui/build/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install JS dependencies
        working-directory: sdn-js
        run: npm ci
      - name: Install nfpm and syft
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          # No sudo: this job runs as root inside ubuntu:20.04, and the image
          # has no sudo at all ("sudo: not found").
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          "${RUNNER_TEMP}/bin/nfpm" --version
          syft version
      - name: Build RPM and DEB artifacts
        run: deployment/packaging/build-linux-packages.sh
      - name: Build Linux VM tarball
        run: deployment/scripts/package-linux-vm-bundle.sh
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist/sbom
          syft dir:dist/package-root -o cyclonedx-json=dist/sbom/spacedatanetwork-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: |
            dist/packages/*
            dist/linux-vm/*.tar.gz
            dist/sbom/spacedatanetwork-sbom.cdx.json

  sdn-js-package:
    name: Build beta sdn-js package
    runs-on: ubuntu-latest
    needs: beta-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - name: Install dependencies
        working-directory: sdn-js
        run: npm ci
      - name: Build browser and Node package
        working-directory: sdn-js
        run: npm run build:package
      - name: Pack npm tarball
        working-directory: sdn-js
        run: |
          mkdir -p ../dist/sdn-js
          npm pack --pack-destination ../dist/sdn-js
      - uses: actions/upload-artifact@v4
        with:
          name: sdn-js-package
          path: dist/sdn-js/*.tgz

  # The install and network test, as three jobs that run side by side, each
  # starting as soon as its own artifacts exist (scenarios in
  # test-release-artifacts-docker.mjs; together they are its `all`, the single
  # job this was). Each runs its own first-start seed node from the full DEB.
  #
  # 600 s per service, not 180: a node's FIRST start compiles its FlatSQL and
  # module AOT artifacts, and v1.1.0 run 43650420385's full-deb container was
  # still starting when 180 s ran out (its log: AOT compile and substrate
  # self-test done ~85 s in, health never answered). The same artifacts on
  # bare runners took 76-173 s just to reach the bootstrap nodes (diagnostic
  # run 43652965924).
  artifact-docker-test:
    name: Install and network-test release artifacts (packages)
    runs-on: ubuntu-latest
    needs: [beta-version, ipfs, packages]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the DEB, RPM and VM artifacts and verify their SDN network
        run: npm run test:release-artifacts:docker -- --release-dir dist --timeout-ms 600000 --scenario packages

  artifact-docker-test-container:
    name: Install and network-test release artifacts (container)
    runs-on: ubuntu-latest
    needs: [beta-version, packages, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: dist
      # This runner is amd64.
      - uses: actions/download-artifact@v4
        with:
          name: container-image-amd64
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the container image and verify its SDN network
        run: npm run test:release-artifacts:docker -- --release-dir dist --timeout-ms 600000 --scenario container

  # The sdn-js install (about two minutes of npm install) is here, beside the
  # CLI archive, and not on the container job, where it slowed the seed's
  # first start (dry run 44391918187).
  artifact-docker-test-cli:
    name: Install and network-test release artifacts (CLI archive and sdn-js)
    runs-on: ubuntu-latest
    needs: [beta-version, cli, sdn-js-package]
    # Every need must succeed (written out as in cli-update-payloads).
    if: ${{ !cancelled() && needs.beta-version.result == 'success' && needs.cli.result == 'success' && needs.sdn-js-package.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli-linux-amd64
          path: dist/cli
      - uses: actions/download-artifact@v4
        with:
          name: sdn-js-package
          path: dist/sdn-js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the Linux CLI archive and the sdn-js package
        run: npm run test:release-artifacts:docker -- --release-dir dist --timeout-ms 600000 --scenario cli

  release:
    name: Publish beta GitHub release
    runs-on: ubuntu-latest
    # Every check, named here directly: the builds no longer wait for
    # Preflight or the key check, so nothing reaches this job through them.
    needs: [beta-version, update-signing-check, preflight, ipfs, updater-wasm, wasmedge-static, docker, docker-push, docker-manifest, cli-js-inputs, cli, cli-update-payloads, cli-update-feed, cli-update-feed-verify, desktop, packages, sdn-js-package, artifact-docker-test, artifact-docker-test-container, artifact-docker-test-cli]
    if: inputs.publish != false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdn-js-package
          path: dist/sdn-js
      - uses: actions/download-artifact@v4
        with:
          pattern: container-image-*
          path: dist/container-images
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: container-digest
          path: dist/container-digests
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      # Absent when the signing key is not configured; see cli-update-feed.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cli-update-feed
          path: dist/update-feed
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/desktop
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build container digest manifest
        run: |
          node - <<'NODE'
          const { readdirSync, readFileSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const dir = 'dist/container-digests';
          const images = readdirSync(dir)
            .filter((file) => file.endsWith('.json'))
            .sort()
            .map((file) => JSON.parse(readFileSync(join(dir, file), 'utf8')));
          writeFileSync('dist/container-digests.json', `${JSON.stringify({ images }, null, 2)}\n`);
          NODE
      # No macOS desktop app, no macOS update feed to merge (the merge refuses an
      # empty set by design).
      - name: Merge the macOS update feeds into one latest-mac.yml
        if: inputs.macos_desktop != false
        run: node scripts/merge-mac-update-feed.mjs dist/desktop
      - name: Assemble beta release artifacts
        env:
          VERSION: ${{ needs.beta-version.outputs.package_version }}
          RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
          # false: the macOS desktop app is optional and listed under "Not in
          # this release" (owner decision 2026-11-14, see the input above).
          MACOS_DESKTOP: ${{ inputs.macos_desktop != false }}
          # beta or stable: words the notes and the manifest. The update
          # channel the payloads carry stays `--channel release` either way.
          RELEASE_MATURITY: ${{ needs.beta-version.outputs.channel }}
        run: deployment/release/assemble-beta-release-artifacts.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.beta-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.beta-version.outputs.release_name }}
          body_path: dist/release/SDN-BETA-RELEASE.md
          # A release may already exist for the tag, with notes written by a
          # person (v1.1.0 was published by hand before its assets were built).
          # Append the generated artifact notes to them instead of replacing
          # them; for a new release the existing body is empty and this is the
          # same as before.
          append_body: true
          prerelease: false
          make_latest: true
          files: dist/release/*

  published-installer-smoke:
    name: Smoke published installers (${{ matrix.target_os }})
    runs-on: ${{ matrix.runner }}
    # Windows carries the same experimental policy as every other Windows leg.
    # There is no Windows archive in the release while the CLI build is broken,
    # so this leg cannot pass, and letting it fail the whole run would paint a
    # successful release red — which trains everyone to ignore the status.
    continue-on-error: ${{ matrix.experimental == true }}
    needs: [beta-version, release]
    if: inputs.publish != false
    env:
      SDN_VERSION: ${{ needs.beta-version.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            runner: ubuntu-latest
          - target_os: macos
            runner: macos-15
          - target_os: windows
            runner: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Smoke clean-user published installer
        run: node deployment/release/published-install-smoke.mjs --platform ${{ matrix.target_os }}
