name: SDN Beta Release Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional beta release version, for example v1.0.3-beta.7. Leave blank to use v<package version>-beta.<run number>.
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: dockerdigitalarsenal/space-data-network
  KUBO_VERSION: v0.39.0
  WASMEDGE_VERSION: 0.16.4
  NFPM_VERSION: v2.42.0

jobs:
  beta-version:
    name: Resolve beta version
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      package_version: ${{ steps.version.outputs.package_version }}
      native_package_version: ${{ steps.version.outputs.native_package_version }}
      release_name: ${{ steps.version.outputs.release_name }}
      channel: ${{ steps.version.outputs.channel }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: version
        name: Compute beta release number
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node deployment/release/prepare-beta-release.mjs
      # CAN THIS TOKEN ACTUALLY PUBLISH? Ask now, in the first job, not after
      # forty minutes of building every artifact for five platforms.
      #
      # Run 35095153877 built everything — including the first working Windows
      # CLI — and then died in the publish step with 403 "Resource not
      # accessible by integration", while the job log showed `Contents: write`
      # granted. Declared permissions were correct, the repo default was write,
      # there were no rulesets and no pre-existing tag; an admin PAT could
      # create a release at the same moment the Actions token could not. That
      # combination means the restriction is above the repository, and no
      # amount of building will reveal it.
      #
      # A DRAFT release is the only honest probe: GitHub exposes no "may I?"
      # endpoint, `permissions.push` still reads true in this state, and a
      # draft creates no tag and is not publicly visible. It is deleted
      # immediately, including when the step fails.
      - name: Check the token can publish a release
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_TAG: zz-publish-probe-${{ github.run_id }}
        run: |
          set -uo pipefail
          probe_id=""
          cleanup() {
            if [ -n "${probe_id}" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${probe_id}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          response="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${PROBE_TAG}" \
            -f name="publish permission probe" \
            -F draft=true 2>&1)" || true
          probe_id="$(printf '%s' "${response}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).id||""))}catch(e){}})')"

          if [ -z "${probe_id}" ]; then
            echo "::error::This workflow's GITHUB_TOKEN cannot create a GitHub release, so the run would build every artifact and then fail at the final step."
            echo "The API said:" >&2
            printf '%s\n' "${response}" | head -5 >&2
            echo "" >&2
            echo "The repository side is not the problem if you see 'Contents: write' in this job's GITHUB_TOKEN Permissions group above." >&2
            echo "Check the ORGANISATION policy: Settings -> Actions -> General -> Workflow permissions, and any org ruleset targeting tags." >&2
            exit 1
          fi
          echo "publish permission OK (probe release ${probe_id}, deleted)"

  # One static WasmEdge, built once and reused. Building LLVM is expensive, so
  # it is cached on the version alone; nothing here is installed into a job, it
  # is linked INTO the binaries that ship.
  # One static WasmEdge PER PLATFORM. The cli job builds natively on five
  # runners, and a Linux prefix cannot link a macOS or Windows binary, so the
  # prefix is a matrix over the same runners. Building LLVM is expensive, so
  # each is cached on the version + layout and rebuilt only when those change.
  wasmedge-static:
    name: Build static WasmEdge (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    # Empty for the macOS and Windows legs, which have no container key and so
    # run directly on the runner.
    container: ${{ matrix.container }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `toolchain` tags the INSTALLED package set below. It is part of the
          # cache key and has to be bumped by hand when that set changes: the
          # actions that install it take literal inputs, so no hashFiles() can
          # see them. Everything else that shapes a prefix is hashed from
          # scripts/.
          # ubuntu:20.04, NOT the runner's own image. glibc is the only thing
          # these binaries still need from the host, and its required version is
          # set by whatever built them: on ubuntu-24.04 that was 2.38, which does
          # not exist on Debian 12, Ubuntu 22.04 or RHEL 9 — most of the server
          # install base. The release install-tests proved it by refusing to run
          # the package at all. focal's 2.31 covers everything current, and its
          # apt.llvm.org repo carries the SAME llvm-16 used before, so nothing
          # about the build changes except the floor.
          - label: linux-amd64
            runner: ubuntu-latest
            container: ubuntu:20.04
            toolchain: focal-llvm16
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:20.04
            toolchain: focal-llvm16
          - label: darwin-arm64
            runner: macos-14
            toolchain: brew-llvm18
          - label: darwin-amd64
            runner: macos-15-intel
            toolchain: brew-llvm18
          # Windows: MSVC's lib.exe cannot perform the `ar -x` extraction
          # WasmEdge's static merge does, so the toolchain is clang + llvm-ar.
          #
          # NOW BLOCKING. This was non-blocking "until a Windows static prefix
          # is proven"; it is proven — run 35095153877 built the prefix and
          # linked a self-contained windows-amd64 CLI with zero undefined
          # references. A regression here should stop the release rather than
          # quietly ship four platforms out of five.
          - label: windows-amd64
            runner: windows-latest
            toolchain: msys2-mingw64
    defaults:
      run:
        shell: bash
    steps:
      # BEFORE checkout: actions/checkout needs git, and a bare ubuntu:20.04 has
      # none. Nothing else in this job can run until the tree is present.
      - name: Prepare the container
        if: matrix.container != ''
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl gnupg git xz-utils
          git config --global --add safe.directory '*' 
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          # The key covers EVERYTHING THAT DECIDES HOW THE PREFIX IS BUILT: the
          # build script, the toolchain-selection script, and matrix.toolchain
          # for the package set the workflow installs. Staleness has bitten
          # three times, each time as a fix that silently never ran: absolute
          # paths in link.flags, a missing -lc++abi, then a prefix still
          # compiled with Homebrew's libc++ after the build moved to the system
          # toolchain. darwin-amd64 passed and darwin-arm64 failed on the same
          # commit purely because one had a cache and the other did not.
          #
          # It deliberately does NOT hash this whole workflow any more. That
          # version was correct but far too broad — editing an unrelated job
          # discarded five prefixes and paid a full LLVM + WasmEdge rebuild on
          # five runners to learn nothing had changed.
          key: wasmedge-static-${{ env.WASMEDGE_VERSION }}-${{ matrix.label }}-${{ matrix.toolchain }}-${{ hashFiles('scripts/build-static-wasmedge.sh', 'scripts/wasmedge-static-env.sh') }}
      # No sudo: this runs as root inside the container. focal's own cmake is
      # 3.16 and WasmEdge needs >= 3.18, so cmake comes from Kitware's release
      # tarball; everything else is apt, with llvm-16 from apt.llvm.org because
      # focal's archive stops at 10. liblld-16-dev is the package that matters —
      # it ships the STATIC lld archives WasmEdge's AOT links through, which is
      # why RHEL-family images were rejected: their lld-devel is headers only.
      - name: Install build toolchain (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        env:
          CMAKE_VERSION: '3.31.6'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          echo "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-16 main" > /etc/apt/sources.list.d/llvm.list
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ninja-build clang-16 llvm-16-dev liblld-16-dev libpolly-16-dev \
            libzstd-dev zlib1g-dev libtinfo-dev build-essential
          case "$(uname -m)" in
            x86_64) cmake_arch=linux-x86_64 ;;
            aarch64) cmake_arch=linux-aarch64 ;;
            *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-${cmake_arch}.tar.gz" | tar -xz -C /opt
          echo "/opt/cmake-${CMAKE_VERSION}-${cmake_arch}/bin" >> "$GITHUB_PATH"
      - name: Install build toolchain (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install cmake ninja llvm@18 zstd
      # MSYS2, not choco. The choco/official LLVM for Windows ships the
      # toolchain WITHOUT lib/cmake/llvm or the static archives, so
      # WASMEDGE_LINK_LLVM_STATIC cannot resolve LLVMConfig.cmake — a search of
      # the whole C: drive found none. MSYS2's mingw-w64-x86_64-llvm ships both,
      # and its GNU ar takes the same `ar -x` path WasmEdge's static merge uses
      # on every non-Apple platform.
      - name: Install build toolchain (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-libiconv
            git
      # Two steps, not one: the toolchain choice is identical (both source
      # scripts/wasmedge-static-env.sh), but a step-level `shell:` cannot read
      # the runner or matrix context, so Windows needing `msys2 {0}` has to be
      # an `if:`, which can.
      - name: Build the static prefix (Unix)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          . scripts/wasmedge-static-env.sh
          WASMEDGE_STATIC_WORK="${GITHUB_WORKSPACE}/.sdn-wasmedge-static" \
          WASMEDGE_STATIC_PREFIX_ONLY=1 \
          bash scripts/build-static-wasmedge.sh

      - name: Build the static prefix (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          . scripts/wasmedge-static-env.sh
          WASMEDGE_STATIC_WORK="${GITHUB_WORKSPACE}/.sdn-wasmedge-static" \
          WASMEDGE_STATIC_PREFIX_ONLY=1 \
          bash scripts/build-static-wasmedge.sh

      - name: Prove the prefix is relocatable
        run: |
          F="${GITHUB_WORKSPACE}/.sdn-wasmedge-static/prefix/link.flags"
          grep -q '@PREFIX@' "$F"
          ! grep -qE '/usr/lib/llvm|/opt/homebrew|/home/runner|/Users/' "$F"

  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    # Same image as everything else that links the prefix. The Go test below
    # does a real cgo link, so it has to agree with the archives it links; and
    # if anything about the focal toolchain is wrong, failing HERE is much
    # cheaper than finding out in five parallel build jobs.
    container: ubuntu:20.04
    needs: [beta-version, wasmedge-static]
    steps:
      - name: Prepare the container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          key: wasmedge-static-${{ env.WASMEDGE_VERSION }}-linux-amd64-focal-llvm16-${{ hashFiles('scripts/build-static-wasmedge.sh', 'scripts/wasmedge-static-env.sh') }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install JS dependencies
        working-directory: sdn-js
        run: npm ci
      - name: JS runtime tests
        working-directory: sdn-js
        run: npm test -- src/ui/runtime/modules.test.ts
      # Release SHAPE only. The module runtime belongs to the SDS runtime
      # environment and is exercised by its own harnesses; a release cut has no
      # business starting it.
      - name: Go release-layout tests
        working-directory: sdn-server
        env:
          WASMEDGE_DIR: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
        run: ../scripts/go-with-wasmedge.sh test ./cmd/spacedatanetwork -run 'TestVerifyReleaseDirectory'

  ipfs:
    name: Build and pin static assets
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - name: Install Kubo
        run: |
          deployment/release/download-kubo.sh \
            --version "${KUBO_VERSION}" \
            --platform linux-amd64 \
            --archive tar.gz \
            --output-dir dist/bootstrap-kubo
          sudo install dist/bootstrap-kubo/kubo/ipfs /usr/local/bin/ipfs
          ipfs init --profile=server
          ipfs daemon > /tmp/ipfs.log 2>&1 &
          until ipfs id >/dev/null 2>&1; do sleep 1; done
      - name: Build and pin UI assets
        run: deployment/ipfs/ipfs-deploy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ipfs-assets
          path: |
            dist/ipfs/ipfs-deployment.json
            dist/ipfs/sdn-admin
            dist/ipfs/ipfs-webui

  updater-wasm:
    name: Build updater module wasm
    runs-on: ubuntu-latest
    needs: preflight
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root JS dependencies
        run: npm ci
      - name: Build updater module wasm
        run: npm --prefix packages/sdn-updater-module run build
      - uses: actions/upload-artifact@v4
        with:
          name: updater-module-wasm
          path: packages/sdn-updater-module/dist/isomorphic/module.wasm
          if-no-files-found: error

  docker:
    # ONE IMAGE PER ARCHITECTURE, MERGED INTO ONE MANIFEST BELOW.
    #
    # The image was linux/amd64 only, so `docker pull` on Apple Silicon and on
    # ARM servers got an amd64 image and ran it under emulation. The Dockerfile
    # builds WasmEdge and LLVM from source, which is exactly the workload that
    # makes QEMU untenable, so each architecture builds on its own NATIVE
    # runner: the amd64 leg measured 8.2 min, and ubuntu-24.04-arm is already
    # proven in this workflow by the linux-arm64 wasmedge-static leg.
    #
    # Each leg pushes BY DIGEST and tags nothing. Tags belong to the manifest,
    # and a per-arch push that claimed them would leave whichever leg finished
    # last owning `:beta` as a single-architecture image.
    name: Build beta container image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [beta-version, ipfs]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
      NATIVE_PACKAGE_VERSION: ${{ needs.beta-version.outputs.native_package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      # The image COPYs sdn-js/node_modules/hd-wallet-wasm/dist/hd-wallet-wasi.wasm
      # into the build context, so those dependencies must exist before buildx
      # runs — otherwise the build fails computing that path's checksum.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - name: Install sdn-js dependencies
        working-directory: sdn-js
        run: npm ci
      - name: Restore exact IPFS-published assets
        run: |
          mkdir -p sdn-js/ui/dist webui/build
          cp -R dist/ipfs/sdn-admin/. sdn-js/ui/dist/
          cp -R dist/ipfs/ipfs-webui/. webui/build/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dockerdigitalarsenal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # For the LABELS only. The tags this also computes are deliberately NOT
      # passed to the build below: a push-by-digest leg must not claim them.
      # Without this step the per-architecture images lose their OCI source,
      # revision and created annotations, which the single-arch job did emit.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
      - id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # WITHOUT THIS the image's node advertises "spacedatanetwork/1.0.5"
          # — the unstamped suite version — on libp2p identify, which is the
          # exact defect versioninfo.ReleaseTag exists to fix: every 1.0.5
          # build, release and dev alike, looked byte-identical to peers. The
          # tarball build passed the stamp from the day it was added; this one
          # never did, so v1.0.5-beta.69's published image reported 1.0.5.
          build-args: |
            SDN_RELEASE_TAG=${{ env.RELEASE_TAG }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
      - name: Record this architecture's digest
        run: |
          mkdir -p dist/container-arch-digests
          printf '%s' "${{ steps.build.outputs.digest }}" > "dist/container-arch-digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: container-arch-digest-${{ matrix.arch }}
          path: dist/container-arch-digests/${{ matrix.arch }}
      # The downloadable tarball is a SEPARATE --load build: `docker save` reads
      # the local image store, and a push-by-digest build never lands there.
      - name: Export downloadable Docker image
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          mkdir -p dist/container-images
          image_ref="${IMAGE_NAME}:${RELEASE_TAG}-${{ matrix.arch }}"
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --load \
            -t "${image_ref}" \
            --build-arg "SDN_RELEASE_TAG=${RELEASE_TAG}" \
            -f deployment/docker/Dockerfile \
            .
          docker run --rm "${image_ref}" --help >/tmp/spacedatanetwork-container-help.txt
          # The stamp is invisible at build time and only shows up as a wrong
          # agent string on a live node, so assert it here where it is cheap.
          want="version=${RELEASE_TAG#v}"
          got="$(docker run --rm "${image_ref}" version | head -1)"
          if [ "$got" != "$want" ]; then
            echo "container reports '$got', expected '$want' — SDN_RELEASE_TAG did not reach the build" >&2
            exit 1
          fi
          docker save "${image_ref}" | gzip -n > "dist/container-images/spacedatanetwork-container-${NATIVE_PACKAGE_VERSION}-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: container-image-${{ matrix.arch }}
          path: dist/container-images/spacedatanetwork-container-${{ needs.beta-version.outputs.native_package_version }}-linux-${{ matrix.arch }}.tar.gz

  docker-manifest:
    # The tags point HERE, at a manifest listing both architectures, so that
    # `docker pull` resolves to the puller's own platform. Signing also happens
    # here and only here: cosign signs the manifest digest, which is what a
    # consumer verifies after pulling.
    name: Publish beta container manifest
    runs-on: ubuntu-latest
    needs: [beta-version, docker]
    env:
      RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: container-arch-digest-*
          path: dist/container-arch-digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: dockerdigitalarsenal
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3.4.0
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.beta-version.outputs.release_tag }}
            type=raw,value=beta
            type=sha,prefix=
      - name: Create and push the multi-architecture manifest
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          refs=""
          for f in dist/container-arch-digests/*; do
            [ -f "$f" ] || continue
            digest="$(cat "$f")"
            echo "  $(basename "$f") -> ${digest}"
            refs="${refs} ${IMAGE_NAME}@${digest}"
          done
          if [ -z "${refs}" ]; then
            echo "no per-architecture digests were published; refusing to tag an empty manifest" >&2
            exit 1
          fi
          tag_args=""
          for tag in ${TAGS}; do
            tag_args="${tag_args} -t ${tag}"
          done
          docker buildx imagetools create ${tag_args} ${refs}
      - name: Sign the manifest digest
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" \
            --format '{{json .Manifest}}' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).digest))')"
          echo "manifest digest: ${digest}"
          images=""
          for tag in ${TAGS}; do
            images="${images} ${tag}@${digest}"
          done
          cosign sign --yes ${images}
          mkdir -p dist/container-digests
          printf '{"name":"%s","digest":"%s"}\n' "${IMAGE_NAME}" "${digest}" > dist/container-digests/image.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-digest
          path: dist/container-digests/image.json

  cli:
    name: Build self-contained CLI archives (${{ matrix.target_os }}-${{ matrix.target_arch }})
    runs-on: ${{ matrix.runner }}
    # Empty for macOS and Windows, which run on the runner itself.
    container: ${{ matrix.container }}
    continue-on-error: ${{ matrix.experimental == true }}
    needs: [beta-version, ipfs, updater-wasm, wasmedge-static]
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            target_arch: amd64
            runner: ubuntu-latest
            # Must match the wasmedge-static matrix entry for this platform;
            # the cache restore below fails closed if it does not. The container
            # must match too: the cgo LINK is what records the glibc version the
            # binary demands, so linking on a newer image than the prefix was
            # built in would put the floor straight back up.
            container: ubuntu:20.04
            toolchain: focal-llvm16
            kubo_platform: linux-amd64
            kubo_archive: tar.gz
            archive_extension: tar.gz
            binary_name: spacedatanetwork
            kubo_binary_name: ipfs
          - target_os: linux
            target_arch: arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:20.04
            toolchain: focal-llvm16
            kubo_platform: linux-arm64
            kubo_archive: tar.gz
            archive_extension: tar.gz
            binary_name: spacedatanetwork
            kubo_binary_name: ipfs
          - target_os: darwin
            target_arch: arm64
            runner: macos-14
            toolchain: brew-llvm18
            kubo_platform: darwin-arm64
            kubo_archive: tar.gz
            archive_extension: tar.gz
            binary_name: spacedatanetwork
            kubo_binary_name: ipfs
          - target_os: darwin
            target_arch: amd64
            runner: macos-15-intel
            toolchain: brew-llvm18
            kubo_platform: darwin-amd64
            kubo_archive: tar.gz
            archive_extension: tar.gz
            binary_name: spacedatanetwork
            kubo_binary_name: ipfs
          - target_os: windows
            target_arch: amd64
            runner: windows-latest
            toolchain: msys2-mingw64
            kubo_platform: windows-amd64
            kubo_archive: zip
            archive_extension: zip
            binary_name: spacedatanetwork.exe
            kubo_binary_name: ipfs.exe
    env:
      PACKAGE_VERSION: ${{ needs.beta-version.outputs.package_version }}
      RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
      TARGET_OS: ${{ matrix.target_os }}
      TARGET_ARCH: ${{ matrix.target_arch }}
      KUBO_PLATFORM: ${{ matrix.kubo_platform }}
      KUBO_ARCHIVE: ${{ matrix.kubo_archive }}
      BINARY_NAME: ${{ matrix.binary_name }}
      KUBO_BINARY_NAME: ${{ matrix.kubo_binary_name }}
      WASMEDGE_DIR: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
    steps:
      # Before checkout, for the same reason as wasmedge-static: the bare image
      # has no git, and download-kubo.sh needs curl. build-essential/zlib/tinfo
      # are what the link tail in link.flags names (-lz, -ltinfo) plus the
      # compiler driver itself.
      - name: Prepare the container
        if: matrix.container != ''
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install root JS dependencies
        run: npm ci
      # hd-wallet-ui and hd-wallet-wasm are SDN-JS dependencies, not root ones,
      # so staging the wallet out of the root node_modules could never find them
      # ("hd-wallet-ui/dist missing — run 'npm ci' in sdn-js first").
      - name: Install sdn-js dependencies
        working-directory: sdn-js
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: updater-module-wasm
          path: packages/sdn-updater-module/dist/isomorphic
      - name: Verify updater module wasm
        run: test -f packages/sdn-updater-module/dist/isomorphic/module.wasm
      # The prefix is compiled by the MSYS2 this action installs. The runner
      # ALSO ships a standalone MinGW at C:\mingw64 which wins on PATH, and the
      # two have different libstdc++ builds: linking the prefix with the
      # standalone one left std::__get_once_call/__get_once_callable (libstdc++
      # internals behind std::call_once) undefined, among 455 symbols. Same
      # toolchain on both sides or neither works.
      - name: Install the MSYS2 toolchain (Windows)
        if: matrix.target_os == 'windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # These are exactly what the MinGW tail in link.flags names and the
          # compiler does not already provide. libxml2 is the easy one to miss:
          # the wasmedge-static job gets it free as a dependency of the LLVM
          # package, this job installs no LLVM, and the only symptom is
          # "cannot find -lxml2" at the very end of a Go build. ws2_32, bcrypt,
          # ole32, uuid, ntdll, ktmw32 and dbghelp all come from mingw-w64-crt
          # with gcc; zstd is linked by full path out of the prefix.
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-xz
            mingw-w64-x86_64-libiconv
      - name: Install Windows CLI build tools
        if: matrix.target_os == 'windows'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          choco install zip -y --no-progress
          # D:\a\_temp\msys64 -> /d/a/_temp/msys64 for git-bash.
          unix_root="$(printf '%s' "${MSYS2_LOCATION}" | sed -e 's|\\|/|g' -e 's|^\([A-Za-z]\):|/\L\1|')"
          mingw_bin="${unix_root}/mingw64/bin"
          test -x "${mingw_bin}/gcc.exe" || { echo "no gcc at ${mingw_bin}"; ls "${unix_root}" || true; exit 1; }
          # GITHUB_PATH PREPENDS, so this wins over C:\mingw64.
          echo "${mingw_bin}" >> "$GITHUB_PATH"
          echo "CC=${mingw_bin}/gcc.exe" >> "$GITHUB_ENV"
          echo "CXX=${mingw_bin}/g++.exe" >> "$GITHUB_ENV"
          echo "using ${mingw_bin}/gcc.exe"
          "${mingw_bin}/gcc.exe" --version | head -1
      # EVERY target, Windows included, links the runtime INTO the binary; no
      # archive stages a DLL or a .so. The bundler still has an option to stage
      # a runtime for a platform that needs one, and nothing here passes it —
      # asserted by beta-release-workflow.test.mjs, which is why no comment in
      # this file may name that flag.
      - name: Restore the static WasmEdge prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          key: wasmedge-static-${{ env.WASMEDGE_VERSION }}-${{ matrix.target_os }}-${{ matrix.target_arch }}-${{ matrix.toolchain }}-${{ hashFiles('scripts/build-static-wasmedge.sh', 'scripts/wasmedge-static-env.sh') }}
          fail-on-cache-miss: true
      - name: Download target Kubo binary
        run: |
          deployment/release/download-kubo.sh \
            --version "${KUBO_VERSION}" \
            --platform "${KUBO_PLATFORM}" \
            --archive "${KUBO_ARCHIVE}" \
            --output-dir dist/kubo
      # Ground truth for the one symbol still undefined on Windows
      # (llvm::demangle[abi:cxx11](std::string_view)). Everything else about it
      # is inference until something on a Windows runner reads the archives.
      # Never fails the job: it is evidence, not a gate.
      - name: Which archive defines llvm::demangle (Windows diagnosis)
        if: matrix.target_os == 'windows'
        continue-on-error: true
        shell: bash
        run: |
          prefix="${WASMEDGE_DIR}"
          echo "## archives naming demangle at all"
          for a in "$prefix"/lib/libLLVMDemangle.a "$prefix"/lib/libLLVMSupport.a; do
            [ -f "$a" ] || { echo "  MISSING $a"; continue; }
            echo "-- $(basename "$a")"
            nm -C --defined-only "$a" 2>/dev/null | grep -i "llvm::demangle" | head -5 || echo "   (no defined llvm::demangle)"
            nm --defined-only "$a" 2>/dev/null | grep "8demangle" | head -5 || echo "   (no mangled 8demangle)"
          done
          echo "## every archive in the prefix that DEFINES any demangle symbol"
          for a in "$prefix"/lib/*.a; do
            if nm --defined-only "$a" 2>/dev/null | grep -q "8demangleB5cxx11"; then echo "  DEFINES(cxx11): $(basename "$a")"; fi
            if nm --defined-only "$a" 2>/dev/null | grep -q "llvm8demangle"; then echo "  DEFINES(any):   $(basename "$a")"; fi
          done
          # EVERY archive, not just libwasmedge*. The earlier version scanned
          # only our own archives, so it could never name lld or LLVM as the
          # referrer — it printed nothing by construction and looked like
          # "nobody needs it".
          echo "## who REFERENCES it, and in which form"
          for a in "$prefix"/lib/*.a; do
            b="$(basename "$a")"
            if nm --undefined-only --format=posix "$a" 2>/dev/null | grep -q "^__imp__ZN4llvm8demangle"; then
              echo "  REF-imp   $b   (wants the PE import SLOT, not the symbol)"
            fi
            if nm --undefined-only --format=posix "$a" 2>/dev/null | grep -q "^_ZN4llvm8demangle"; then
              echo "  REF-plain $b"
            fi
            :
          done
          echo "## our compiler's default C++ ABI"
          echo | "${CXX:-g++}" -x c++ -E -dM - 2>/dev/null | grep -i "GLIBCXX_USE_CXX11_ABI" || echo "  (macro not defined)"
      # STAMP THE RELEASE TAG. versioninfo.Version() is "the one version string
      # every surface reports" and falls back to the suite version when
      # ReleaseTag is empty, so an unstamped binary from v1.0.5-beta.67 answers
      # "1.0.5" — the same string beta.59 answers, and beta.58, and a dev build.
      # so neither an operator nor a support conversation can tell two builds
      # apart from what the node reports.
      #
      # This stamp ALSO reaches the libp2p agent string. versioninfo.AgentVersion
      # was a compile-time const over SuiteVersion, which an -X on a var can never
      # reach, so every 1.0.5 build advertised the identical
      # "spacedatanetwork/1.0.5"; it is now a var over Version() (runtime.go), so
      # a stamped binary presents "spacedatanetwork/<release tag>" to peers and
      # `version` prints the tag in both version= and agent=. That is a deliberate
      # wire-format change, taken by the owner. It is safe in both directions
      # because every membership check matches the NAME half only
      # (internal/epm/sdnpeers.go isSDNAgentVersion uses strings.Contains, and it
      # has had that body since the day it was written).
      #
      # versioninfo.CurrentAdvertisementFlag ("spacedatanetwork/1.0.0") is NOT
      # this string and must not follow it: it is the DHT rendezvous namespace,
      # matched EXACTLY against SupportedAdvertisementFlags.
      #
      # Every other path that produces this binary already stamps it: the
      # Dockerfile, build-local-node-bundle.sh and cut-release-local.sh. Only the
      # job that builds the PUBLISHED archives did not, and RELEASE_TAG was
      # already in its env, unused. SDN_GO_LDFLAGS is the supported way in —
      # go keeps the LAST -ldflags it is given, so passing it as an argument here
      # would silently drop the static link line (see go-with-wasmedge.sh).
      - name: Build target SDN binary
        env:
          SDN_GO_LDFLAGS: -X github.com/spacedatanetwork/sdn-server/internal/versioninfo.ReleaseTag=${{ needs.beta-version.outputs.release_tag }}
        run: |
          mkdir -p dist/cli-input
          GOOS="${TARGET_OS}" GOARCH="${TARGET_ARCH}" ./scripts/go-with-wasmedge.sh build -o "${PWD}/dist/cli-input/${BINARY_NAME}" ./cmd/spacedatanetwork
      # THE WHOLE POINT OF THE STATIC PREFIX, ASSERTED PER TARGET.
      #
      # The Dockerfile has always checked this (`ldd | grep -qi wasmedge` and
      # exit 1) but the five CLI archives did not. They set WASMEDGE_BUNDLE_ARG
      # to empty so no runtime is STAGED beside the binary, which is a different
      # claim: if the binary ever linked libwasmedge dynamically instead, the
      # archive would ship something that cannot start on a machine without it,
      # and nothing here would say so. That is the failure mode the whole static
      # prefix exists to prevent, so it is worth one command per platform.
      #
      # Every leg builds natively (GOOS/GOARCH match the runner), so the host's
      # own tools apply. Absence of the tool must not pass silently either.
      - name: Prove the binary carries the runtime
        shell: bash
        run: |
          set -euo pipefail
          bin="${PWD}/dist/cli-input/${BINARY_NAME}"
          test -f "${bin}"
          case "${TARGET_OS}" in
            linux)
              deps="$(ldd "${bin}" 2>&1 || true)"
              printf '%s\n' "${deps}" | grep -i wasmedge && { echo "::error::${BINARY_NAME} links libwasmedge dynamically; the static prefix did not take"; exit 1; } || true
              printf '%s\n' "${deps}" | grep -i 'libstdc++\|libgcc_s' && { echo "::error::${BINARY_NAME} links libstdc++/libgcc_s dynamically; they must be inlined"; exit 1; } || true
              ;;
            darwin)
              deps="$(otool -L "${bin}")"
              printf '%s\n' "${deps}" | grep -i wasmedge && { echo "::error::${BINARY_NAME} links libwasmedge dynamically; the static prefix did not take"; exit 1; } || true
              ;;
            windows)
              # AN ALLOWLIST, NOT A BLOCKLIST. Naming the runtime libraries
              # to reject is a game this check kept losing: it passed a binary
              # importing libstdc++-6.dll, and once that was fixed it passed one
              # importing libxml2-16.dll and zlib1.dll — MSYS2 files that exist
              # only on a build machine. The question worth asking is the
              # opposite one, "is every import part of WINDOWS", because the set
              # of OS DLLs is small and known while the set of libraries a
              # toolchain might drag in is not.
              imports="$(objdump -p "${bin}" | awk '/DLL Name/ {print tolower($3)}' | sort -u)"
              echo "--- ${BINARY_NAME} DLL imports ---"; printf '%s\n' "${imports}"
              foreign=""
              for dll in ${imports}; do
                case "${dll}" in
                  advapi32.dll|bcrypt.dll|crypt32.dll|dbghelp.dll|dnsapi.dll|gdi32.dll|\
                  iphlpapi.dll|kernel32.dll|ktmw32.dll|mswsock.dll|msvcrt.dll|netapi32.dll|\
                  normaliz.dll|ntdll.dll|ole32.dll|oleaut32.dll|powrprof.dll|psapi.dll|\
                  secur32.dll|setupapi.dll|shell32.dll|shlwapi.dll|user32.dll|userenv.dll|\
                  uuid.dll|version.dll|winmm.dll|wldap32.dll|ws2_32.dll) ;;
                  *) foreign="${foreign} ${dll}" ;;
                esac
              done
              if [ -n "${foreign}" ]; then
                echo "::error::${BINARY_NAME} imports DLL(s) Windows does not ship:${foreign} — they must be linked in"
                exit 1
              fi
              ;;
          esac
          echo "${BINARY_NAME}: no runtime library dependency"
      - name: Stage wallet sign-in assets
        run: |
          SDN_WALLET_NODE_MODULES="${PWD}/sdn-js/node_modules" deployment/wallet-wasm/stage-wallet-wasm.sh \
            "${PWD}/dist/wallet-wasm" "${PWD}/dist/wallet-ui"
          test -f dist/wallet-wasm/runtime/index.mjs
          test -f dist/wallet-ui/compat/index.js
      - name: Build self-contained CLI archive
        run: |
          # Every target links the runtime in, so no bundle stages one.
          WASMEDGE_BUNDLE_ARG=""
          # --channel release, NOT beta: 'beta' is the internal fleet dev
          # lane's channel, and its binary-only payloads brick a public
          # install (they carry no runtime/). A public bundle must only ever
          # resolve the public feed.
          node deployment/release/build-self-contained-cli.mjs \
            --version "${PACKAGE_VERSION}" \
            --os "${TARGET_OS}" \
            --arch "${TARGET_ARCH}" \
            --channel release \
            --output-dir dist/cli \
            --binary-path "${PWD}/dist/cli-input/${BINARY_NAME}" \
            --kubo-path "${PWD}/dist/kubo/kubo/${KUBO_BINARY_NAME}" \
            --sdnUIPath "${PWD}/dist/ipfs/sdn-admin" \
            --webUIPath "${PWD}/dist/ipfs/ipfs-webui" \
            --updater-wasm-path "${PWD}/packages/sdn-updater-module/dist/isomorphic/module.wasm" \
            --hd-wallet-wasm-path "${PWD}/node_modules/hd-wallet-wasm/dist/hd-wallet-wasi.wasm" \
            --wallet-wasm-path "${PWD}/dist/wallet-wasm" \
            --wallet-ui-path "${PWD}/dist/wallet-ui" \
            ${WASMEDGE_BUNDLE_ARG} \
            --license-path "${PWD}/LICENSE" \
            --readme-path "${PWD}/README.md" \
            --manifest-signature "github-actions:${RELEASE_TAG}:${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/cli/spacedatanetwork-${{ needs.beta-version.outputs.package_version }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.${{ matrix.archive_extension }}

  cli-update-feed:
    name: Build signed CLI update feed
    runs-on: ubuntu-latest
    needs: [beta-version, cli]
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.beta-version.outputs.package_version }}
      SDN_UPDATE_SIGNING_KEY_PEM: ${{ secrets.SDN_UPDATE_SIGNING_KEY_PEM }}
      SDN_UPDATE_KEY_ID: ${{ secrets.SDN_UPDATE_KEY_ID }}
      SDN_UPDATE_SEQUENCE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The feed is what lets an installed node upgrade itself, and every payload
      # in it is signed. Without the key there is nothing honest to publish — but
      # refusing to publish a feed is not a reason to refuse to publish the
      # binaries, which is what failing here did: the whole release job is
      # downstream, so one absent secret meant zero downloadable artifacts.
      - name: Check for the update signing key
        id: signing
        run: |
          if [[ -n "${SDN_UPDATE_SIGNING_KEY_PEM:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned release::SDN_UPDATE_SIGNING_KEY_PEM is not set, so this release ships no self-upgrade feed. Installed nodes will not see it as an update. Set the secret to restore the feed."
          fi
      - name: Build signed CLI update feed
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          update_key_id="${SDN_UPDATE_KEY_ID:-sdn-beta-release}"
          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload_dir="dist/update-payloads"
          feed_tree_root="dist/update-feed-tree"
          feed_dir="${feed_tree_root}/update-feed"
          out_dir="dist/update-feed"
          rm -rf "${payload_dir}" "${feed_tree_root}" "${out_dir}"
          mkdir -p "${payload_dir}" "${out_dir}"
          feed_args=(--out-dir "${feed_dir}" --generated-at "${created_at}")
          targets=(
            "darwin amd64 tar.gz"
            "darwin arm64 tar.gz"
            "linux amd64 tar.gz"
            "linux arm64 tar.gz"
            "windows amd64 zip"
          )
          for target in "${targets[@]}"; do
            read -r target_os target_arch target_ext <<< "${target}"
            archive_path="dist/cli/spacedatanetwork-${VERSION}-${target_os}-${target_arch}.${target_ext}"
            payload_out="${payload_dir}/${target_os}-${target_arch}"
            if [[ ! -f "${archive_path}" ]]; then
              echo "missing CLI archive for update feed: ${archive_path}" >&2
              exit 1
            fi
            # Must match the channel the bundles above were stamped with,
            # or the shipped updater reads a feed index nobody publishes.
            node deployment/release/build-cli-update-payload.mjs \
              --bundle-archive "${archive_path}" \
              --version "${VERSION}" \
              --sequence "${SDN_UPDATE_SEQUENCE}" \
              --channel release \
              --platform "${target_os}" \
              --arch "${target_arch}" \
              --key-id "${update_key_id}" \
              --created-at "${created_at}" \
              --out-dir "${payload_out}"
            feed_args+=(--entry "${payload_out}/manifest.json:${payload_out}/update.wasm")
          done
          node deployment/release/build-sdn-update-feed.js "${feed_args[@]}"
          tar -czf "dist/update-feed/spacedatanetwork-update-feed-${VERSION}.tar.gz" -C "${feed_tree_root}" update-feed
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: cli-update-feed
          path: dist/update-feed/spacedatanetwork-update-feed-${{ needs.beta-version.outputs.package_version }}.tar.gz

  desktop:
    name: Build desktop app artifacts (${{ matrix.target_os }}-${{ matrix.target_arch }})
    runs-on: ${{ matrix.runner }}
    # The Windows CLI archive it consumes is no longer experimental, but this
    # leg still is: packaging that archive into an installer has never yet run
    # to completion, because until the static link was fixed the archive did
    # not exist. Its first known hazard is already fixed (stage-node-bundle.mjs
    # assumed `unzip`, which Git for Windows does not ship); drop the flag once
    # a Windows installer has actually been produced. Until then it must not be
    # able to skip the release for the three platforms that DO build.
    continue-on-error: ${{ matrix.experimental == true }}
    needs: [beta-version, cli]
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: macos
            target_arch: arm64
            runner: macos-14
            cli_artifact: cli-darwin-arm64
            cli_bundle: spacedatanetwork-VERSION-darwin-arm64.tar.gz
            builder_args: --mac dmg zip --arm64
          - target_os: macos
            target_arch: x64
            runner: macos-15-intel
            cli_artifact: cli-darwin-amd64
            cli_bundle: spacedatanetwork-VERSION-darwin-amd64.tar.gz
            builder_args: --mac dmg zip --x64
          - target_os: windows
            target_arch: x64
            runner: windows-latest
            experimental: true
            cli_artifact: cli-windows-amd64
            cli_bundle: spacedatanetwork-VERSION-windows-amd64.zip
            builder_args: --win nsis portable --x64
          - target_os: linux
            target_arch: x64
            runner: ubuntu-latest
            cli_artifact: cli-linux-amd64
            cli_bundle: spacedatanetwork-VERSION-linux-amd64.tar.gz
            builder_args: --linux AppImage deb tar.xz --x64
    env:
      PACKAGE_VERSION: ${{ needs.beta-version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      # The desktop app SHIPS the node: each app carries the self-contained
      # bundle the cli job built for its own operating system and architecture.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cli_artifact }}
          path: dist/cli
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux desktop packaging dependencies
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg
      - name: Install Desktop dependencies
        working-directory: desktop
        # `npm --prefix desktop ci` resolved devDependencies against the REPO
        # root, so electron was never installed in desktop/node_modules and
        # electron-builder failed with "Cannot compute electron version from
        # installed node modules". working-directory is unambiguous.
        run: npm ci
      - name: Stage the node bundle
        run: |
          bundle="dist/cli/${CLI_BUNDLE/VERSION/${PACKAGE_VERSION}}"
          test -f "${bundle}"
          node desktop/scripts/stage-node-bundle.mjs --from "${bundle}"
        env:
          CLI_BUNDLE: ${{ matrix.cli_bundle }}
      # electron-builder takes the version from desktop/package.json, which is
      # a checked-in literal nothing stamps — so every release so far shipped
      # desktop artifacts labelled with whatever that file happened to say.
      # v1.0.5-beta.59 published 11 assets named 1.0.5-beta.1 beside 10 named
      # 1.0.5-beta.59: the installer a user downloads reports a version that is
      # not the release it came from, which no support conversation or update
      # check can recover from. Written with node rather than `npm version` so
      # no lifecycle script runs and no git tag is attempted.
      - name: Stamp the desktop version
        run: |
          node -e '
            const fs = require("node:fs");
            const path = "desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            const version = process.env.PACKAGE_VERSION;
            if (!version) { throw new Error("PACKAGE_VERSION is empty"); }
            pkg.version = version;
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
            console.log(`desktop/package.json version = ${version}`);
          '
      - name: Build Desktop artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
        working-directory: desktop
        run: npm exec -- electron-builder --publish never ${{ matrix.builder_args }}
      - name: Collect Desktop artifacts
        run: |
          mkdir -p dist/desktop
          find desktop/dist -maxdepth 1 -type f -exec cp {} dist/desktop/ \;
          # The two macOS legs run on different runners and each writes a
          # latest-mac.yml listing only its own architecture, so the release
          # job's merge-multiple download let one overwrite the other —
          # v1.0.5-beta.69 shipped the x64 one and would have updated every
          # Apple Silicon install onto the Intel build. Name them apart here;
          # scripts/merge-mac-update-feed.mjs puts them back together.
          if [ -f dist/desktop/latest-mac.yml ]; then
            mv dist/desktop/latest-mac.yml "dist/desktop/latest-mac-${{ matrix.target_arch }}.yml"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/desktop/*
          if-no-files-found: error

  packages:
    name: Build beta native packages and SBOM
    runs-on: ubuntu-latest
    # Same image as the cli job, for the same reason: this builds the binary the
    # RPM and DEB carry, and the link is what fixes the glibc floor. Building it
    # anywhere newer is what made the install-tests refuse to run the package.
    container: ubuntu:20.04
    needs: [beta-version, ipfs, wasmedge-static]
    env:
      VERSION: ${{ needs.beta-version.outputs.native_package_version }}
      # The RPM/DEB and the VM tarball carry the SAME single-file binary the CLI
      # archives do. Before this they were built against a ~/.wasmedge that no
      # runner has, so the job died on the first line of the packaging script.
      WASMEDGE_DIR: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
    steps:
      - name: Prepare the container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git xz-utils build-essential zlib1g-dev libtinfo-dev rpm
          # The workspace is owned by the runner user and this container is
          # root, so git refuses it as "dubious ownership" and `go build`'s VCS
          # stamping dies with exit status 128. Submodules make a single path
          # insufficient.
          git config --global --add safe.directory '*' 
      - uses: actions/checkout@v4
      - name: Restore the static WasmEdge prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.sdn-wasmedge-static/prefix
          key: wasmedge-static-${{ env.WASMEDGE_VERSION }}-linux-amd64-focal-llvm16-${{ hashFiles('scripts/build-static-wasmedge.sh', 'scripts/wasmedge-static-env.sh') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - name: Restore exact IPFS-published assets
        run: |
          mkdir -p sdn-js/ui/dist webui/build
          cp -R dist/ipfs/sdn-admin/. sdn-js/ui/dist/
          cp -R dist/ipfs/ipfs-webui/. webui/build/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: sdn-server/go.sum
      - name: Install JS dependencies
        working-directory: sdn-js
        run: npm ci
      - name: Install nfpm and syft
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          GOBIN="${RUNNER_TEMP}/bin" go install "github.com/goreleaser/nfpm/v2/cmd/nfpm@${NFPM_VERSION}"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          # No sudo: this job runs as root inside ubuntu:20.04, and the image
          # has no sudo at all ("sudo: not found").
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          "${RUNNER_TEMP}/bin/nfpm" --version
          syft version
      - name: Build RPM and DEB artifacts
        run: deployment/packaging/build-linux-packages.sh
      - name: Build Linux VM tarball
        run: deployment/scripts/package-linux-vm-bundle.sh
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p dist/sbom
          syft dir:dist/package-root -o cyclonedx-json=dist/sbom/spacedatanetwork-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-artifacts
          path: |
            dist/packages/*
            dist/linux-vm/*.tar.gz
            dist/sbom/spacedatanetwork-sbom.cdx.json

  sdn-js-package:
    name: Build beta sdn-js package
    runs-on: ubuntu-latest
    needs: beta-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sdn-js/package-lock.json
      - name: Install dependencies
        working-directory: sdn-js
        run: npm ci
      - name: Build browser and Node package
        working-directory: sdn-js
        run: npm run build:package
      - name: Pack npm tarball
        working-directory: sdn-js
        run: |
          mkdir -p ../dist/sdn-js
          npm pack --pack-destination ../dist/sdn-js
      - uses: actions/upload-artifact@v4
        with:
          name: sdn-js-package
          path: dist/sdn-js/*.tgz

  artifact-docker-test:
    name: Install and network-test release artifacts
    runs-on: ubuntu-latest
    needs: [beta-version, ipfs, docker, cli, cli-update-feed, packages, sdn-js-package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdn-js-package
          path: dist/sdn-js
      # Both architectures land here; the test picks the amd64 tarball by name
      # (see test-release-artifacts-docker.mjs), since this runner is amd64.
      - uses: actions/download-artifact@v4
        with:
          pattern: container-image-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      # Absent when the signing key is not configured; see cli-update-feed.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cli-update-feed
          path: dist/update-feed
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install artifacts and verify SDN network
        run: npm run test:release-artifacts:docker -- --release-dir dist --timeout-ms 180000

  release:
    name: Publish beta GitHub release
    runs-on: ubuntu-latest
    needs: [beta-version, ipfs, docker, docker-manifest, cli, cli-update-feed, desktop, packages, sdn-js-package, artifact-docker-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipfs-assets
          path: dist/ipfs
      - uses: actions/download-artifact@v4
        with:
          name: package-artifacts
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdn-js-package
          path: dist/sdn-js
      - uses: actions/download-artifact@v4
        with:
          pattern: container-image-*
          path: dist/container-images
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: container-digest
          path: dist/container-digests
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: dist/cli
          merge-multiple: true
      # Absent when the signing key is not configured; see cli-update-feed.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cli-update-feed
          path: dist/update-feed
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/desktop
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build container digest manifest
        run: |
          node - <<'NODE'
          const { readdirSync, readFileSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const dir = 'dist/container-digests';
          const images = readdirSync(dir)
            .filter((file) => file.endsWith('.json'))
            .sort()
            .map((file) => JSON.parse(readFileSync(join(dir, file), 'utf8')));
          writeFileSync('dist/container-digests.json', `${JSON.stringify({ images }, null, 2)}\n`);
          NODE
      - name: Merge the macOS update feeds into one latest-mac.yml
        run: node scripts/merge-mac-update-feed.mjs dist/desktop
      - name: Assemble beta release artifacts
        env:
          VERSION: ${{ needs.beta-version.outputs.package_version }}
          RELEASE_TAG: ${{ needs.beta-version.outputs.release_tag }}
        run: deployment/release/assemble-beta-release-artifacts.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.beta-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.beta-version.outputs.release_name }}
          body_path: dist/release/SDN-BETA-RELEASE.md
          prerelease: false
          make_latest: true
          files: dist/release/*

  published-installer-smoke:
    name: Smoke published installers (${{ matrix.target_os }})
    runs-on: ${{ matrix.runner }}
    # Windows carries the same experimental policy as every other Windows leg.
    # There is no Windows archive in the release while the CLI build is broken,
    # so this leg cannot pass, and letting it fail the whole run would paint a
    # successful release red — which trains everyone to ignore the status.
    continue-on-error: ${{ matrix.experimental == true }}
    needs: [beta-version, release]
    env:
      SDN_VERSION: ${{ needs.beta-version.outputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_os: linux
            runner: ubuntu-latest
          - target_os: macos
            runner: macos-14
          - target_os: windows
            runner: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Smoke clean-user published installer
        run: node deployment/release/published-install-smoke.mjs --platform ${{ matrix.target_os }}
