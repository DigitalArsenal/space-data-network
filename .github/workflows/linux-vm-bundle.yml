name: Build Linux VM Bundle

# PATHS FILTER (owner 2026-10-16): the bundle is built only when the server, the
# sdn-js and webui assets it packs, or the packaging inputs change. GitHub does
# not evaluate path filters for tag pushes, so every v* release tag still builds.
on:
  push:
    branches: [main]
    paths:
      - 'sdn-server/**'
      - 'sdn-js/**'
      - '!sdn-js/spaceaware-ui'
      - '!sdn-js/spaceaware-ui/**'
      - 'sdn-wasi/**'
      - 'webui/**'
      - 'config/**'
      - 'deployment/scripts/**'
      - 'scripts/install-wasmedge.sh'
      - 'suite.versions.json'
      - '.github/workflows/linux-vm-bundle.yml'
      - '.github/actions/**'
    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-vm-bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sdn-server/go.mod
          cache-dependency-path: sdn-server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            sdn-js/package-lock.json
            webui/package-lock.json

      - name: Install sdn-js dependencies
        working-directory: sdn-js
        run: npm ci

      - name: Build IPFS WebUI assets
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Install WasmEdge
        run: ./scripts/install-wasmedge.sh

      - name: Build Linux VM bundle
        run: ./deployment/scripts/package-linux-vm-bundle.sh

      - name: Upload Linux VM bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-vm-bundle
          path: dist/linux-vm/*.tar.gz
