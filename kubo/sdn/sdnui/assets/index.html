<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Space Data Network — Node Console</title>
    <!-- Inline transparent favicon: suppresses the browser's default /favicon.ico
         request (which would 404) with no external origin and no extra route. -->
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">

      <!-- ====================== COLLAPSIBLE RAIL ====================== -->
      <aside class="sdn-rail" id="rail" aria-label="Primary">
        <div class="rail-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 32 32" style="display:block;">
              <defs>
                <linearGradient id="sdnMark" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#6fe6f2"></stop>
                  <stop offset="1" stop-color="#1d8597"></stop>
                </linearGradient>
              </defs>
              <path fill="url(#sdnMark)" d="M9.3 4.4 L13.4 4.4 L13.4 11 L18.6 11 L18.6 4.4 L22.7 4.4 L29.4 16 L22.7 27.6 L9.3 27.6 L2.6 16 Z"></path>
              <path fill="none" stroke="#9ff0fa" stroke-width="0.7" stroke-opacity="0.5" d="M2.6 16 L9.3 4.4 L13.4 4.4 M18.6 4.4 L22.7 4.4 L29.4 16"></path>
            </svg>
          </span>
          <span class="lbl" style="line-height:1.3;">
            <span class="brand-name">SPACE DATA NET</span>
            <span class="brand-sub">LOCAL NODE · DESKTOP</span>
          </span>
        </div>

        <span class="lbl rail-kicker">IDENTITY &amp; PEERS</span>
        <nav class="nav-group">
          <button class="nav-i active" data-route="node" type="button" title="Node">
            <span class="nav-ico" aria-hidden="true">◉</span>
            <span class="lbl nav-lbl">NODE<span class="nav-fkey">N1</span></span>
          </button>
          <button class="nav-i" data-route="peers" type="button" title="Peers">
            <span class="nav-ico" aria-hidden="true">◍</span>
            <span class="lbl nav-lbl">PEERS<span class="nav-fkey">N2</span></span>
          </button>
        </nav>

        <span class="lbl rail-kicker spaced">OPERATIONS</span>
        <nav class="nav-group">
          <button class="nav-i" data-route="data" type="button" title="Data">
            <span class="nav-ico" aria-hidden="true">▤</span>
            <span class="lbl nav-lbl">DATA<span class="nav-fkey">N3</span></span>
          </button>
          <button class="nav-i" data-route="channels" type="button" title="Channels">
            <span class="nav-ico" aria-hidden="true">⧉</span>
            <span class="lbl nav-lbl">CHANNELS<span class="nav-fkey">N4</span></span>
          </button>
        </nav>

        <span class="lbl rail-kicker spaced">APPS &amp; MODULES</span>
        <nav class="nav-group">
          <button class="nav-i" data-route="apps" type="button" title="Apps">
            <span class="nav-ico" aria-hidden="true">◆</span>
            <span class="lbl nav-lbl">APPS<span class="nav-fkey">N5</span></span>
          </button>
          <button class="nav-i" data-route="modules" type="button" title="Modules">
            <span class="nav-ico" aria-hidden="true">⬢</span>
            <span class="lbl nav-lbl">MODULES<span class="nav-fkey">N6</span></span>
          </button>
        </nav>

        <div class="rail-spacer"></div>

        <span class="lbl rail-kicker">SERVED BY THIS NODE</span>
        <span class="lbl rail-kicker" style="letter-spacing:0.08em;color:#5d7681;padding-bottom:0;">
          <span class="mono">/sdn/v1</span>
        </span>
      </aside>

      <!-- ====================== MAIN ====================== -->
      <main class="main">
        <header class="top-bar">
          <div>
            <p class="eyebrow">SPACE OPERATIONS NETWORK CONSOLE</p>
            <div class="title-line">
              <h1 id="screen-title">NODE</h1>
              <span class="title-sub" id="screen-sub">· LOCAL NODE</span>
            </div>
          </div>
          <div class="status-strip" id="status-strip" aria-live="polite">
            <span class="status-chip"><span class="dot"></span>CONNECTING</span>
          </div>
        </header>

        <section id="screen" class="content" aria-live="polite"></section>
      </main>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
