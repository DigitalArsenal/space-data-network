# SDN Local Cluster Simulation
# Simulates a local libp2p network with full nodes, edge relays, and registry builder.
#
# Run deployment/scripts/local-cluster.sh prepare before using this compose file
# directly. The script creates deployment/generated/* and deployment/.env.

x-bootstrap-ws-addr: &bootstrap-ws-addr "/dns4/full-node-1/tcp/8080/ws/p2p/${SDN_LOCAL_BOOTSTRAP_PEER_ID:?Run deployment/scripts/local-cluster.sh prepare first}"
x-bootstrap-tcp-addr: &bootstrap-tcp-addr "/dns4/full-node-1/tcp/4001/p2p/${SDN_LOCAL_BOOTSTRAP_PEER_ID:?Run deployment/scripts/local-cluster.sh prepare first}"

services:
  full-node-1:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    container_name: sdn-full-1
    hostname: full-node-1
    environment:
      - SDN_MODE=full
      - SDN_MAX_MESSAGE_SIZE=${SDN_MAX_MESSAGE_SIZE:-10485760}
      - SDN_MAX_CONNECTIONS=${SDN_MAX_CONNECTIONS:-1000}
    ports:
      - "15001:5001"
      - "4001:4001"
      - "4001:4001/udp"
      - "18080:8080"
    volumes:
      - full-node-1-data:/app/data
      - ./generated/full-node-1.yaml:/app/config/full-docker.yaml:ro
      - ./generated/node.key:/app/keys/node.key:ro
    networks:
      - sdn-network
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:5001/api/v1/status || wget -q --spider http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '${SDN_FULL_NODE_CPU_LIMIT:-2}'
          memory: ${SDN_FULL_NODE_MEM_LIMIT:-4g}
        reservations:
          cpus: '0.5'
          memory: 512m

  full-node-2:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    container_name: sdn-full-2
    hostname: full-node-2
    environment:
      - SDN_MODE=full
      - SDN_MAX_MESSAGE_SIZE=${SDN_MAX_MESSAGE_SIZE:-10485760}
      - SDN_MAX_CONNECTIONS=${SDN_MAX_CONNECTIONS:-1000}
    ports:
      - "15002:5001"
      - "4002:4001"
      - "4002:4001/udp"
      - "8081:8080"
    volumes:
      - full-node-2-data:/app/data
      - full-node-2-keys:/app/keys
      - ./generated/full-node-2.yaml:/app/config/full-docker.yaml:ro
    networks:
      - sdn-network
    depends_on:
      - full-node-1
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:5001/api/v1/status || wget -q --spider http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '${SDN_FULL_NODE_CPU_LIMIT:-2}'
          memory: ${SDN_FULL_NODE_MEM_LIMIT:-4g}
        reservations:
          cpus: '0.5'
          memory: 512m

  edge-relay-us:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    container_name: sdn-edge-us
    hostname: edge-relay-us
    environment:
      - SDN_REGION=us-east
    ports:
      - "8090:8080"
      - "8091:8081"
    networks:
      - sdn-network
    entrypoint: ["/app/spacedatanetwork-edge"]
    command: ["--debug", "--listen", "/ip4/0.0.0.0/tcp/8080/ws", "--bootstrap", *bootstrap-tcp-addr, "--health-port", "8081"]
    depends_on:
      - full-node-1
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '${SDN_EDGE_CPU_LIMIT:-1}'
          memory: ${SDN_EDGE_MEM_LIMIT:-512m}
        reservations:
          cpus: '0.25'
          memory: 128m

  edge-relay-eu:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    container_name: sdn-edge-eu
    hostname: edge-relay-eu
    environment:
      - SDN_REGION=eu-west
    ports:
      - "8092:8080"
      - "8093:8081"
    networks:
      - sdn-network
    entrypoint: ["/app/spacedatanetwork-edge"]
    command: ["--listen", "/ip4/0.0.0.0/tcp/8080/ws", "--bootstrap", *bootstrap-ws-addr, "--health-port", "8081"]
    depends_on:
      - full-node-1
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '${SDN_EDGE_CPU_LIMIT:-1}'
          memory: ${SDN_EDGE_MEM_LIMIT:-512m}
        reservations:
          cpus: '0.25'
          memory: 128m

  edge-relay-asia:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    container_name: sdn-edge-asia
    hostname: edge-relay-asia
    environment:
      - SDN_REGION=asia-tokyo
    ports:
      - "8094:8080"
      - "8095:8081"
    networks:
      - sdn-network
    entrypoint: ["/app/spacedatanetwork-edge"]
    command: ["--listen", "/ip4/0.0.0.0/tcp/8080/ws", "--bootstrap", *bootstrap-ws-addr, "--health-port", "8081"]
    depends_on:
      - full-node-1
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '${SDN_EDGE_CPU_LIMIT:-1}'
          memory: ${SDN_EDGE_MEM_LIMIT:-512m}
        reservations:
          cpus: '0.25'
          memory: 128m

  registry-builder:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.registry
    container_name: sdn-registry
    hostname: registry-builder
    volumes:
      - registry-output:/app/output
    networks:
      - sdn-network
    command: ["--bootstrap", *bootstrap-ws-addr, "--poll", "1m", "--output", "/app/output"]
    depends_on:
      - full-node-1
      - edge-relay-us
      - edge-relay-eu
      - edge-relay-asia
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '${SDN_REGISTRY_CPU_LIMIT:-0.5}'
          memory: ${SDN_REGISTRY_MEM_LIMIT:-256m}
        reservations:
          cpus: '0.1'
          memory: 64m

networks:
  sdn-network:
    driver: bridge

volumes:
  full-node-1-data:
  full-node-2-data:
  full-node-2-keys:
  registry-output:
