# 50-aot-cache.conf — persistent FlatSQL AOT artifact cache.
#
# WHY: sdn-retriever.service runs as root with PrivateTmp=true + ProtectHome=true,
# so Go os.UserCacheDir() cannot resolve $HOME/.cache (root has no accessible HOME
# under this hardening) and falls back to TempDir()/flatsql-aot, which lives in the
# unit private /tmp — wiped every restart. Result: the daemon can never retain an
# AOT artifact and every flow runs interpreted. Filed by Hephaestus 2026-07-28 at
# the request of Hermes-3, live-verified from host-01 journal
# ("flatsqlrt: precompiled AOT artifact not found at /tmp/flatsql-aot/...").
#
# FIX: point XDG_CACHE_HOME at the persistent data volume, inside the existing
# ReadWritePaths=/mnt/volume_nyc3_01 grant (no hardening surface added) and beside
# this daemon's existing data/keys/raw dirs. Go stdlib os.UserCacheDir() honours
# XDG_CACHE_HOME first, so the daemon resolves
# /mnt/volume_nyc3_01/sdn-retriever/cache/flatsql-aot without any code change.
#
# Applied live on host-01 2026-07-28: daemon-reload only, unit NOT restarted
# (mid-ingest). Directory created 0700 root:root before reload. Takes effect on
# the next restart, which is Hermes-3's guarded cutover under /run/sdn-deploy.lock.
[Service]
Environment=XDG_CACHE_HOME=/mnt/volume_nyc3_01/sdn-retriever/cache
