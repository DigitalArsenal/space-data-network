# ONE BOX, ONE NODE - owner law 2026-07-28, verbatim:
#   never ever have more than one instance running on a box from here on out
#   with our current deployment.
#
# Drop-in, NOT an edit: Hermes-3 owns sdn-retriever.service content, Hephaestus
# owns the law. Adds the systemd belt without touching that file.
#
# Conflicts= makes systemd STOP the others rather than join them - which also
# covers a hand-run systemctl start and a boot race where two units are enabled,
# neither of which a deploy-script check can see.
#
# List VERIFIED LIVE on host-02 2026-07-28, not assumed:
#   kubo.service  RUNNING /usr/local/bin/ipfs daemon --agent-version-suffix=sdn-celestrak
#                 COUNTS: advertises to the network AS an SDN node even though
#                 its name and binary path both say otherwise.
#   sdn-kubo.service  RUNNING, SDN Kubo Node (celestrak)
#   spacedatanetwork.service / spacedatanetwork-ingest.service  installed, disabled
[Unit]
Conflicts=kubo.service sdn-kubo.service spacedatanetwork.service spacedatanetwork-ingest.service
