mode: full

network:
  listen:
    - /ip4/0.0.0.0/tcp/4001
    - /ip4/0.0.0.0/tcp/8080/ws
    - /ip4/0.0.0.0/udp/4001/quic-v1
    - /ip4/0.0.0.0/udp/4003/webrtc-direct
  bootstrap:
    - /dnsaddr/bootstrap.spacedatanetwork.org/p2p/16Uiu2HAm1LbvwjEHW2GDP2ZQZvwHLZrz2jbYoRLQmJEQ3wZ5Fm45
    - /ip4/159.203.150.8/tcp/4001/p2p/16Uiu2HAm1LbvwjEHW2GDP2ZQZvwHLZrz2jbYoRLQmJEQ3wZ5Fm45
    - /ip4/159.203.150.8/tcp/8080/ws/p2p/16Uiu2HAm1LbvwjEHW2GDP2ZQZvwHLZrz2jbYoRLQmJEQ3wZ5Fm45
  max_connections: 1000
  enable_relay: true

storage:
  path: /var/lib/spacedatanetwork/data
  max_size: 35GB
  gc_interval: 1h

schemas:
  validate: true
  strict: true

admin:
  enabled: true
  listen_addr: 127.0.0.1:5001
  require_auth: false
  session_expiry: 24h
  totp_required: false
  tls_enabled: false
  frontend_path: /var/lib/spacedatanetwork/frontend
  admin_ui_path: /opt/spacedatanetwork/admin-ui
  webui_path: /opt/spacedatanetwork/webui
  ipfs_api_url: http://127.0.0.1:5002
  ipfs_gateway_url: http://127.0.0.1:8081

# In-daemon ingest (single-writer topology, loop C.6b): the FlatSQL v2
# store admits exactly ONE writer process, so the former separate
# spacedatanetwork-ingest.service can no longer share this daemon's storage
# path (a second writer open fails with a store-lock error). The CelesTrak
# sync workers run inside the daemon instead. Space-Track/UDL credentials,
# if ever enabled, come from SPACETRACK_IDENTITY/SPACETRACK_PASSWORD and
# UDL_USERNAME/UDL_PASSWORD environment variables in a private systemd
# drop-in on spacedatanetwork.service — never from this file.
ingest:
  enabled: true
  raw_path: /var/lib/spacedatanetwork/raw
  celestrak_interval: 3h
  satcat_interval: 3h
  space_weather_interval: 3h
  # Enabled 2026-07-13 (A2.2c-ST/A2.10 owner directive). Credentials come from
  # SPACETRACK_IDENTITY/SPACETRACK_PASSWORD via the service unit
  # EnvironmentFile (/etc/spacedatanetwork/spacetrack.env, host-only, 600) —
  # never from this repo. Lanes: publicfiles operator-OEM + current-gp
  # full-catalog snapshots (6h poll), in-lane rate-limited (<30/min).
  spacetrack_enabled: true
  udl_enabled: false
  http_timeout: 900s
  dataset_publish_url: http://127.0.0.1:5001/api/v1/admin/dataset-updates/publish

setup:
  token_expiry: 10m
  data_path: /var/lib/spacedatanetwork/data

tor:
  enabled: false

peers:
  enable_dht: true
  enable_mdns: false
  trusted_peers:
    - /ip4/159.203.150.8/tcp/4001/p2p/16Uiu2HAm1LbvwjEHW2GDP2ZQZvwHLZrz2jbYoRLQmJEQ3wZ5Fm45
    - /ip4/159.203.150.8/tcp/8080/ws/p2p/16Uiu2HAm1LbvwjEHW2GDP2ZQZvwHLZrz2jbYoRLQmJEQ3wZ5Fm45
