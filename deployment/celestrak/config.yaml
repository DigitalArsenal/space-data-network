mode: full

network:
  listen:
    - /ip4/0.0.0.0/tcp/4001
    - /ip4/0.0.0.0/tcp/8080/ws
    - /ip4/0.0.0.0/udp/4001/quic-v1
    - /ip4/0.0.0.0/udp/4003/webrtc-direct
  bootstrap:
    - /ip4/159.203.150.8/tcp/4004/ws/p2p/16Uiu2HAm1LbvwjEHW2GDP2ZQZvwHLZrz2jbYoRLQmJEQ3wZ5Fm45
  max_connections: 1000
  enable_relay: true

storage:
  path: /var/lib/spacedatanetwork/data
  max_size: 35GB
  gc_interval: 1h

schemas:
  validate: true
  strict: true

admin:
  enabled: true
  listen_addr: 127.0.0.1:5001
  require_auth: false
  session_expiry: 24h
  totp_required: false
  tls_enabled: false
  frontend_path: /var/lib/spacedatanetwork/frontend
  admin_ui_path: /opt/spacedatanetwork/admin-ui
  webui_path: /opt/spacedatanetwork/webui
  ipfs_api_url: http://127.0.0.1:5002
  ipfs_gateway_url: http://127.0.0.1:8081

# In-daemon ingest (single-writer topology, loop C.6b): the FlatSQL v2
# store admits exactly ONE writer process, so the former separate
# spacedatanetwork-ingest.service can no longer share this daemon's storage
# path (a second writer open fails with a store-lock error). The CelesTrak
# sync workers run inside the daemon instead. Space-Track/UDL credentials,
# if ever enabled, come from SPACETRACK_IDENTITY/SPACETRACK_PASSWORD and
# UDL_USERNAME/UDL_PASSWORD environment variables in a private systemd
# drop-in on spacedatanetwork.service — never from this file.
ingest:
  enabled: true
  raw_path: /var/lib/spacedatanetwork/raw
  celestrak_interval: 3h
  satcat_interval: 3h
  space_weather_interval: 3h
  # Enabled 2026-07-13 (A2.2c-ST/A2.10 owner directive). Credentials come from
  # SPACETRACK_IDENTITY/SPACETRACK_PASSWORD via the service unit
  # EnvironmentFile (/etc/spacedatanetwork/spacetrack.env, host-only, 600) —
  # never from this repo. Lanes: publicfiles operator-OEM + current-gp
  # full-catalog snapshots (6h poll), in-lane rate-limited (<30/min).
  spacetrack_enabled: true
  udl_enabled: false
  http_timeout: 900s
  dataset_publish_url: http://127.0.0.1:5001/api/v1/admin/dataset-updates/publish

# Republication of INGESTED lanes (sdn-rfb-publish-to-consumer-node,
# 2026-08-04). The CelesTrak lanes publish themselves from inside their flow
# (the publish_request node above, via ingest.dataset_publish_url). The SatNOGS
# RF flow has no publish node, so its $RFB batch — 5,289 emitter records,
# verified live on this host 2026-08-03 — landed in the store and NEVER
# replicated to the consumer node: nothing had ever fired a publication for it.
#
# Each lane here republishes on the host's own queue when a batch lands, off
# the flow's thread (an in-flow publish trigger is what deadlocked the GP flow
# for 100 minutes with zero store writes). Fail-closed: absent = publishes
# nothing, which is why a share-alike source must be named deliberately.
#
# SatNOGS DB is CC-BY-SA-4.0 and republication IS the owner ruling of
# 2026-08-03 ("publish them on SDN"); the licence travels with the batch
# (DPMSourceBatch LICENSE/LICENSE_URL/CITATION) and per record (RFB.CITATION).
#
# Cellular $TBS lane (sdn-tbs-feed-sync-for-cache-lane, 2026-08-21): the
# aggregate cache on the consumer node (host-01, sdn.spaceaware.io) serves
# from ITS LOCAL sds_tbs store, while the cell-tower ingest flow is
# owner-placed on THIS host (host-02, celestrak.eth). The mechanism that
# moves $TBS rows between them is the SDN's own data plane — the same
# dataset-feed-head-sync lane as RFB. This lane is the producer-side trigger:
# a landed cell-tower batch (attribution defaulting to provider "opencellid",
# source "cell-tower-bulk") becomes a dataset publication with a feed-head
# announcement on this host's own queue. The consumer's feed-head
# subscription is schema-generic (every embedded validator schema, TBS.fbs
# included) and its materialize path (ImportDatasetShardFromFiles,
# schema-agnostic) fills host-01's sds_tbs. This lane is OFF-THREAD and
# fail-closed like the RFB lane; absent = nothing ships, so the source is
# named deliberately.
publishing:
  auto_publish:
    - schema: RFB.fbs
      source_name: satnogs-db
      # The SatNOGS timer is daily; this only bounds a retry/restart burst.
      min_interval: 30m
    - schema: TBS.fbs
      source_name: cell-tower-bulk
      # The cell-tower ingest timer is interval-driven; this bounds a
      # retry/restart burst, it never withholds a landed batch.
      min_interval: 30m

setup:
  token_expiry: 10m
  data_path: /var/lib/spacedatanetwork/data

tor:
  enabled: false

peers:
  enable_dht: true
  enable_mdns: false
  trusted_peers:

# Module scheduled-run budget (2026-07-14, SDN 7d473ec4): the 1-vCPU celestrak
# host runs modulert wasm interpreted and the in-daemon ingest competes for
# the core, so adapter pulls need far more than the 10m scheduled default.
# Interactive invokes keep the 30s fail-closed cap regardless.
modules:
  scheduled_invoke_timeout: 60m
