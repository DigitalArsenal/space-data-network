<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" fill="none">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#666"/>
    </marker>
  </defs>

  <!-- Loop over the per-window stages -->
  <path d="M590 92V40H90v38" stroke="#666" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="340" y="32" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="11">next time window (6 h SGP4, 2 h trajectories)</text>

  <!-- 1 Load -->
  <rect x="10" y="80" width="130" height="96" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="75" y="102" text-anchor="middle" fill="#333" font-family="sans-serif" font-size="13" font-weight="600">Load index</text>
  <text x="75" y="122" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">one propagator</text>
  <text x="75" y="136" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">per run; records</text>
  <text x="75" y="150" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">kept as emitted</text>
  <text x="75" y="169" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="10">WASM module</text>

  <path d="M140 128h20" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2 Coarse grid -->
  <rect x="162" y="80" width="130" height="96" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="227" y="102" text-anchor="middle" fill="#333" font-family="sans-serif" font-size="13" font-weight="600">Coarse grid</text>
  <text x="227" y="122" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">state every 60 s</text>
  <text x="227" y="136" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">+ motion bound D</text>
  <text x="227" y="150" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">per object</text>
  <text x="227" y="169" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="10">WASM module, threads</text>

  <path d="M292 128h20" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3 Pair search: GPU or CPU -->
  <rect x="314" y="80" width="130" height="96" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="379" y="100" text-anchor="middle" fill="#333" font-family="sans-serif" font-size="13" font-weight="600">Pair search</text>
  <text x="379" y="117" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">GPU: spatial grid,</text>
  <text x="379" y="130" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">f32 + slack</text>
  <path d="M326 138h106" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="379" y="152" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">no GPU: module</text>
  <text x="379" y="165" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">spatial grid, f64</text>

  <path d="M444 128h20" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 4 Re-test and refine -->
  <rect x="466" y="80" width="130" height="96" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="531" y="102" text-anchor="middle" fill="#333" font-family="sans-serif" font-size="13" font-weight="600">Refine</text>
  <text x="531" y="122" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">f64 re-test, TCA,</text>
  <text x="531" y="136" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">miss distance,</text>
  <text x="531" y="150" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">speed, max Pc</text>
  <text x="531" y="169" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="10">WASM module, threads</text>

  <path d="M596 128h20" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 5 Merge -->
  <rect x="618" y="80" width="96" height="96" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="666" y="102" text-anchor="middle" fill="#333" font-family="sans-serif" font-size="13" font-weight="600">Merge</text>
  <text x="666" y="122" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">TCA owns</text>
  <text x="666" y="136" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">its window,</text>
  <text x="666" y="150" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">reported once</text>
  <text x="666" y="169" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="10">host</text>

  <!-- Inputs -->
  <path d="M75 238v-60" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="10" y="240" width="200" height="40" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="256" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">SGP4 element sets,</text>
  <text x="110" y="270" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">loaded once</text>
  <text x="220" y="264" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="11">or</text>
  <rect x="230" y="240" width="250" height="40" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="355" y="256" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">one propagator's trajectories ($PRW),</text>
  <text x="355" y="270" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">per window, e.g. the HPOP farm</text>
  <path d="M300 238v-22H120v-38" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output -->
  <path d="M666 178v60" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="500" y="240" width="214" height="40" rx="8" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="607" y="256" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">conjunctions within 5 km,</text>
  <text x="607" y="270" text-anchor="middle" fill="#333" font-family="monospace" font-size="10">excluded objects</text>

  <text x="360" y="312" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="11">All physics runs in WASM modules. The host moves records and contains none.</text>
</svg>
