<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
  <title id="t">Same miss distance, different risk</title>
  <desc id="d">Two close approaches with the same predicted miss distance. On the left the uncertainty regions are small and far apart. On the right they are long and overlap, so a collision is possible.</desc>
  <rect width="900" height="380" rx="18" fill="#0b0b0c"/>
  <line x1="450" y1="30" x2="450" y2="350" stroke="#ffffff" stroke-opacity=".12"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- left: tight -->
    <text x="225" y="56" font-size="18" font-weight="700" fill="#f5f5f7">Tight uncertainty</text>
    <line x1="60" y1="240" x2="330" y2="150" stroke="#ffffff" stroke-opacity=".2" stroke-dasharray="5 5"/>
    <line x1="120" y1="110" x2="390" y2="250" stroke="#ffffff" stroke-opacity=".2" stroke-dasharray="5 5"/>
    <ellipse cx="170" cy="202" rx="34" ry="12" transform="rotate(-18 170 202)" fill="#f5f5f7" fill-opacity=".14" stroke="#f5f5f7" stroke-opacity=".7"/>
    <ellipse cx="280" cy="198" rx="34" ry="12" transform="rotate(27 280 198)" fill="#f5a524" fill-opacity=".18" stroke="#f5a524"/>
    <circle cx="170" cy="202" r="4" fill="#f5f5f7"/><circle cx="280" cy="198" r="4" fill="#f5a524"/>
    <line x1="170" y1="170" x2="280" y2="170" stroke="#8e8e93"/><line x1="170" y1="164" x2="170" y2="176" stroke="#8e8e93"/><line x1="280" y1="164" x2="280" y2="176" stroke="#8e8e93"/>
    <text x="225" y="160" font-size="14" fill="#8e8e93">200 m</text>
    <text x="225" y="310" font-size="15" fill="#f5f5f7" fill-opacity=".85">Regions never touch.</text>
    <text x="225" y="332" font-size="15" fill="#f5f5f7" fill-opacity=".85">No maneuver needed.</text>
    <!-- right: loose -->
    <text x="675" y="56" font-size="18" font-weight="700" fill="#f5f5f7">Loose uncertainty</text>
    <line x1="510" y1="240" x2="780" y2="150" stroke="#ffffff" stroke-opacity=".2" stroke-dasharray="5 5"/>
    <line x1="570" y1="110" x2="840" y2="250" stroke="#ffffff" stroke-opacity=".2" stroke-dasharray="5 5"/>
    <ellipse cx="620" cy="202" rx="118" ry="30" transform="rotate(-18 620 202)" fill="#f5f5f7" fill-opacity=".1" stroke="#f5f5f7" stroke-opacity=".7"/>
    <ellipse cx="730" cy="198" rx="118" ry="30" transform="rotate(27 730 198)" fill="#f5a524" fill-opacity=".14" stroke="#f5a524"/>
    <circle cx="620" cy="202" r="4" fill="#f5f5f7"/><circle cx="730" cy="198" r="4" fill="#f5a524"/>
    <line x1="620" y1="120" x2="730" y2="120" stroke="#8e8e93"/><line x1="620" y1="114" x2="620" y2="126" stroke="#8e8e93"/><line x1="730" y1="114" x2="730" y2="126" stroke="#8e8e93"/>
    <text x="675" y="110" font-size="14" fill="#8e8e93">200 m</text>
    <text x="675" y="310" font-size="15" fill="#f5f5f7" fill-opacity=".85">Regions overlap.</text>
    <text x="675" y="332" font-size="15" fill="#f5a524">A collision is possible.</text>
  </g>
</svg>
