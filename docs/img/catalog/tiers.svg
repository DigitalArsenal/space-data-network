<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="t d">
  <title id="t">One catalog, three tiers of access</title>
  <desc id="d">The public gets general-perturbation elements. High-accuracy orbits need a sharing agreement. State vectors with their uncertainty are closely held.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8e8e93"/></marker>
  </defs>
  <rect width="880" height="440" rx="18" fill="#0b0b0c"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- top tier -->
    <path d="M300 40H580L610 140H270Z" fill="#f5a524" fill-opacity=".38" stroke="#f5a524" stroke-width="1.5"/>
    <text x="440" y="78" font-size="19" font-weight="700" fill="#f5f5f7">Orbits + uncertainty</text>
    <text x="440" y="101" font-size="14" fill="#f5f5f7" fill-opacity=".8">State vectors with covariance</text>
    <text x="440" y="124" font-size="13" font-weight="700" fill="#f5a524" letter-spacing="1.2">CLOSELY HELD</text>
    <!-- middle tier -->
    <path d="M266 152H614L644 252H236Z" fill="#f5a524" fill-opacity=".14" stroke="#f5a524" stroke-opacity=".55" stroke-width="1.5"/>
    <text x="440" y="190" font-size="19" font-weight="700" fill="#f5f5f7">High-accuracy catalog</text>
    <text x="440" y="213" font-size="14" fill="#f5f5f7" fill-opacity=".8">Numerical orbits, special perturbations</text>
    <text x="440" y="236" font-size="13" font-weight="700" fill="#f5a524" letter-spacing="1.2">BY SHARING AGREEMENT</text>
    <!-- bottom tier -->
    <path d="M232 264H648L678 364H202Z" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.5"/>
    <text x="440" y="302" font-size="19" font-weight="700" fill="#f5f5f7">General-perturbation elements</text>
    <text x="440" y="325" font-size="14" fill="#f5f5f7" fill-opacity=".8">Two-line element sets and OMMs</text>
    <text x="440" y="348" font-size="13" font-weight="700" fill="#f5f5f7" fill-opacity=".7" letter-spacing="1.2">PUBLIC</text>
    <!-- axes -->
    <line x1="120" y1="360" x2="120" y2="50" stroke="#8e8e93" stroke-width="2" marker-end="url(#a)"/>
    <text x="120" y="398" font-size="14" fill="#8e8e93">More accurate</text>
    <line x1="760" y1="50" x2="760" y2="360" stroke="#8e8e93" stroke-width="2" marker-end="url(#a)"/>
    <text x="760" y="398" font-size="14" fill="#8e8e93">More readers</text>
  </g>
</svg>
