<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="t d">
  <title id="t">How private screening works</title>
  <desc id="d">Illustration. Government X locks its classified orbit with its own key and sends it to Operator B. Operator B works out, on the locked values, how close its own object comes at each moment, using open software, and never sees the orbit; its own orbit never leaves its systems. It sends a locked answer back. Only Government X can open it: SAFE or ALERT. Both operators run it to protect both satellites.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8e8e93"/></marker>
    <g id="lock"><path d="M-3.6 -1V-3.8a3.6 3.6 0 0 1 7.2 0V-1" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="-5.6" y="-1.2" width="11.2" height="9" rx="2.2" fill="currentColor"/></g>
  </defs>
  <rect width="900" height="310" rx="18" fill="#0b0b0c"/>
  <g fill="none" stroke="#8e8e93" stroke-width="1.5">
    <path d="M220 78H258" marker-end="url(#a)"/><path d="M448 78H514" marker-end="url(#a)"/>
    <path d="M520 252H454" marker-end="url(#a)"/><path d="M264 252H226" marker-end="url(#a)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#f5f5f7">
    <rect x="24" y="40" width="196" height="76" rx="14" fill="#1c1c1e" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="44" y="73" font-size="15" font-weight="700">Government X</text>
    <text x="44" y="95" font-size="13" fill-opacity=".6">Classified orbit</text>
    <g color="#8e8e93"><use href="#lock" x="198" y="62"/></g>

    <g fill="#1c1c1e" stroke="#f5a524" stroke-opacity=".55"><rect x="264" y="54" width="184" height="48" rx="12"/><rect x="264" y="228" width="184" height="48" rx="12"/></g>
    <g color="#f5a524"><use href="#lock" x="286" y="77"/><use href="#lock" x="286" y="251"/></g>
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill-opacity=".7"><text x="302" y="83">9f2c 41e7 b0d3 &#8230;</text><text x="302" y="257">c81a 07fe 5d92 &#8230;</text></g>
    <g font-size="13" text-anchor="middle" fill-opacity=".6"><text x="356" y="126">Locked with X&#8217;s own key</text><text x="356" y="218">Locked answer</text></g>
    <text x="356" y="172" text-anchor="middle" font-size="13" fill-opacity=".45">Both operators run it</text>

    <rect x="520" y="40" width="356" height="250" rx="16" fill="#1a1407" stroke="#f5a524" stroke-opacity=".8"/>
    <text x="540" y="72" font-size="17" font-weight="700">Operator B</text>
    <text x="540" y="94" font-size="13" fill-opacity=".6">Planned maneuver</text>
    <path d="M540 110H856" stroke="#ffffff" stroke-opacity=".15"/>
    <g font-size="13.5" fill-opacity=".8"><text x="540" y="136">Works out how close its own object comes</text><text x="540" y="156">at each moment, on the locked values</text><text x="540" y="182">Never sees X&#8217;s orbit; its own orbit</text><text x="540" y="202">never leaves its systems</text></g>
    <path d="M540 222H856" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="540" y="248" font-size="13" font-weight="700" fill="#f5a524">Open software</text>
    <text x="540" y="268" font-size="13" fill-opacity=".8">Anyone can check the math</text>

    <rect x="24" y="200" width="196" height="90" rx="14" fill="#1c1c1e" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="40" y="226" font-size="15" font-weight="700">Government X</text>
    <text x="40" y="245" font-size="13" fill-opacity=".6">Only X can open it</text>
    <rect x="36" y="256" width="78" height="26" rx="13" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".5"/>
    <text x="75" y="274" text-anchor="middle" font-size="13" font-weight="700">SAFE</text>
    <rect x="124" y="256" width="84" height="26" rx="13" fill="#ff3b30" fill-opacity=".18" stroke="#ff3b30"/>
    <text x="166" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#ff3b30">ALERT</text>
  </g>
</svg>
