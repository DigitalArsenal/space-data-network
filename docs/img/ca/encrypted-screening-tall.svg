<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 590" role="img" aria-labelledby="t d">
  <title id="t">How private screening works</title>
  <desc id="d">Illustration. Government X locks its classified orbit with its own key and sends it to Operator B. Operator B works out, on the locked values, how close its own object comes at each moment, using open software, and never sees the orbit; its own orbit never leaves its systems. It sends a locked answer back. Only Government X can open it: SAFE or ALERT. Both operators run it to protect both satellites.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8e8e93"/></marker>
    <g id="lock"><path d="M-3.6 -1V-3.8a3.6 3.6 0 0 1 7.2 0V-1" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="-5.6" y="-1.2" width="11.2" height="9" rx="2.2" fill="currentColor"/></g>
  </defs>
  <rect width="440" height="590" rx="18" fill="#0b0b0c"/>
  <g fill="none" stroke="#8e8e93" stroke-width="1.5">
    <path d="M220 86V108" marker-end="url(#a)"/><path d="M220 186V208" marker-end="url(#a)"/>
    <path d="M220 396V420" marker-end="url(#a)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#f5f5f7">
    <rect x="16" y="20" width="408" height="64" rx="14" fill="#1c1c1e" stroke="#ffffff" stroke-opacity=".18"/>
    <text x="32" y="48" font-size="15" font-weight="700">Government X</text>
    <text x="32" y="68" font-size="13" fill-opacity=".6">Classified orbit</text>
    <g color="#8e8e93"><use href="#lock" x="404" y="40"/></g>

    <g fill="#1c1c1e" stroke="#f5a524" stroke-opacity=".55"><rect x="70" y="114" width="300" height="44" rx="12"/><rect x="70" y="426" width="300" height="44" rx="12"/></g>
    <g color="#f5a524"><use href="#lock" x="92" y="135"/><use href="#lock" x="92" y="447"/></g>
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill-opacity=".7"><text x="108" y="141">9f2c 41e7 b0d3 &#8230;</text><text x="108" y="453">c81a 07fe 5d92 &#8230;</text></g>
    <g font-size="13" text-anchor="middle" fill-opacity=".6"><text x="220" y="178">Locked with X&#8217;s own key</text><text x="220" y="490">Locked answer, back to X</text></g>

    <rect x="16" y="214" width="408" height="180" rx="16" fill="#1a1407" stroke="#f5a524" stroke-opacity=".8"/>
    <text x="32" y="244" font-size="17" font-weight="700">Operator B</text>
    <text x="32" y="264" font-size="13" fill-opacity=".6">Planned maneuver</text>
    <path d="M32 278H408" stroke="#ffffff" stroke-opacity=".15"/>
    <g font-size="13.5" fill-opacity=".8"><text x="32" y="302">Works out how close its own object comes</text><text x="32" y="322">at each moment, on the locked values</text><text x="32" y="346">Never sees X&#8217;s orbit; its own never leaves</text></g>
    <path d="M32 360H408" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="32" y="382" font-size="13" font-weight="700" fill="#f5a524">Open software: anyone can check the math</text>

    <rect x="96" y="504" width="110" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".5"/>
    <text x="151" y="526" text-anchor="middle" font-size="14" font-weight="700">SAFE</text>
    <text x="220" y="526" text-anchor="middle" font-size="13" fill-opacity=".6">or</text>
    <rect x="234" y="504" width="110" height="34" rx="17" fill="#ff3b30" fill-opacity=".18" stroke="#ff3b30"/>
    <text x="289" y="526" text-anchor="middle" font-size="14" font-weight="700" fill="#ff3b30">ALERT</text>
    <text x="220" y="566" text-anchor="middle" font-size="13" fill-opacity=".6">Only Government X can open it</text>
  </g>
</svg>
