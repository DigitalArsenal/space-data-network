<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 540" role="img" aria-labelledby="t d">
  <title id="t">How encrypted screening works</title>
  <desc id="d">Illustration. A government with a classified orbit and an operator with a planned maneuver each encrypt their trajectory before it leaves their own systems. An assessor running open software computes how close the two get at each time step on the encrypted values. The only result anyone reads is SAFE or ALERT.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8e8e93"/></marker>
    <g id="lock"><path d="M-3.6 -1V-3.8a3.6 3.6 0 0 1 7.2 0V-1" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="-5.6" y="-1.2" width="11.2" height="9" rx="2.2" fill="currentColor"/></g>
  </defs>
  <rect width="440" height="540" rx="18" fill="#0b0b0c"/>
  <g fill="none" stroke="#8e8e93" stroke-width="1.5">
    <path d="M114 92V118" marker-end="url(#a)"/><path d="M326 92V118" marker-end="url(#a)"/>
    <path d="M114 168V222" marker-end="url(#a)"/><path d="M326 168V222" marker-end="url(#a)"/>
    <path d="M220 418V446" marker-end="url(#a)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#f5f5f7">
    <g fill="#1c1c1e" stroke="#ffffff" stroke-opacity=".18"><rect x="16" y="20" width="196" height="72" rx="14"/><rect x="228" y="20" width="196" height="72" rx="14"/></g>
    <g font-size="15" font-weight="700"><text x="32" y="51">Government X</text><text x="244" y="51">Operator B</text></g>
    <g font-size="13" fill-opacity=".6"><text x="32" y="73">Classified orbit</text><text x="244" y="73">Planned maneuver</text></g>
    <g color="#8e8e93"><use href="#lock" x="192" y="40"/><use href="#lock" x="404" y="40"/></g>

    <g fill="#1c1c1e" stroke="#f5a524" stroke-opacity=".55"><rect x="16" y="124" width="196" height="44" rx="12"/><rect x="228" y="124" width="196" height="44" rx="12"/></g>
    <g color="#f5a524"><use href="#lock" x="38" y="145"/><use href="#lock" x="250" y="145"/></g>
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill-opacity=".7"><text x="54" y="151">9f2c 41e7 &#8230;</text><text x="266" y="151">c81a 07fe &#8230;</text></g>
    <g font-size="13" text-anchor="middle" fill-opacity=".6"><text x="220" y="193">Encrypted before</text><text x="220" y="211">it leaves its owner</text></g>

    <rect x="70" y="228" width="300" height="190" rx="16" fill="#1a1407" stroke="#f5a524" stroke-opacity=".8"/>
    <text x="220" y="262" text-anchor="middle" font-size="17" font-weight="700">Assessor</text>
    <g font-size="13.5" text-anchor="middle" fill-opacity=".8"><text x="220" y="292">Computes how close the two get</text><text x="220" y="312">at each time step, on the</text><text x="220" y="332">encrypted values</text></g>
    <path d="M100 352H340" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="220" y="378" text-anchor="middle" font-size="13" font-weight="700" fill="#f5a524">Open software</text>
    <text x="220" y="398" text-anchor="middle" font-size="13" fill-opacity=".8">Anyone can check the math</text>

    <rect x="96" y="452" width="110" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".5"/>
    <text x="151" y="474" text-anchor="middle" font-size="14" font-weight="700">SAFE</text>
    <text x="220" y="474" text-anchor="middle" font-size="13" fill-opacity=".6">or</text>
    <rect x="234" y="452" width="110" height="34" rx="17" fill="#ff3b30" fill-opacity=".18" stroke="#ff3b30"/>
    <text x="289" y="474" text-anchor="middle" font-size="14" font-weight="700" fill="#ff3b30">ALERT</text>
    <text x="220" y="516" text-anchor="middle" font-size="13" fill-opacity=".6">The only result anyone reads</text>
  </g>
</svg>
