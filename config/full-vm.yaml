mode: full

network:
  # NO bootstrap override. A configured list REPLACES the built-in defaults
  # rather than extending them, and the defaults are the only thing that
  # contributes a public Amino DHT bootstrapper. This file used to name the two
  # SDN production peers and nothing else, which left every node installed from
  # a package with a near-empty routing table: not findable through the
  # rendezvous, and unable to discover any peer it had not been handed.
  # bootstrap.DefaultBootstrapAddresses() already includes BOTH of those peers
  # plus the public bootstrappers, so the defaults are strictly better.

storage:
  path: /var/lib/spacedatanetwork/data
  max_size: 10GB
  gc_interval: 1h

admin:
  enabled: true
  # LOOPBACK BY DEFAULT. This bound to 0.0.0.0 with tls_enabled: false, so on a
  # VM the admin API and dashboard were reachable from the whole network and the
  # session bearer token crossed it in cleartext. require_auth protects who may
  # call it, not who may read the call. Expose it deliberately — behind a TLS
  # terminator, or by setting this to 0.0.0.0 once tls_enabled is true.
  listen_addr: 127.0.0.1:5001
  require_auth: true
  session_expiry: 24h
  totp_required: false
  tls_enabled: false
  frontend_path: /var/lib/spacedatanetwork/frontend
  admin_ui_path: /opt/spacedatanetwork/admin-ui
  webui_path: /opt/spacedatanetwork/webui

setup:
  token_expiry: 10m
  data_path: /var/lib/spacedatanetwork/data

tor:
  enabled: false
