# Docker development configuration
# Local dev admin wallet is tracked in ./dev-wallet.env

mode: full

network:
  listen:
    - /ip4/0.0.0.0/tcp/4001
    - /ip4/0.0.0.0/tcp/8080/ws
  bootstrap:
    - /dnsaddr/bootstrap.spacedatanetwork.org/p2p/16Uiu2HAmP8KTvYP2i7Ef2Lf7Vbn5beZf2aMTpq4pmQAK6SjRphYT
    - /dnsaddr/bootstrap.spacedatanetwork.org/p2p/16Uiu2HAm9oK2jAeVC2RMESFcYfq7BKGp2K2CCDxzoKhB5s9vpbj3
    - /ip4/159.203.150.8/tcp/4001/p2p/16Uiu2HAmP8KTvYP2i7Ef2Lf7Vbn5beZf2aMTpq4pmQAK6SjRphYT
    - /ip4/167.172.219.213/tcp/4001/p2p/16Uiu2HAm9oK2jAeVC2RMESFcYfq7BKGp2K2CCDxzoKhB5s9vpbj3
  edge_relays: []
  max_connections: 100
  enable_relay: false
  max_message_size: 10485760
  max_schema_name: 256
  max_query_size: 4096

storage:
  path: /app/data
  max_size: 1GB
  gc_interval: 1h

schemas:
  validate: true
  strict: false

tor:
  enabled: false

peers:
  strict_mode: false
  enable_dht: false
  enable_mdns: false

admin:
  enabled: true
  listen_addr: 0.0.0.0:5001
  http_challenge_addr: 0.0.0.0:5080
  require_auth: true
  session_expiry: 24h
  totp_required: false
  tls_mode: managed
  tls_cache_dir: /app/data/tls
  webui_path: /app/webui
  wallet_ui_path: /app/wallet-ui

# Local dev admin wallet: see ./dev-wallet.env
users:
  - xpub: "xpub6DHm9a1bDz4qPHGMQqQ386E76KFhxsx4ZmVjm1K9HfiCVh2jNc77AgFtWtEScGRKNqArC7gEjRW8iPFJSgroCAB8tdZpkoXQj2hkZgRiENw"
    signing_pubkey_hex: "de65b6a3c2ddbe3593d96782bb3195931fdc1b5cfdcf31a019ba6bee8d4d5720"
    trust_level: "admin"
    name: "Dev Admin"

setup:
  token_expiry: 10m
  data_path: /app/data
