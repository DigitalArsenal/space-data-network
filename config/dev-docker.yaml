# Docker development configuration
# Local dev admin wallet is tracked in ./dev-wallet.env

mode: full

network:
  listen:
    - /ip4/0.0.0.0/tcp/4001
    - /ip4/0.0.0.0/tcp/8080/ws
  # NO bootstrap list here, deliberately. A configured list REPLACES the
  # built-in defaults instead of extending them, and the defaults are the only
  # thing contributing a public Amino DHT bootstrapper. This file used to name
  # the two SDN production peers and nothing else, which left every dev node
  # with a near-empty routing table: not findable through the rendezvous, and
  # unable to discover any peer it had not been handed directly. It reads as
  # the obviously correct config and is why the discovery path was misdiagnosed
  # three times.
  #
  # bootstrap.DefaultBootstrapAddresses() already includes BOTH SDN production
  # peers (159.203.150.8:4004/ws spaceaware, 167.172.219.213:4001 celestrak)
  # plus the public DHT bootstrappers, so the defaults are strictly better than
  # what was here. The wss/443-through-nginx route stays the browser-reachable
  # alternate via the edge-relay path.
  edge_relays: []
  max_connections: 100
  enable_relay: false
  max_message_size: 10485760
  max_schema_name: 256
  max_query_size: 4096

storage:
  path: /app/data
  max_size: 1GB
  gc_interval: 1h

schemas:
  validate: true
  strict: false

tor:
  enabled: false

peers:
  strict_mode: false
  enable_dht: false
  enable_mdns: false

admin:
  enabled: true
  listen_addr: 0.0.0.0:5001
  http_challenge_addr: 0.0.0.0:5080
  require_auth: true
  session_expiry: 24h
  totp_required: false
  tls_mode: managed
  tls_cache_dir: /app/data/tls
  webui_path: /app/webui
  wallet_ui_path: /app/wallet-ui

# Local dev admin wallet: see ./dev-wallet.env
users:
  - xpub: "xpub6Bkg9i9EdSNTYhW6FvaFAtpxpRFQtj5MQFifvLnJgKKUP8zBFycj56PHwkaZ6pMqaiCd3vMAkzb4JgDVFCvyAugvpdghxUHH36C3kQhKFhy"
    signing_pubkey_hex: "e31e29b7c8b76bd08012ae0a917eced0067a183e9f1de980a7ef377115578f93"
    trust_level: "admin"
    name: "Dev Admin"

setup:
  token_expiry: 10m
  data_path: /app/data
