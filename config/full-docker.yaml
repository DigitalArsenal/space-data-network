mode: full

network:
  # NO bootstrap override. A configured list REPLACES the built-in defaults
  # rather than extending them, and the defaults are the only thing that
  # contributes a public Amino DHT bootstrapper. This file used to name the two
  # SDN production peers and nothing else, which left every node installed from
  # a package with a near-empty routing table: not findable through the
  # rendezvous, and unable to discover any peer it had not been handed.
  # bootstrap.DefaultBootstrapAddresses() already includes BOTH of those peers
  # plus the public bootstrappers, so the defaults are strictly better.

storage:
  path: /app/data/store
  max_size: 10GB
  gc_interval: 1h

admin:
  enabled: true
  # 0.0.0.0 is correct HERE and not in full-vm.yaml: inside a container this is
  # the container's own interface, and what the host exposes is decided by the
  # port mapping (publish it as 127.0.0.1:5001:5001 unless you mean to share
  # it). tls_enabled is still false, so do not map this to a public interface
  # without a TLS terminator in front — the session bearer token is not
  # protected by require_auth.
  listen_addr: 0.0.0.0:5001
  require_auth: true
  session_expiry: 24h
  totp_required: false
  tls_enabled: false
  webui_path: /app/webui

peers:
  registry_path: /app/data/peers.db

tor:
  enabled: false
  hidden_service_enabled: false

flows:
  enabled: false
  storage_path: /app/data/flows

setup:
  token_expiry: 10m
  data_path: /app/data

# Wallet sign-in assets staged into the image by deployment/wallet-wasm/stage-wallet-wasm.sh
wallet_wasm:
  assets_dir: /app/wallet-wasm
  ui_assets_dir: /app/wallet-ui
