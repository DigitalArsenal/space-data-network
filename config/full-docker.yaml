mode: full

network:
  bootstrap:
    - /ip4/159.203.150.8/tcp/4004/ws/p2p/16Uiu2HAm1LbvwjEHW2GDP2ZQZvwHLZrz2jbYoRLQmJEQ3wZ5Fm45
    - /ip4/167.172.219.213/tcp/4001/p2p/16Uiu2HAmGjaPxkWFSXBbmhs9K5x1Zo6euJw95VjS6Jj2bcPpYr2U

storage:
  path: /app/data/store
  max_size: 10GB
  gc_interval: 1h

admin:
  enabled: true
  listen_addr: 0.0.0.0:5001
  require_auth: true
  session_expiry: 24h
  totp_required: false
  tls_enabled: false
  webui_path: /app/webui

peers:
  registry_path: /app/data/peers.db

tor:
  enabled: false
  hidden_service_enabled: false

flows:
  enabled: false
  storage_path: /app/data/flows

setup:
  token_expiry: 10m
  data_path: /app/data

# Wallet sign-in assets staged into the image by deployment/wallet-wasm/stage-wallet-wasm.sh
wallet_wasm:
  assets_dir: /app/wallet-wasm
  ui_assets_dir: /app/wallet-ui
