<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SDN showreel renderer</title>
    <style>
      html, body { margin: 0; background: #000; }
      canvas { display: block; width: 100vw; height: auto; }
    </style>
  </head>
  <body>
    <script type="module">
      import { createShowreel } from "./showreel.js";
      const reel = await createShowreel();
      window.showreel = reel;
      document.body.append(reel.canvas);
      const q = new URLSearchParams(location.search);
      if (q.has("t")) {
        reel.renderFrame(Math.round(Number(q.get("t")) * reel.FPS));
      } else if (q.has("play")) {
        let i = 0;
        const tick = () => { reel.renderFrame(i); i = (i + 1) % reel.frames; requestAnimationFrame(tick); };
        tick();
      }
      window.showreelReady = true;
    </script>
  </body>
</html>
